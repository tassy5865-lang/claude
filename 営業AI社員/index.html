<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>営業AI社員</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background-color: #0b0f19; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        /** @jsx React.createElement */
        /** @jsxFrag React.Fragment */
        const { useState, useEffect } = React;

        const STORAGE_KEY = 'salesPipelineDeals';
        const STATUS_OPTIONS = ['未アプローチ', '提案中', '商談中', '受注', '失注'];

        function todayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function loadDeals() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                console.error('案件データの読み込みに失敗しました', e);
                return [];
            }
        }

        function saveDeals(deals) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(deals));
                return true;
            } catch (e) {
                console.error('案件データの保存に失敗しました', e);
                return false;
            }
        }

        function isClosedStatus(status) {
            return status === '受注' || status === '失注';
        }

        const MODEL_PRESETS = [
            { label: 'Claude Sonnet 5(バランス重視)', value: 'claude-sonnet-5' },
            { label: 'Claude Opus 5(最高品質)', value: 'claude-opus-5' },
            { label: 'Claude Haiku 4.5(最安)', value: 'claude-haiku-4-5' },
        ];
        const DEFAULT_MODEL = 'claude-sonnet-5';

        function loadApiKey() {
            try {
                return localStorage.getItem('claudeApiKey') || '';
            } catch (e) {
                return '';
            }
        }

        function loadModel() {
            try {
                return localStorage.getItem('claudeModel') || DEFAULT_MODEL;
            } catch (e) {
                return DEFAULT_MODEL;
            }
        }

        const TEXT_TYPE_OPTIONS = [
            { value: 'proposal', label: '提案・アプローチメール' },
            { value: 'quote', label: '見積もり・提案書としての文章' },
            { value: 'followup', label: 'フォローアップ・返信文' },
        ];

        async function generateSalesText({ apiKey, model, companyName, textType, tone, dealMemo, dealResearchNotes, closedDeals }) {
            const textTypeLabel = (TEXT_TYPE_OPTIONS.find(t => t.value === textType) || {}).label || textType;

            let prompt = 'あなたは受託・フリーランスで開発の仕事をしている営業担当です。以下の条件で営業文を作成してください。\n\n';
            prompt += `宛先の会社名: ${companyName || '(未指定)'}\n`;
            prompt += `文章の種類: ${textTypeLabel}\n`;
            if (tone && tone.trim()) {
                prompt += `トーン・要望: ${tone.trim()}\n`;
            }
            if (dealMemo && dealMemo.trim()) {
                prompt += `\n参考情報(この案件のメモ):\n${dealMemo.trim()}\n`;
            }
            if (dealResearchNotes && dealResearchNotes.trim()) {
                prompt += `\n参考情報(この案件のリサーチメモ):\n${dealResearchNotes.trim()}\n`;
            }
            if (closedDeals && closedDeals.length > 0) {
                prompt += '\n過去の受注・失注案件の傾向(参考):\n';
                closedDeals.forEach(d => {
                    prompt += `- ${d.companyName}: ${d.status}${d.memo ? '(' + d.memo + ')' : ''}\n`;
                });
            }
            prompt += '\n本文をそのまま送信できる形で出力してください。前置きや説明は不要です。\n';
            prompt += '本文の後に、必ず見出し「### 改善アドバイス」を1行だけ出力し、その下にこの文章のトーンや構成について改善できる点を3行程度の箇条書きで書いてください。';

            const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': apiKey,
                    'anthropic-version': '2023-06-01',
                    'anthropic-dangerous-direct-browser-access': 'true',
                },
                body: JSON.stringify({
                    model: model,
                    max_tokens: 2048,
                    messages: [{ role: 'user', content: prompt }],
                }),
            });

            if (!response.ok) {
                const errBody = await response.text();
                throw new Error(`API呼び出しに失敗しました (${response.status}): ${errBody}`);
            }

            const data = await response.json();
            const textBlock = (data.content || []).find(b => b.type === 'text');
            const fullText = textBlock ? textBlock.text : '';

            if (!fullText.trim()) {
                throw new Error(data.stop_reason === 'refusal'
                    ? 'AIが生成を拒否しました。内容を変えて再試行してください。'
                    : 'APIから本文を取得できませんでした。');
            }

            const marker = '### 改善アドバイス';
            const markerIndex = fullText.indexOf(marker);
            if (markerIndex === -1) {
                return { body: fullText.trim(), advice: '' };
            }
            return {
                body: fullText.slice(0, markerIndex).trim(),
                advice: fullText.slice(markerIndex + marker.length).trim(),
            };
        }

        async function callClaudeWithTools({ apiKey, model, prompt, tools, maxTokens }) {
            const headers = {
                'Content-Type': 'application/json',
                'x-api-key': apiKey,
                'anthropic-version': '2023-06-01',
                'anthropic-dangerous-direct-browser-access': 'true',
            };
            let messages = [{ role: 'user', content: prompt }];
            let data;
            let continuations = 0;
            const MAX_CONTINUATIONS = 3;
            while (true) {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({ model: model, max_tokens: maxTokens, tools: tools, messages: messages }),
                });

                if (!response.ok) {
                    const errBody = await response.text();
                    throw new Error(`API呼び出しに失敗しました (${response.status}): ${errBody}`);
                }

                data = await response.json();
                if (data.stop_reason === 'pause_turn' && continuations < MAX_CONTINUATIONS) {
                    messages = [...messages, { role: 'assistant', content: data.content }];
                    continuations++;
                    continue;
                }
                break;
            }
            return data;
        }

        async function researchCompany({ apiKey, model, query }) {
            let prompt = 'あなたは受託・フリーランスで開発の仕事をしている営業担当のリサーチ担当です。';
            prompt += '以下の会社について、Web検索を使って調査し、営業アプローチの参考になるよう要約してください。\n\n';
            prompt += `調査対象: ${query}\n\n`;
            prompt += '調査対象がURLの場合は、Web取得ツールでそのページの内容を直接確認したうえで要約に反映してください。\n';
            prompt += '出力には以下を含めてください:\n';
            prompt += '- 事業内容の概要\n';
            prompt += '- 抱えていそうな課題・ニーズ\n';
            prompt += '- 営業上の接点になりそうな情報(採用状況、最近のニュース、技術スタックなど)\n';
            prompt += '前置きや断り書きは不要です。箇条書き中心で簡潔にまとめてください。';

            const data = await callClaudeWithTools({
                apiKey,
                model,
                prompt,
                maxTokens: 4096,
                tools: [
                    { type: 'web_search_20250305', name: 'web_search', max_uses: 5 },
                    { type: 'web_fetch_20250910', name: 'web_fetch', max_uses: 5 },
                ],
            });

            const text = (data.content || [])
                .filter(b => b.type === 'text')
                .map(b => b.text)
                .join('\n')
                .trim();

            if (data.stop_reason === 'pause_turn') {
                const note = '\n\n[注意: 検索回数の上限に達したため、調査が完了しないまま打ち切られました。結果は不完全な可能性があります。]';
                return (text || '(調査結果を取得できませんでした)') + note;
            }

            if (!text) {
                throw new Error(data.stop_reason === 'refusal'
                    ? 'AIが調査を拒否しました。内容を変えて再試行してください。'
                    : 'APIから調査結果を取得できませんでした。');
            }
            return text;
        }

        async function findLeadCandidates({ apiKey, model, keywords }) {
            let prompt = 'あなたは受託・フリーランスで開発の仕事をしている営業担当です。';
            prompt += 'Web検索を使って、以下の条件に合いそうな新規営業先の候補企業を5〜8社程度探してください。\n\n';
            prompt += `条件・キーワード: ${keywords}\n\n`;
            prompt += '出力は必ず、説明文を一切含めず、以下の形式のJSON配列のみにしてください:\n';
            prompt += '[{"companyName": "会社名", "reason": "候補として挙げた理由(1〜2文)"}, ...]';

            const data = await callClaudeWithTools({
                apiKey,
                model,
                prompt,
                maxTokens: 4096,
                tools: [{ type: 'web_search_20250305', name: 'web_search', max_uses: 5 }],
            });

            const fullText = (data.content || [])
                .filter(b => b.type === 'text')
                .map(b => b.text)
                .join('\n')
                .trim();

            if (!fullText) {
                throw new Error(data.stop_reason === 'refusal'
                    ? 'AIが調査を拒否しました。内容を変えて再試行してください。'
                    : data.stop_reason === 'pause_turn'
                        ? '検索回数の上限に達したため、候補を取得できませんでした。キーワードを絞って再試行してください。'
                        : 'APIから候補を取得できませんでした。');
            }

            const start = fullText.indexOf('[');
            const end = fullText.lastIndexOf(']');
            if (start === -1 || end === -1 || end < start) {
                return { candidates: null, rawText: fullText };
            }
            try {
                const parsed = JSON.parse(fullText.slice(start, end + 1));
                if (!Array.isArray(parsed)) {
                    return { candidates: null, rawText: fullText };
                }
                return {
                    candidates: parsed
                        .filter(c => c && typeof c.companyName === 'string' && c.companyName.trim())
                        .map(c => ({ companyName: c.companyName.trim(), reason: typeof c.reason === 'string' ? c.reason.trim() : '' })),
                    rawText: fullText,
                };
            } catch (e) {
                return { candidates: null, rawText: fullText };
            }
        }

        function App() {
            const [deals, setDeals] = useState(loadDeals);
            const [newCompanyName, setNewCompanyName] = useState('');
            const [saveError, setSaveError] = useState(false);

            useEffect(() => {
                setSaveError(!saveDeals(deals));
            }, [deals]);

            const [apiKey, setApiKey] = useState(loadApiKey);
            const [model, setModel] = useState(loadModel);
            const [showSettings, setShowSettings] = useState(false);

            useEffect(() => {
                try { localStorage.setItem('claudeApiKey', apiKey); } catch (e) {}
            }, [apiKey]);

            useEffect(() => {
                try { localStorage.setItem('claudeModel', model); } catch (e) {}
            }, [model]);

            const [activeTab, setActiveTab] = useState('pipeline');
            const [researchMode, setResearchMode] = useState('leads');

            const [researchQuery, setResearchQuery] = useState('');
            const [researchLoading, setResearchLoading] = useState(false);
            const [researchError, setResearchError] = useState('');
            const [researchResultText, setResearchResultText] = useState('');
            const [researchSaveDealId, setResearchSaveDealId] = useState('');
            const [researchSaveConfirmed, setResearchSaveConfirmed] = useState(false);

            useEffect(() => {
                if (researchSaveDealId && !deals.some(d => d.id === researchSaveDealId)) {
                    setResearchSaveDealId('');
                }
            }, [deals, researchSaveDealId]);

            const [leadsKeywords, setLeadsKeywords] = useState('');
            const [leadsLoading, setLeadsLoading] = useState(false);
            const [leadsError, setLeadsError] = useState('');
            const [leadsCandidates, setLeadsCandidates] = useState(null);
            const [leadsRawText, setLeadsRawText] = useState('');
            const [addedLeadNames, setAddedLeadNames] = useState([]);

            const [composeSelectedDealId, setComposeSelectedDealId] = useState('');
            const [composeManualCompany, setComposeManualCompany] = useState('');
            const [composeTextType, setComposeTextType] = useState(TEXT_TYPE_OPTIONS[0].value);
            const [composeTone, setComposeTone] = useState('');
            const [composeLoading, setComposeLoading] = useState(false);
            const [composeError, setComposeError] = useState('');
            const [composeResultBody, setComposeResultBody] = useState('');
            const [composeResultAdvice, setComposeResultAdvice] = useState('');

            useEffect(() => {
                if (composeSelectedDealId && !deals.some(d => d.id === composeSelectedDealId)) {
                    setComposeSelectedDealId('');
                }
            }, [deals, composeSelectedDealId]);

            async function handleGenerate() {
                setComposeLoading(true);
                setComposeError('');
                try {
                    const selectedDeal = deals.find(d => d.id === composeSelectedDealId) || null;
                    const companyName = selectedDeal ? selectedDeal.companyName : composeManualCompany;
                    const closedDeals = deals.filter(d => isClosedStatus(d.status));
                    const result = await generateSalesText({
                        apiKey,
                        model,
                        companyName,
                        textType: composeTextType,
                        tone: composeTone,
                        dealMemo: selectedDeal ? selectedDeal.memo : '',
                        dealResearchNotes: selectedDeal ? selectedDeal.researchNotes : '',
                        closedDeals,
                    });
                    setComposeResultBody(result.body);
                    setComposeResultAdvice(result.advice);
                } catch (e) {
                    setComposeError(e.message || '生成に失敗しました');
                } finally {
                    setComposeLoading(false);
                }
            }

            function saveGeneratedText() {
                if (!composeSelectedDealId || !composeResultBody) return;
                const target = deals.find(d => d.id === composeSelectedDealId);
                if (!target) return;
                const entry = {
                    type: composeTextType,
                    tone: composeTone,
                    body: composeResultBody,
                    createdAt: new Date().toISOString(),
                };
                updateDeal(composeSelectedDealId, { history: [...(target.history || []), entry] });
            }

            async function handleResearchIndividual() {
                setResearchLoading(true);
                setResearchError('');
                setResearchResultText('');
                setResearchSaveConfirmed(false);
                try {
                    const text = await researchCompany({ apiKey, model, query: researchQuery });
                    setResearchResultText(text);
                } catch (e) {
                    setResearchError(e.message || '調査に失敗しました');
                } finally {
                    setResearchLoading(false);
                }
            }

            function saveResearchNotes() {
                if (!researchSaveDealId || !researchResultText) return;
                const target = deals.find(d => d.id === researchSaveDealId);
                if (!target) return;
                const dateLabel = new Date().toLocaleDateString('ja-JP');
                const entry = `[${dateLabel}]\n${researchResultText}`;
                const merged = target.researchNotes ? `${target.researchNotes}\n\n---\n${entry}` : entry;
                updateDeal(researchSaveDealId, { researchNotes: merged });
                setResearchSaveConfirmed(true);
            }

            async function handleFindLeads() {
                setLeadsLoading(true);
                setLeadsError('');
                setLeadsCandidates(null);
                setLeadsRawText('');
                try {
                    const result = await findLeadCandidates({ apiKey, model, keywords: leadsKeywords });
                    setLeadsCandidates(result.candidates);
                    setLeadsRawText(result.rawText);
                } catch (e) {
                    setLeadsError(e.message || '検索に失敗しました');
                } finally {
                    setLeadsLoading(false);
                }
            }

            function addLeadToPipeline(candidate) {
                const trimmed = candidate.companyName.trim();
                if (!trimmed || addedLeadNames.includes(trimmed)) return;
                const newDeal = {
                    id: crypto.randomUUID(),
                    companyName: trimmed,
                    status: STATUS_OPTIONS[0],
                    nextActionDate: '',
                    memo: '',
                    researchNotes: candidate.reason || '',
                    history: [],
                    createdAt: new Date().toISOString(),
                };
                setDeals(prev => [...prev, newDeal]);
                setAddedLeadNames(prev => [...prev, trimmed]);
            }

            function addDeal(companyName) {
                const trimmed = companyName.trim();
                if (!trimmed) return;
                const newDeal = {
                    id: crypto.randomUUID(),
                    companyName: trimmed,
                    status: STATUS_OPTIONS[0],
                    nextActionDate: '',
                    memo: '',
                    researchNotes: '',
                    history: [],
                    createdAt: new Date().toISOString(),
                };
                setDeals(prev => [...prev, newDeal]);
                setNewCompanyName('');
            }

            function deleteDeal(id) {
                if (!window.confirm('この案件を削除しますか？')) return;
                setDeals(prev => prev.filter(d => d.id !== id));
            }

            function updateDeal(id, patch) {
                setDeals(prev => prev.map(d => d.id === id ? { ...d, ...patch } : d));
            }

            function handleAddSubmit(e) {
                e.preventDefault();
                addDeal(newCompanyName);
            }

            const sortedDeals = [...deals].sort((a, b) => {
                // 受注/失注はソート上「日付未設定」と同様に扱い、上位に固定されないようにする
                const aDate = isClosedStatus(a.status) ? '' : a.nextActionDate;
                const bDate = isClosedStatus(b.status) ? '' : b.nextActionDate;
                if (!aDate && !bDate) return 0;
                if (!aDate) return 1;
                if (!bDate) return -1;
                return aDate.localeCompare(bDate);
            });
            const today = todayStr();

            return (
                <div className="min-h-screen text-slate-100 p-6 max-w-4xl mx-auto">
                    <div className="flex items-center justify-between mb-6">
                        <h1 className="text-2xl font-bold">営業AI社員</h1>
                        <button
                            onClick={() => setShowSettings(true)}
                            className="relative bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm"
                            title="API設定"
                        >
                            ⚙️ 設定
                            {!apiKey && (
                                <span className="absolute -top-1 -right-1 w-3 h-3 bg-rose-500 rounded-full"></span>
                            )}
                        </button>
                    </div>

                    {showSettings && (
                        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50" onClick={() => setShowSettings(false)}>
                            <div className="bg-slate-800 border border-slate-600 rounded p-6 w-full max-w-md" onClick={e => e.stopPropagation()}>
                                <h2 className="text-lg font-bold mb-4">API設定</h2>
                                <label className="block text-sm text-slate-400 mb-1">Claude APIキー</label>
                                <input
                                    type="password"
                                    value={apiKey}
                                    onChange={e => setApiKey(e.target.value)}
                                    placeholder="sk-ant-..."
                                    className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm mb-4 focus:outline-none focus:border-indigo-500"
                                />
                                <label className="block text-sm text-slate-400 mb-1">モデル</label>
                                <select
                                    value={MODEL_PRESETS.some(p => p.value === model) ? model : '__custom__'}
                                    onChange={e => setModel(e.target.value === '__custom__' ? '' : e.target.value)}
                                    className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm mb-2"
                                >
                                    {MODEL_PRESETS.map(p => (
                                        <option key={p.value} value={p.value}>{p.label}</option>
                                    ))}
                                    <option value="__custom__">カスタム(モデルIDを直接入力)</option>
                                </select>
                                {!MODEL_PRESETS.some(p => p.value === model) && (
                                    <input
                                        type="text"
                                        value={model}
                                        onChange={e => setModel(e.target.value)}
                                        placeholder="モデルIDを入力"
                                        className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm mb-4 focus:outline-none focus:border-indigo-500"
                                    />
                                )}
                                <button
                                    onClick={() => setShowSettings(false)}
                                    className="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-4 py-2 rounded w-full mt-2"
                                >
                                    閉じる
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="flex gap-2 mb-6 border-b border-slate-700">
                        <button
                            onClick={() => setActiveTab('pipeline')}
                            className={'px-4 py-2 text-sm font-semibold border-b-2 -mb-px ' + (activeTab === 'pipeline' ? 'border-indigo-500 text-white' : 'border-transparent text-slate-400 hover:text-slate-200')}
                        >
                            案件パイプライン
                        </button>
                        <button
                            onClick={() => setActiveTab('research')}
                            className={'px-4 py-2 text-sm font-semibold border-b-2 -mb-px ' + (activeTab === 'research' ? 'border-indigo-500 text-white' : 'border-transparent text-slate-400 hover:text-slate-200')}
                        >
                            案件リサーチ
                        </button>
                        <button
                            onClick={() => setActiveTab('compose')}
                            className={'px-4 py-2 text-sm font-semibold border-b-2 -mb-px ' + (activeTab === 'compose' ? 'border-indigo-500 text-white' : 'border-transparent text-slate-400 hover:text-slate-200')}
                        >
                            営業文作成
                        </button>
                    </div>

                    {saveError && (
                        <div className="bg-rose-950 border border-rose-700 text-rose-200 rounded p-3 mb-4 text-sm">
                            変更を保存できませんでした。プライベートブラウジングモードやストレージ容量の制限が原因の可能性があります。
                        </div>
                    )}

                    {activeTab === 'pipeline' && (
                        <>
                            <form onSubmit={handleAddSubmit} className="flex gap-2 mb-6">
                                <input
                                    type="text"
                                    value={newCompanyName}
                                    onChange={e => setNewCompanyName(e.target.value)}
                                    placeholder="会社名を入力"
                                    className="flex-1 bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
                                />
                                <button
                                    type="submit"
                                    className="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-4 py-2 rounded"
                                >
                                    + 案件を追加
                                </button>
                            </form>

                            {deals.length === 0 ? (
                                <p className="text-slate-400 text-sm">案件がまだありません。「+ 案件を追加」から始めましょう。</p>
                            ) : (
                                <ul className="space-y-2">
                                    {sortedDeals.map(deal => (
                                        <li
                                            key={deal.id}
                                            className={
                                                'rounded p-3 border ' +
                                                (deal.nextActionDate && deal.nextActionDate <= today && !isClosedStatus(deal.status)
                                                    ? 'bg-rose-950 border-rose-700'
                                                    : 'bg-slate-800 border-slate-700')
                                            }
                                        >
                                            <div className="flex items-center justify-between mb-2">
                                                <span className="font-medium">{deal.companyName}</span>
                                                <button
                                                    onClick={() => deleteDeal(deal.id)}
                                                    className="text-slate-400 hover:text-rose-400 text-sm"
                                                >
                                                    削除
                                                </button>
                                            </div>
                                            <div className="flex flex-wrap gap-2 items-center text-sm mb-2">
                                                <select
                                                    value={deal.status}
                                                    onChange={e => updateDeal(deal.id, { status: e.target.value })}
                                                    className="bg-slate-900 border border-slate-600 rounded px-2 py-1"
                                                >
                                                    {STATUS_OPTIONS.map(s => (
                                                        <option key={s} value={s}>{s}</option>
                                                    ))}
                                                </select>
                                                <label className="flex items-center gap-1 text-slate-400">
                                                    {deal.nextActionDate && deal.nextActionDate <= today && !isClosedStatus(deal.status) && (
                                                        <span className="text-rose-400 font-semibold mr-1">要フォロー</span>
                                                    )}
                                                    次アクション日:
                                                    <input
                                                        type="date"
                                                        value={deal.nextActionDate}
                                                        onChange={e => updateDeal(deal.id, { nextActionDate: e.target.value })}
                                                        className="bg-slate-900 border border-slate-600 rounded px-2 py-1"
                                                    />
                                                </label>
                                            </div>
                                            <textarea
                                                value={deal.memo}
                                                onChange={e => updateDeal(deal.id, { memo: e.target.value })}
                                                placeholder="メモ"
                                                rows={2}
                                                className="w-full bg-slate-900 border border-slate-600 rounded px-2 py-1 text-sm focus:outline-none focus:border-indigo-500"
                                            />
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </>
                    )}

                    {activeTab === 'research' && (
                        <div>
                            <div className="flex gap-2 mb-4">
                                <button
                                    onClick={() => setResearchMode('leads')}
                                    className={'px-3 py-1.5 rounded text-sm font-semibold ' + (researchMode === 'leads' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-slate-200')}
                                >
                                    リード発掘
                                </button>
                                <button
                                    onClick={() => setResearchMode('individual')}
                                    className={'px-3 py-1.5 rounded text-sm font-semibold ' + (researchMode === 'individual' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-slate-200')}
                                >
                                    個別下調べ
                                </button>
                            </div>

                            {researchMode === 'leads' && (
                                <div>
                                    <div className="mb-4">
                                        <label className="block text-sm text-slate-400 mb-1">業界・キーワード</label>
                                        <input
                                            type="text"
                                            value={leadsKeywords}
                                            onChange={e => setLeadsKeywords(e.target.value)}
                                            placeholder="例: 東京 医療系スタートアップ 業務効率化"
                                            className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
                                        />
                                    </div>

                                    <button
                                        onClick={handleFindLeads}
                                        disabled={!apiKey || !leadsKeywords.trim() || leadsLoading}
                                        className="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 text-white text-sm font-semibold px-4 py-2 rounded mb-4"
                                    >
                                        {leadsLoading ? '検索中...' : '候補を探す'}
                                    </button>
                                    {!apiKey && (
                                        <p className="text-slate-500 text-xs mb-4">APIキーが未設定です。右上の設定から入力してください。</p>
                                    )}

                                    {leadsError && (
                                        <div className="bg-rose-950 border border-rose-700 text-rose-200 rounded p-3 mb-4 text-sm">
                                            {leadsError}
                                        </div>
                                    )}

                                    {leadsCandidates && leadsCandidates.length > 0 && (
                                        <ul className="space-y-2">
                                            {leadsCandidates.map((c, i) => (
                                                <li key={i} className="bg-slate-800 border border-slate-700 rounded p-3 text-sm">
                                                    <div className="flex items-center justify-between mb-1">
                                                        <span className="font-medium">{c.companyName}</span>
                                                        <button
                                                            onClick={() => addLeadToPipeline(c)}
                                                            disabled={addedLeadNames.includes(c.companyName.trim())}
                                                            className="bg-slate-700 hover:bg-slate-600 disabled:bg-slate-800 disabled:text-slate-500 text-white text-xs font-semibold px-3 py-1 rounded"
                                                        >
                                                            {addedLeadNames.includes(c.companyName.trim()) ? '追加済み' : '+ パイプラインに追加'}
                                                        </button>
                                                    </div>
                                                    {c.reason && (
                                                        <div className="text-slate-400 text-xs">{c.reason}</div>
                                                    )}
                                                </li>
                                            ))}
                                        </ul>
                                    )}

                                    {leadsCandidates && leadsCandidates.length === 0 && (
                                        <p className="text-slate-400 text-sm">候補が見つかりませんでした。キーワードを変えて再試行してください。</p>
                                    )}

                                    {leadsCandidates === null && leadsRawText && (
                                        <div>
                                            <p className="text-amber-400 text-xs mb-2">候補リストの解析に失敗しました。生の応答を表示します。</p>
                                            <div className="bg-slate-800 border border-slate-700 rounded p-3 text-sm text-slate-300 whitespace-pre-wrap">
                                                {leadsRawText}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {researchMode === 'individual' && (
                                <div>
                                    <div className="mb-4">
                                        <label className="block text-sm text-slate-400 mb-1">会社名またはURL</label>
                                        <input
                                            type="text"
                                            value={researchQuery}
                                            onChange={e => setResearchQuery(e.target.value)}
                                            placeholder="例: 株式会社〇〇 または https://example.com"
                                            className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
                                        />
                                    </div>

                                    <button
                                        onClick={handleResearchIndividual}
                                        disabled={!apiKey || !researchQuery.trim() || researchLoading}
                                        className="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 text-white text-sm font-semibold px-4 py-2 rounded mb-4"
                                    >
                                        {researchLoading ? '調査中...' : '調査する'}
                                    </button>
                                    {!apiKey && (
                                        <p className="text-slate-500 text-xs mb-4">APIキーが未設定です。右上の設定から入力してください。</p>
                                    )}

                                    {researchError && (
                                        <div className="bg-rose-950 border border-rose-700 text-rose-200 rounded p-3 mb-4 text-sm">
                                            {researchError}
                                        </div>
                                    )}

                                    {researchResultText && (
                                        <div className="mb-4">
                                            <div className="bg-slate-800 border border-slate-700 rounded p-3 text-sm text-slate-300 whitespace-pre-wrap mb-2">
                                                {researchResultText}
                                            </div>
                                            <label className="block text-sm text-slate-400 mb-1">この結果を保存する案件</label>
                                            <select
                                                value={researchSaveDealId}
                                                onChange={e => { setResearchSaveDealId(e.target.value); setResearchSaveConfirmed(false); }}
                                                className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm mb-2"
                                            >
                                                <option value="">選択してください</option>
                                                {deals.map(d => (
                                                    <option key={d.id} value={d.id}>{d.companyName}</option>
                                                ))}
                                            </select>
                                            <button
                                                onClick={saveResearchNotes}
                                                disabled={!researchSaveDealId}
                                                className="bg-slate-700 hover:bg-slate-600 disabled:bg-slate-800 disabled:text-slate-600 text-white text-sm font-semibold px-4 py-2 rounded"
                                            >
                                                この案件のリサーチメモに保存
                                            </button>
                                            {researchSaveConfirmed && (
                                                <span className="text-emerald-400 text-xs ml-2">保存しました</span>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}

                    {activeTab === 'compose' && (
                        <div>
                            <div className="mb-4">
                                <label className="block text-sm text-slate-400 mb-1">対象の案件(任意)</label>
                                <select
                                    value={composeSelectedDealId}
                                    onChange={e => setComposeSelectedDealId(e.target.value)}
                                    className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm mb-2"
                                >
                                    <option value="">選択しない(会社名を直接入力)</option>
                                    {deals.map(d => (
                                        <option key={d.id} value={d.id}>{d.companyName}</option>
                                    ))}
                                </select>
                                {!composeSelectedDealId && (
                                    <input
                                        type="text"
                                        value={composeManualCompany}
                                        onChange={e => setComposeManualCompany(e.target.value)}
                                        placeholder="会社名を入力"
                                        className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
                                    />
                                )}
                            </div>

                            <div className="mb-4">
                                <label className="block text-sm text-slate-400 mb-1">文章の種類</label>
                                <select
                                    value={composeTextType}
                                    onChange={e => setComposeTextType(e.target.value)}
                                    className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm"
                                >
                                    {TEXT_TYPE_OPTIONS.map(t => (
                                        <option key={t.value} value={t.value}>{t.label}</option>
                                    ))}
                                </select>
                            </div>

                            <div className="mb-4">
                                <label className="block text-sm text-slate-400 mb-1">トーン・要望(任意)</label>
                                <textarea
                                    value={composeTone}
                                    onChange={e => setComposeTone(e.target.value)}
                                    placeholder="例: 丁寧に、少しカジュアルに、簡潔に、など"
                                    rows={2}
                                    className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
                                />
                            </div>

                            <button
                                onClick={handleGenerate}
                                disabled={!apiKey || composeLoading}
                                className="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 text-white text-sm font-semibold px-4 py-2 rounded mb-4"
                            >
                                {composeLoading ? '生成中...' : '生成'}
                            </button>
                            {!apiKey && (
                                <p className="text-slate-500 text-xs mb-4">APIキーが未設定です。右上の設定から入力してください。</p>
                            )}

                            {composeError && (
                                <div className="bg-rose-950 border border-rose-700 text-rose-200 rounded p-3 mb-4 text-sm">
                                    {composeError}
                                </div>
                            )}

                            {composeResultBody && (
                                <div className="mb-4">
                                    <label className="block text-sm text-slate-400 mb-1">生成された文章(編集可)</label>
                                    <textarea
                                        value={composeResultBody}
                                        onChange={e => setComposeResultBody(e.target.value)}
                                        rows={10}
                                        className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
                                    />
                                </div>
                            )}

                            {composeResultBody && composeSelectedDealId && (
                                <button
                                    onClick={saveGeneratedText}
                                    className="bg-slate-700 hover:bg-slate-600 text-white text-sm font-semibold px-4 py-2 rounded mb-4"
                                >
                                    この案件の履歴に保存
                                </button>
                            )}

                            {composeResultAdvice && (
                                <div className="bg-slate-800 border border-slate-700 rounded p-3 text-sm text-slate-300">
                                    <div className="font-semibold text-slate-400 mb-1">改善アドバイス</div>
                                    <div className="whitespace-pre-wrap">{composeResultAdvice}</div>
                                </div>
                            )}

                            {composeSelectedDealId && (() => {
                                const target = deals.find(d => d.id === composeSelectedDealId);
                                if (!target || (target.history || []).length === 0) return null;
                                return (
                                    <div className="mt-6">
                                        <div className="text-sm font-semibold text-slate-400 mb-2">この案件の生成履歴</div>
                                        <ul className="space-y-2">
                                            {[...(target.history || [])].reverse().map((h, i) => (
                                                <li key={i} className="bg-slate-800 border border-slate-700 rounded p-3 text-sm">
                                                    <div className="text-slate-400 text-xs mb-1">
                                                        {(TEXT_TYPE_OPTIONS.find(t => t.value === h.type) || {}).label || h.type}
                                                        {' '}・{' '}
                                                        {new Date(h.createdAt).toLocaleString('ja-JP')}
                                                    </div>
                                                    <div className="whitespace-pre-wrap">{h.body}</div>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                );
                            })()}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
