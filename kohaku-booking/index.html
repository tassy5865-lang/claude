<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>琥珀 ご予約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;500&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{
  /* 公開サイト(自己紹介HP/アロマサロン琥珀/styles.css)と共通のトークン */
  --cream:#F7F3ED; --paper:#FFFDFC; --sand:#EDE4DA; --line:#DDD0C3;
  --caramel:#C88A42; --brown:#8E5B32; --ink:#4B443F; --muted:#746A62;
  --moss:#44593F; --danger:#A5473A;
  --serif:'Noto Serif JP','Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
  --script:'Cormorant Garamond','Noto Serif JP',serif;
  --radius:2px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
#app{max-width:520px;min-height:100vh;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}

/* header */
.hd{position:sticky;top:0;z-index:5;background:var(--paper);padding-top:env(safe-area-inset-top,0px)}
.hd-row{display:flex;align-items:center;height:56px;padding:0 6px}
.hd-side{width:48px;display:flex;justify-content:center}
.back{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center}
.back::before{content:"";width:10px;height:10px;border-left:2px solid var(--brown);border-bottom:2px solid var(--brown);transform:rotate(45deg);margin-left:4px}
.brand{flex:1;text-align:center;line-height:1.1}
.brand b{display:block;font-family:var(--serif);font-weight:500;font-size:23px;letter-spacing:.16em;color:var(--brown);padding-left:.16em}
.brand small{display:block;font-size:8px;letter-spacing:.5em;color:var(--caramel);padding-left:.5em;margin-top:3px}
.stepper{list-style:none;margin:0;padding:10px 20px 12px;display:flex;align-items:center}
.stepper li{display:flex;align-items:center;flex:none;font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
.stepper li b{font-family:var(--script);font-style:italic;font-weight:500;font-size:17px;margin-right:6px;color:var(--muted)}
.stepper li+li{flex:1}
.stepper li+li::before{content:"";flex:1;height:1px;background:var(--line);margin:0 8px;min-width:10px}
.stepper li.is-done b{color:var(--caramel)}
.stepper li.is-done+li::before,.stepper li.is-current::before{background:var(--caramel)}
.stepper li.is-current{color:var(--ink)}
.stepper li.is-current b{color:var(--brown)}
.stepper li span{white-space:nowrap}
@media (max-width:360px){.stepper li:not(.is-current) span{display:none}}
.demo{background:var(--sand);color:var(--brown);font-size:12px;text-align:center;padding:4px 10px}

main{flex:1;padding:0 0 24px}
.pad{padding:0 20px}
h2{font-family:var(--serif);font-weight:500;font-size:19px;color:var(--brown);margin:26px 20px 12px;letter-spacing:.06em}
h3{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 8px}

/* hero */
.hero{padding:44px 24px 40px;background:
  radial-gradient(80% 110% at 85% 0%,rgba(200,138,66,.13),rgba(247,243,237,0) 68%),
  linear-gradient(180deg,#F7F3ED,#FFFDFC)}
.hero p{margin:0;font-family:var(--serif);font-size:22px;line-height:2;color:var(--ink);letter-spacing:.1em}
.hero small{display:block;margin-top:18px;font-size:13px;color:var(--muted)}

/* category list */
.cats{list-style:none;margin:0;padding:0 20px}
.cats li+li{border-top:1px solid var(--line)}
.cat{width:100%;display:flex;align-items:center;gap:12px;padding:16px 2px;background:none;border:0;text-align:left}
.cat .n{flex:1}
.cat .n b{display:block;font-family:var(--serif);font-weight:500;font-size:18px;color:var(--ink);letter-spacing:.05em}
.cat .n span{font-size:12.5px;color:var(--muted)}
.cat::after{content:"";width:8px;height:8px;border-right:2px solid var(--caramel);border-top:2px solid var(--caramel);transform:rotate(45deg);margin-right:4px}

/* tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 15px;border-radius:var(--radius);border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:13.5px}
.tab[aria-selected=true]{background:var(--brown);border-color:var(--brown);color:#fff}
.catdesc{margin:12px 20px 4px;color:var(--muted);font-size:13.5px}

/* menu card */
.mlist{list-style:none;margin:8px 20px 0;padding:0;display:grid;gap:12px}
.mcard{width:100%;display:flex;gap:14px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:10px;align-items:stretch}
.thumb{flex:none;width:84px;min-height:84px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:19px;color:rgba(255,255,255,.95);letter-spacing:.04em;background:var(--g,linear-gradient(135deg,#C9A27A,#7B5535))}
.thumb.aroma{--g:linear-gradient(140deg,#D2AD83,#7B5535)}
.thumb.facial{--g:linear-gradient(140deg,#E4B7AC,#A86E69)}
.thumb.steam{--g:linear-gradient(140deg,#A9B58F,#4F6446)}
.thumb.pair{--g:linear-gradient(140deg,#DDC29B,#8C6A47)}
.thumb.omakase{--g:linear-gradient(140deg,#E3D2B5,#B58553)}
.mcard .b{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.mcard .b b{font-weight:700;font-size:15px;line-height:1.5}
.mcard .b span{font-size:12.5px;color:var(--muted);line-height:1.5}
.mcard .b em{font-style:normal;font-family:var(--serif);font-size:18px;color:var(--brown);margin-top:2px}

/* detail */
.dhead{margin:18px 20px 0}
.dhead .thumb{width:100%;min-height:128px;font-size:30px}
.dhead h1{font-family:var(--serif);font-weight:500;font-size:22px;color:var(--brown);margin:14px 0 2px;line-height:1.5;letter-spacing:.04em}
.dhead p{margin:0;color:var(--muted);font-size:13.5px}
.dprice{font-family:var(--serif);font-size:24px;color:var(--brown);margin:6px 0 0}
.dprice small{font-family:var(--sans);font-size:13px;color:var(--muted);margin-left:6px}
.rows{margin:0 20px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row input{width:20px;height:20px;accent-color:var(--brown);flex:none}
.row .t{flex:1}
.row .t small{color:var(--muted);margin-left:6px}
.row .p{font-family:var(--serif);color:var(--brown)}
.note{margin:10px 20px 0;font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 20px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:block;padding:8px 15px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;color:var(--muted)}
.chip input:checked+span{background:var(--brown);border-color:var(--brown);color:#fff}
.chip input:focus-visible+span{outline:2px solid var(--moss);outline-offset:2px}

/* calendar */
.cal{margin:8px 20px 0}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-h b{font-family:var(--serif);font-weight:500;font-size:18px;color:var(--brown)}
.mv{width:44px;height:44px;border:0;background:none;font-size:22px;color:var(--brown)}
.mv:disabled{color:#CDBFAA;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid .w{font-size:12px;color:var(--muted);padding:4px 0}
.grid .w:first-child{color:var(--danger)}
.day{height:44px;border:0;border-radius:50%;background:none;font-size:15px;color:var(--ink);width:44px;margin:0 auto}
.day:disabled{color:#CDBFAA;cursor:default}
.day.sel{background:var(--brown);color:#fff}
.day.ok{font-weight:700}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 20px}
.slot{padding:11px 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);display:flex;justify-content:center;gap:8px;font-size:15px}
.slot i{font-style:normal;color:var(--moss)}
.slot:disabled{color:#CDBFAA;background:#FAF5EC;cursor:default}
.slot:disabled i{color:#CDBFAA}
.slot.sel{background:var(--brown);border-color:var(--brown);color:#fff}
.slot.sel i{color:#fff}
.loading{margin:30px 20px;text-align:center;color:var(--muted);font-size:14px}
.alert{margin:14px 20px 0;padding:11px 14px;border-radius:var(--radius);background:#F8E9E4;color:var(--danger);font-size:13.5px}

/* form */
.f{margin:0 20px 16px}
.f label,.f legend{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px;padding:0}
.f label i,.f legend i{font-style:normal;font-weight:400;font-size:11.5px;color:var(--danger);margin-left:6px}
.f input[type=text],.f input[type=tel],.f input[type=email],.f textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;font-size:16px}
.f textarea{min-height:92px;resize:vertical}
.f fieldset{border:0;margin:0;padding:0}
.f .er{color:var(--danger);font-size:12.5px;margin-top:4px}
.f input.bad,.f textarea.bad{border-color:var(--danger)}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}

/* confirm */
.sum{margin:0 20px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.sum dl{margin:0;padding:6px 16px}
.sum .r{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.sum .r:last-child{border-bottom:0}
.sum dt{flex:none;width:84px;font-size:12.5px;color:var(--muted);padding-top:2px}
.sum dd{margin:0;flex:1;word-break:break-word}
.sum .tot{background:#FAF3E7;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline}
.sum .tot b{font-family:var(--serif);font-size:24px;color:var(--brown);font-weight:500}
.lnk{border:0;background:none;color:var(--brown);text-decoration:underline;font-size:12.5px;padding:2px 0}

/* done */
.done{text-align:center;padding:44px 24px 0}
.check{width:64px;height:64px;border-radius:50%;background:var(--moss);margin:0 auto 18px;position:relative}
.check::after{content:"";position:absolute;left:23px;top:15px;width:12px;height:24px;border-right:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(40deg)}
.done h1{font-family:var(--serif);font-weight:500;font-size:22px;color:var(--brown);margin:0 0 6px;letter-spacing:.06em}
.done .when{font-family:var(--serif);font-size:19px;margin:18px 0 2px}
.done .id{font-size:13px;color:var(--muted)}
.actions{display:grid;gap:10px;margin:28px 20px 0}

/* buttons / bar */
.btn{display:block;width:100%;text-align:center;text-decoration:none;padding:15px;border-radius:var(--radius);border:1px solid var(--brown);background:var(--brown);color:#fff;font-weight:700;font-size:15.5px;letter-spacing:.04em}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--paper);color:var(--brown)}
.bar{position:sticky;bottom:0;z-index:4;background:var(--paper);border-top:1px solid var(--line);padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px}
.bar .s{flex:none;line-height:1.35}
.bar .s small{display:block;font-size:11.5px;color:var(--muted)}
.bar .s b{font-family:var(--serif);font-size:19px;color:var(--brown);font-weight:500}
.bar .btn{flex:1}
/* My Kohaku */
.hd-side.r{justify-content:center}
.iconbtn{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--brown)}
.mk-name{font-family:var(--serif);font-size:21px;color:var(--brown);margin:22px 20px 0;letter-spacing:.05em}
.mk-lead{margin:6px 20px 0;color:var(--muted);font-size:13.5px}
.bk{margin:0 20px 12px;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--paper)}
.bk .d{font-family:var(--serif);font-size:19px;color:var(--brown)}
.bk .m{font-weight:700;margin-top:4px;line-height:1.5}
.bk .s{font-size:12.5px;color:var(--muted)}
.bk .f2{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
.bk .f2 span{font-family:var(--serif);color:var(--brown)}
.tag{display:inline-block;font-family:var(--sans);font-size:11.5px;padding:1px 9px;border-radius:var(--radius);background:var(--sand);color:var(--brown);margin-left:8px;vertical-align:middle}
.tag.x{background:#F0E4E0;color:var(--danger)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:13.5px}
.cp{margin:0 20px 12px;border:1px dashed var(--caramel);border-radius:var(--radius);padding:14px 16px;background:#FBF4E6}
.cp b{font-family:var(--serif);font-size:18px;color:var(--brown);font-weight:500}
.cp p{margin:2px 0 0;font-size:13.5px}
.cp code{display:inline-block;margin-top:8px;padding:2px 10px;background:#fff;border:1px solid var(--line);border-radius:4px;letter-spacing:.12em;font-size:14px}
.empty{margin:34px 20px 18px;text-align:center;color:var(--muted)}
.ro{padding:13px 14px;border:1px solid var(--line);border-radius:6px;background:#F8F2E8;color:var(--muted)}
.msg{margin:14px 20px 0;padding:11px 14px;border-radius:6px;background:#EEF2E8;color:var(--moss);font-size:13.5px}
.links{display:grid;gap:10px;margin:22px 20px 0}
.sep{margin:26px 20px 0;padding-top:18px;border-top:1px solid var(--line)}

</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   設定  ― GAS_URL を入れると Googleカレンダー/スプレッドシート連携が有効になります。
   空のままならデモ表示(予約は保存されません)。
   ========================================================= */
const CONFIG = {
  GAS_URL: '',                 // 例: 'https://script.google.com/macros/s/xxxxxxxx/exec'
  LIFF_ID: '',                 // LINE連携を使う場合に設定(例: '1234567890-AbCdEfGh')。空ならLINE機能は無効
  SALON: '琥珀',
  OPEN: '10:00', CLOSE: '20:00',   // 営業時間(終了時刻までに施術が終わる枠のみ表示)
  STEP_MIN: 30,                    // 予約枠の刻み
  BUFFER_MIN: 15,                  // 施術前後の準備・片付け時間
  CAPACITY: 1,                     // 同時に受けられる予約数
  CLOSED_WEEKDAYS: [3],            // 定休曜日 (0=日 … 6=土) ※仮: 水曜
  MIN_ADVANCE_HOURS: 3,            // 何時間先から予約可能か
  MAX_DAYS_AHEAD: 60,              // 何日先まで予約可能か
  LOCATION: '',                    // カレンダー追加時の場所(住所)
  NOTICE: 'ご変更・キャンセルはお電話またはLINEにてご連絡ください。'
};

/* ---------- データ(後でスプレッドシート管理に移行できます) ---------- */
const CATS = [
  {id:'first',  name:'はじめての方', sub:'初めてご来店の方に',            desc:'はじめての方に選ばれているコースです。'},
  {id:'rec',    name:'おすすめ',     sub:'人気のコース',                  desc:'当サロンで人気のコースです。'},
  {id:'aroma',  name:'アロマ',       sub:'植物の香りに包まれて',          desc:'植物の香りに包まれながら、心と体をゆるめる時間。'},
  {id:'facial', name:'フェイシャル', sub:'ローズの香りの贅沢ケア',        desc:'ローズの香りに包まれた、贅沢なフェイシャルケア。'},
  {id:'steam',  name:'蒸し',         sub:'よもぎ・まこも・セットコース',  desc:'じんわり芯から温まる蒸しと、アロマとのセットコース。'},
  {id:'pair',   name:'ペア',         sub:'大切な人と一緒に',              desc:'大切な人と、ゆったり過ごすひととき。(料金は2名分)'},
  {id:'omakase',name:'おまかせ',     sub:'セラピストに相談して決める',    desc:'メニュー選びに迷っている方へ。'}
];
// 予備: GAS の menu API が使えないとき(デモ・取得失敗)に使う。内容は gas/Code.gs の SEED_MENU(表示ON)と同じにすること
let MENU = [
  {id:'first100', name:'アロマボディトリートメント × まこも蒸し(初回限定)', min:100, price:10000, desc:'体質診断チェック付き / 通常 ¥12,000', cats:['first'], g:'steam'},
  {id:'aroma60',  name:'Relax アロマボディトリートメント', min:60,  price:7000,  desc:'やさしい香りと心地よいタッチで',   cats:['aroma','first'], g:'aroma'},
  {id:'aroma80',  name:'満足 アロマボディトリートメント',  min:80,  price:9000,  desc:'たっぷりの時間で全身をゆるめる', cats:['aroma'],         g:'aroma'},
  {id:'aroma100', name:'疲労回復 アロマボディトリートメント', min:100, price:11000, desc:'溜まった疲れをほどき、巡りのよい体へ', cats:['aroma','rec'], g:'aroma'},
  {id:'f-light',  name:'ローズフェイシャル A', min:40, price:5600,  desc:'フェイシャル30分(シートパック付き)+ 頭ほぐし10分', cats:['facial','first'], g:'facial'},
  {id:'f-relax',  name:'ローズフェイシャル B', min:65, price:8100,  desc:'フェイシャル30分(シートパック付き)+ 頭ほぐし35分(上衣に着替えます)', cats:['facial','rec'], g:'facial'},
  {id:'f-onkatsu',name:'ローズフェイシャル C', min:70, price:11600, desc:'フェイシャル30分(シートパック付き)+ 頭ほぐし10分 + よもぎ蒸し', cats:['facial'], g:'facial'},
  {id:'f-premium',name:'ローズフェイシャル D', min:95, price:14100, desc:'フェイシャル30分(シートパック付き)+ 頭ほぐし35分 + よもぎ蒸し', cats:['facial','rec'], g:'facial'},
  {id:'set90',    name:'Relax アロマボディトリートメント + よもぎ蒸し', min:90,  price:10000, desc:'アロマボディ + よもぎ蒸し', cats:['steam','rec'], g:'steam'},
  {id:'set110',   name:'満足 アロマボディトリートメント + よもぎ蒸し',  min:110, price:12000, desc:'アロマボディ + よもぎ蒸し', cats:['steam'],       g:'steam'},
  {id:'set130',   name:'疲労回復 アロマボディトリートメント + よもぎ蒸し', min:130, price:14000, desc:'アロマボディ + よもぎ蒸し', cats:['steam'],    g:'steam'},
  {id:'course110',name:'全身満たされる110分コース', min:110, price:13000, desc:'ボディ50分 + ローズフェイシャル + よもぎ蒸し(おすすめ)', cats:['steam','rec'], g:'steam'},
  {id:'course140',name:'全身満たされる140分コース', min:140, price:18600, desc:'ボディ80分 + ローズフェイシャル + まこも蒸し',             cats:['steam'],       g:'steam'},
  {id:'p-yomogi',      name:'ペア よもぎ蒸し(2名分)',                  min:40, price:6000,  desc:'大切な人と一緒に',        cats:['pair'], g:'pair', kind:'pair'},
  {id:'p-makomo',      name:'ペア まこも蒸し(2名分)',                  min:40, price:12000, desc:'大切な人と一緒に',        cats:['pair'], g:'pair', kind:'pair'},
  {id:'p-yomogi-foot', name:'ペア よもぎ蒸し + フットまたは頭ほぐし30分(2名分)', min:70, price:12000, desc:'蒸しのあとに足と頭を癒す', cats:['pair'], g:'pair', kind:'pair'},
  {id:'p-makomo-foot', name:'ペア まこも蒸し + フットまたは頭ほぐし30分(2名分)', min:70, price:18000, desc:'蒸しのあとに足と頭を癒す', cats:['pair'], g:'pair', kind:'pair'},
  {id:'omakase', name:'おまかせ相談予約', min:60, price:null, desc:'セラピストに相談して、その日の内容を決めるコースです。', cats:['omakase'], g:'omakase', kind:'omakase'}
];
let OPTIONS = [
  {id:'head', name:'頭ほぐし',   min:10, price:1500},
  {id:'foot', name:'フット',     min:10, price:1500},
  {id:'hand', name:'ハンド',     min:10, price:1500},
  {id:'stone',name:'ホットストーン', min:0, price:2000},

async function api(action, extra = {}){
  if(CONFIG.GAS_URL){
    const r = await fetch(CONFIG.GAS_URL, {method:'POST', body:JSON.stringify({action, token:MY.token, ...extra})});
    return r.json();
  }
  await sleep(400);   // デモ
  switch(action){
    case 'sendCode': return {ok:true};
    case 'verifyCode': return extra.code === DEMO_CODE ? {ok:true, token:'demo'} : {ok:false, error:'bad_code'};
    case 'me': return {ok:true, ...JSON.parse(JSON.stringify(demoDB)), cancelDeadlineHours:24};
    case 'cancel': {
      const i = demoDB.upcoming.findIndex(b => b.id === extra.id);
      if(i < 0) return {ok:false, error:'not_found'};
      const b = demoDB.upcoming.splice(i,1)[0]; b.status = 'キャンセル'; b.canCancel = false; demoDB.history.unshift(b); return {ok:true};
    }
    case 'updateProfile': Object.assign(demoDB.profile, {name:extra.name, kana:extra.kana, tel:extra.tel}); return {ok:true, profile:{...demoDB.profile}};
    case 'reschedule': {
      const b = demoDB.upcoming.find(x => x.id === extra.id); if(!b) return {ok:false, error:'not_found'};
      b.date = extra.date; b.time = extra.time; b.end = fromMin(toMin(extra.time) + b.minutes); return {ok:true};
    }
    case 'lineLinkCode': return {ok:true, code:'DEMO0000'};
    case 'lineUnlink': demoDB.profile.lineLinked = false; return {ok:true};
    case 'logout': return {ok:true};
  }
  return {ok:false, error:'unknown_action'};
}

const availCache = {};
function demoBusy(from,to){
  const out = []; let d = new Date(from+'T00:00:00Z'); const end = new Date(to+'T00:00:00Z');
  while(d <= end){
    const ds = d.toISOString().slice(0,10);
    let seed = [...ds].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0, 7);
    const rnd = () => (seed = (seed*1664525+1013904223)>>>0) / 4294967296;
    const n = Math.floor(rnd()*4)+1;
    for(let i=0;i<n;i++){
      const s = 10*60 + Math.floor(rnd()*14)*30, len = [60,80,100,120][Math.floor(rnd()*4)];
      out.push([jst(ds,fromMin(s)).getTime(), jst(ds,fromMin(s+len)).getTime()]);
    }
    d = new Date(d.getTime()+864e5);
  }
  return out;
}
async function loadMonth(y,m){
  const key = `${y}-${pad(m+1)}`;
  if(availCache[key]) return availCache[key];
  const from = ymd(y,m,1), to = ymd(y,m,daysIn(y,m));
  let busy;
  if(!CONFIG.GAS_URL){ await sleep(350); busy = demoBusy(from,to); }
  else {
    const r = await fetch(`${CONFIG.GAS_URL}?action=availability&from=${from}&to=${to}`);
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'availability');
    busy = j.busy.map(b => [new Date(b.start).getTime(), new Date(b.end).getTime()]);
  }
  return availCache[key] = busy;
}
async function loadAvail(){
  const {y,m} = S; S.loading = true; S.availErr = false; S.busy = null; render();
  try{ const b = await loadMonth(y,m); if(S.y===y && S.m===m){ S.busy = b; } }
  catch(e){ if(S.y===y && S.m===m) S.availErr = true; }
  if(S.y===y && S.m===m){ S.loading = false; render(); }
}
function slotsFor(ds, dur, busy){
  const res = [], minStart = Date.now() + CONFIG.MIN_ADVANCE_HOURS*3600e3, buf = CONFIG.BUFFER_MIN*60e3;
  for(let t = toMin(CONFIG.OPEN); t + dur <= toMin(CONFIG.CLOSE); t += CONFIG.STEP_MIN){
    const s = jst(ds,fromMin(t)).getTime(), e = s + dur*60e3;
    let ok = s >= minStart;
    if(ok) ok = busy.filter(([bs,be]) => s < be+buf && e > bs-buf).length < CONFIG.CAPACITY;
    res.push({time:fromMin(t), ok});
  }
  return res;
}
function dayOpen(ds){
  if(ds < TODAY) return false;
  if(CONFIG.CLOSED_WEEKDAYS.includes(dow(ds))) return false;
  const max = new Date(Date.now()+9*3600e3+CONFIG.MAX_DAYS_AHEAD*864e5).toISOString().slice(0,10);
  return ds <= max;
}

      cells += `<button class="day ${ok?'ok':''} ${RS.date===ds?'sel':''}" data-act="rs-date" data-v="${ds}" ${ok?'':'disabled'} aria-label="${m+1}月${d}日${ok?'':' 予約不可'}">${d}</button>`;

    ${RS.date && !RS.loading ? slots : (!RS.loading && !RS.failed ? '<p class="note">新しい日付を選ぶと、空いている時間が表示されます。メニューは変更されません。</p>' : '')}`;

      <p class="note" style="text-align:center">${CONFIG.GAS_URL ? '確認メールをお送りしました。届かない場合はお知らせください。' : 'デモ表示のため、予約は保存されず、メールも送信されません。'}</p>
    </div>

      <a class="btn ghost" href="${gc}" target="_blank" rel="noopener">Googleカレンダーに追加</a>

function gcalUrl(){
  const f = (ds,t) => ds.replace(/-/g,'') + 'T' + t.replace(':','') + '00';
  const p = new URLSearchParams({
    action:'TEMPLATE', text:`${CONFIG.SALON} ご予約(${S.menu.name})`,
    dates:`${f(S.date,S.time)}/${f(S.date,endTime())}`, ctz:'Asia/Tokyo',
    details:`予約番号: ${S.result.id}\nメニュー: ${S.menu.name}`, location:CONFIG.LOCATION
  });
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}

/* ---------- バー(下部固定) ---------- */
function bar(){

  if(['top','menu','done','login','code','my'].includes(sc)) return '';
  const t = S.menu.price == null ? null : total();
  const sum = `<div class="s"><small>${t==null ? '料金' : '合計'}・${duration()}分</small><b>${t==null ? '当日ご案内' : yen(t)}</b></div>`;
  const cfg = {
    detail:['日時選択へ', 'next', false],

    confirm:[S.submitting ? '送信中…' : 'この内容で予約する', 'submit', S.submitting]

/* ---------- 描画 ---------- */
const app = document.getElementById('app');
function render(){
  if(!S.menu && ['detail','date','info','confirm'].includes(S.screen)) S.screen = 'menu';
  if(S.screen==='my' && !MY.token) S.screen = 'login';
  if(S.screen==='code' && !MY.email) S.screen = 'login';
  if(S.screen==='my' && !MY.data && !MY.loading && !MY.failed){ loadMy(); return; }
  if(S.screen==='resched'){
    if(!RS.b) S.screen = 'my';
    else if(!RS.busy && !RS.loading && !RS.failed){ loadRs(); return; }
  }
  if(S.screen==='date' && !S.busy && !S.loading && !S.availErr){ loadAvail(); return; }
  const st = STEPS[S.screen];
  app.innerHTML = `
    <header class="hd">
      ${CONFIG.GAS_URL ? '' : '<div class="demo">デモ表示中:予約データは保存されません</div>'}
      <div class="hd-row">
        <div class="hd-side">${['top','done','my'].includes(S.screen) ? '' : '<button class="back" data-act="back" aria-label="戻る"></button>'}</div>
        <div class="brand"><b>${CONFIG.SALON}</b><small>KOHAKU</small></div>
        <div class="hd-side r">${['top','menu','detail','date','info','confirm'].includes(S.screen) ? '<button class="iconbtn" data-act="my" aria-label="My Kohaku"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.9-3.6 3.7-5.4 7.2-5.4s6.3 1.8 7.2 5.4"/></svg></button>' : ''}</div>

/* 予約の進行(01 ─── 02 ─── 03 ─── 04)。詳細(オプション)はメニューの一部として数える */
const FLOW_STEPS = ['メニュー','日時','お客様情報','確認'];
const FLOW_AT = {menu:1, detail:1, date:2, info:3, confirm:4};
function stepper(){
  const at = FLOW_AT[S.screen];
  if(!at) return '';
  return `<ol class="stepper" aria-label="予約の進行状況(全${FLOW_STEPS.length}ステップ)">${FLOW_STEPS.map((t,i)=>{
    const n = i+1, cls = n<at ? 'is-done' : n===at ? 'is-current' : '';
    return `<li class="${cls}"${n===at ? ' aria-current="step"' : ''}><b>0${n}</b><span>${t}</span></li>`;
  }).join('')}</ol>`;
}
function go(screen){
  S.screen = screen; S.banner = screen==='date' || screen==='confirm' ? S.banner : '';
  history.pushState({screen}, '');
  render(); window.scrollTo(0,0);
}

/* ---------- 入力検証 ---------- */
function validate(){
  const i = S.info, e = {};
  if(!i.name.trim()) e.name = 'お名前を入力してください';
  if(!i.kana.trim()) e.kana = 'フリガナを入力してください';
  else if(!/^[ァ-ヶー\u3041-\u3096\s\u3000・]+$/.test(i.kana.trim())) e.kana = 'ひらがな・カタカナで入力してください';
  if(!/^0\d{9,10}$/.test(i.tel.replace(/[-\s\u3000]/g,''))) e.tel = '電話番号を正しく入力してください(例: 090-1234-5678)';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(i.email.trim())) e.email = 'メールアドレスを正しく入力してください';
  S.errors = e; return Object.keys(e).length === 0;
}

/* ---------- 送信 ---------- */
async function submit(){
  S.submitting = true; S.banner = ''; render();
  const i = S.info, m = S.menu;
  const notes = [i.note.trim(), m.kind==='omakase' && S.omakase.concerns.length ? 'お悩み: ' + S.omakase.concerns.join('、') : ''].filter(Boolean).join('\n');
  const payload = {
    date:S.date, time:S.time, menuId:m.id, optionIds:S.opts.slice(),
    ...(m.kind==='omakase' ? {minutes:S.omakase.mins} : {}),
    name:i.name.trim(), kana:i.kana.trim(), tel:i.tel.trim(), email:i.email.trim(),
    visit:i.visit==='first' ? '初回' : '再来', note:notes, website:i.website
  };
  try{
    if(!CONFIG.GAS_URL){
      await sleep(900);
      S.result = {id:'K' + TODAY.slice(2).replace(/-/g,'') + String(Math.floor(Math.random()*9000)+1000)};
    } else {
      const r = await fetch(CONFIG.GAS_URL, {method:'POST', body:JSON.stringify(payload)});
      const j = await r.json();
      if(!j.ok){
        if(j.error === 'conflict'){
          Object.keys(availCache).forEach(k => delete availCache[k]);
          S.time = null; S.busy = null; S.banner = '選んだ時間が先ほど埋まってしまいました。別の時間をお選びください。';
          S.submitting = false; go('date'); return;
        }
        if(j.error === 'bad_menu'){
          S.submitting = false; S.banner = errMsg('bad_menu'); MENU_LOADING = true; loadMenu(true); render(); return;
        }
        throw new Error(j.error || 'submit');
      }
      S.result = {id:j.id};
    }
    S.submitting = false; history.replaceState({screen:'done'}, ''); S.screen = 'done'; render(); window.scrollTo(0,0);
  } catch(err){
    S.submitting = false; S.banner = '送信できませんでした。通信状況をご確認のうえ、もう一度お試しください。'; render();
  }
}

/* ---------- My Kohaku 操作 ---------- */
const errMsg = c => ({bad_minutes:'ご希望の時間をもう一度お選びください', bad_menu:'選んだメニューは現在ご予約いただけません。メニューを選び直してください', bad_email:'メールアドレスを正しく入力してください', bad_code:'コードが違います。もう一度ご確認ください', locked:'入力の失敗が続いたため、しばらくしてからやり直してください', too_late:'ご来店が近いため、マイページからはキャンセルできません。お電話またはLINEでご連絡ください', not_found:'予約が見つかりませんでした', not_active:'この予約はすでに取り消されています', bad_tel:'電話番号を正しく入力してください', missing_field:'未入力の項目があります', conflict:'選んだ時間が先ほど埋まってしまいました。別の時間をお選びください', too_soon:'直近の日時は選べません', closed_day:'定休日は選べません', out_of_hours:'営業時間外です', bad_date:'日時を選び直してください', bad_link_code:'連携コードの有効期限が切れました。もう一度「LINEで連携する」からお試しください', line_auth:'LINEの認証に失敗しました。もう一度お試しください', line_already_linked:'このLINEアカウントは、すでに別のお客様情報に連携されています', not_linked:'LINE連携がまだ完了していません。メールアドレスでログインし、「登録情報」から連携してください', no_customer:'お客様情報が見つかりませんでした'}[c] || '処理できませんでした。時間をおいてもう一度お試しください');
async function mySend(){
  MY.email = (MY.email || '').trim().toLowerCase(); MY.msg = ''; MY.ok = '';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(MY.email)){ MY.msg = errMsg('bad_email'); render(); return; }
  MY.busy = true; render();
  try{ const j = await api('sendCode', {email:MY.email}); if(!j.ok) throw new Error(j.error); saveSess(); MY.busy = false; MY.code = ''; if(S.screen !== 'code') go('code'); else { MY.ok = 'コードを再送しました。'; render(); } return; }
  catch(e){ MY.msg = errMsg(e.message); }
  MY.busy = false; render();
}
async function myVerify(){
  MY.msg = ''; MY.busy = true; render();
  try{
    const j = await api('verifyCode', {email:MY.email, code:MY.code});
    if(!j.ok) throw new Error(j.error);
    MY.token = j.token; MY.data = null; MY.failed = false; MY.tab = 'next'; saveSess(); MY.busy = false;
    S.screen = 'my'; history.replaceState({screen:'my'}, ''); render(); window.scrollTo(0,0); return;
  } catch(e){ MY.msg = errMsg(e.message); }
  MY.busy = false; render();
}
async function myCancel(id){
  if(!confirm('この予約をキャンセルしますか?')) return;
  MY.msg = ''; MY.ok = '';
  try{
    const j = await api('cancel', {id}); if(!j.ok) throw new Error(j.error);
    MY.ok = 'ご予約をキャンセルしました。'; MY.data = null; MY.loading = false; MY.failed = false; render();
  } catch(e){
    if(e.message === 'auth'){ doLogout(true); return; }
    MY.msg = errMsg(e.message); render();
  }
}
async function mySaveProf(){
  const p = MY.prof, er = {};
  if(!p.name.trim()) er.name = 'お名前を入力してください';
  if(!p.kana.trim()) er.kana = 'フリガナを入力してください';
  else if(!/^[ァ-ヶー\u3041-\u3096\s\u3000・]+$/.test(p.kana.trim())) er.kana = 'ひらがな・カタカナで入力してください';
  if(!/^0\d{9,10}$/.test(p.tel.replace(/[-\s\u3000]/g,''))) er.tel = '電話番号を正しく入力してください';
  MY.errors = er; MY.msg = ''; MY.ok = '';
  if(Object.keys(er).length){ render(); return; }
  MY.busy = true; render();
  try{
    const j = await api('updateProfile', {name:p.name.trim(), kana:p.kana.trim(), tel:p.tel.trim()});
    if(!j.ok){ if(j.error === 'auth'){ doLogout(true); return; } throw new Error(j.error); }
    MY.data.profile = j.profile; MY.prof = {...j.profile}; MY.ok = '登録情報を更新しました。';
  } catch(e){ MY.msg = errMsg(e.message); }
  MY.busy = false; render();
}

/* ---------- 日時変更 / LINE ---------- */
function lineBox(linked){
  const on = CONFIG.LIFF_ID || !CONFIG.GAS_URL;

    ? '<button class="btn ghost sm" data-act="lineunlink">連携を解除</button>'
    : '<button class="btn sm" data-act="linelink">LINEで連携する</button>';
  return `<div class="f"><label>LINE連携</label><div class="ro">${linked ? '連携済み' : '未連携'}</div>
    ${on ? `<div style="margin-top:8px">${btn}</div><p class="note" style="margin:6px 0 0">連携すると、ご予約の確認と、2日前・当日のリマインドをLINEでお届けします。</p>` : '<p class="note" style="margin:6px 0 0">準備中です。</p>'}</div>`;
}
function startResched(id){
  const b = MY.data && MY.data.upcoming.find(x => x.id === id); if(!b) return;
  Object.assign(RS, {b, y:TY, m:TM-1, date:null, time:null, busy:null, loading:false, failed:false, msg:'', submitting:false});

}
async function loadRs(){
  const y = RS.y, m = RS.m; RS.loading = true; RS.failed = false; render();
  try{
    const busy = await loadMonth(y,m);
    if(RS.y === y && RS.m === m){
      const os = jst(RS.b.date, RS.b.time).getTime(), oe = jst(RS.b.date, RS.b.end).getTime();
      RS.busy = busy.filter(([s,e]) => !(s === os && e === oe));   // 自分の予約の枠は「空き」として扱う
    }
  } catch(e){ if(RS.y === y && RS.m === m) RS.failed = true; }
  if(RS.y === y && RS.m === m){ RS.loading = false; render(); }
}
async function rsSubmit(){
  if(!RS.time || RS.submitting) return;
  if(!confirm(`${fmtDate(RS.date)} ${RS.time} に変更しますか?`)) return;
  RS.submitting = true; RS.msg = ''; render();
  try{
    const j = await api('reschedule', {id:RS.b.id, date:RS.date, time:RS.time});
    if(!j.ok){ if(j.error === 'auth'){ RS.submitting = false; doLogout(true); return; } throw new Error(j.error); }
    Object.keys(availCache).forEach(k => delete availCache[k]);
    MY.ok = 'ご予約の日時を変更しました。'; MY.msg = ''; MY.data = null; MY.failed = false; MY.loading = false; MY.tab = 'next';
    RS.submitting = false; history.back(); return;
  } catch(e){
    RS.msg = errMsg(e.message);
    if(e.message === 'conflict'){ Object.keys(availCache).forEach(k => delete availCache[k]); RS.busy = null; RS.time = null; }
  }
  RS.submitting = false; render();
}
function runPending(){
  if(!MY.pending || !MY.data) return;
  const p = MY.pending; MY.pending = null;
  const b = MY.data.upcoming.find(x => x.id === p.id); if(!b) return;
  if(p.act === 'cancel') myCancel(b.id);
  else if(p.act === 'change' && b.canCancel) startResched(b.id);
}
async function myLineLink(){
  if(!CONFIG.GAS_URL){ MY.ok = 'デモ表示ではLINE連携は行えません。'; render(); return; }
  MY.msg = ''; MY.ok = '';
  try{
    const j = await api('lineLinkCode');
    if(!j.ok){ if(j.error === 'auth'){ doLogout(true); return; } throw new Error(j.error); }
    location.href = `https://liff.line.me/${CONFIG.LIFF_ID}?link=${encodeURIComponent(j.code)}`; return;
  } catch(e){ MY.msg = errMsg(e.message); }
  render();
}
async function myLineUnlink(){
  if(!confirm('LINE連携を解除しますか?(以降、通知はメールでお届けします)')) return;
  MY.msg = ''; MY.ok = '';
  try{
    const j = await api('lineUnlink');
    if(!j.ok){ if(j.error === 'auth'){ doLogout(true); return; } throw new Error(j.error); }
    MY.data.profile.lineLinked = false; MY.ok = 'LINE連携を解除しました。';
  } catch(e){ MY.msg = errMsg(e.message); }
  render();
}

/* ---------- LIFF(LINEアプリ内で開いたとき) ---------- */
const QS = new URLSearchParams(location.search);
const loadScript = src => new Promise((res,rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); });
async function lineEntry(idToken, link){
  const j = link ? await api('lineLink', {idToken, code:link}) : await api('lineLogin', {idToken});
  if(j.ok){
    MY.token = j.token; MY.email = j.email || MY.email; MY.data = null; MY.failed = false; MY.tab = link ? 'profile' : 'next'; MY.msg = '';
    MY.ok = link ? 'LINE連携が完了しました。ご予約の確認とリマインドをLINEでお届けします。' : '';
    saveSess(); go('my');
  } else {
    MY.msg = errMsg(j.error); go('login');
  }
}
async function bootstrap(){
  loadMenu();
  const link = QS.get('link'), page = QS.get('page');
  if(QS.get('id')) MY.pending = {act: QS.get('act') || 'view', id: QS.get('id')};
  const useLiff = CONFIG.LIFF_ID && (link || QS.has('liff.state') || /Line\//i.test(navigator.userAgent));
  if(useLiff){
    try{
      await loadScript('https://static.line-scdn.net/liff/edge/2/sdk.js');
      await liff.init({liffId: CONFIG.LIFF_ID});
      if(!liff.isLoggedIn()){ liff.login({redirectUri: location.href}); return; }
      await lineEntry(liff.getIDToken(), link);
    } catch(e){ MY.msg = 'LINEとの接続に失敗しました。時間をおいてもう一度お試しください。'; go('login'); }
  } else if(page === 'my'){
    go(MY.token ? 'my' : 'login');
  }
}

/* ---------- イベント ---------- */
app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t || t.disabled) return;
  const v = t.dataset.v;
  switch(t.dataset.act){
    case 'cat':   S.cat = v; if(S.screen==='top') go('menu'); else render(); break;
    case 'pick':  S.menu = MENU.find(m => m.id===v); S.opts = []; S.date = null; S.time = null; go('detail'); break;
    case 'back':  history.back(); break;
    case 'edit':  go(v); break;
    case 'month': { let y=S.y, m=S.m+Number(v); if(m<0){m=11;y--} if(m>11){m=0;y++} S.y=y; S.m=m; S.date=null; S.time=null; S.busy=null; S.loading=false; S.availErr=false; render(); break; }
    case 'date':  S.date = v; S.time = null; render(); break;
    case 'time':  S.time = v; render(); break;
    case 'next': {
      if(S.screen==='detail'){ S.busy = null; S.loading = false; S.availErr = false; S.date = null; S.time = null; S.y = TY; S.m = TM-1; go('date'); }
      else if(S.screen==='date'){ S.banner=''; go('info'); }
      else if(S.screen==='info'){ if(validate()) go('confirm'); else { render(); document.querySelector('.bad')?.focus(); } }
      break;
    }
    case 'submit': submit(); break;
    case 'my':     MY.msg = ''; MY.ok = ''; MY.failed = false; go(MY.token ? 'my' : 'login'); break;
    case 'home':   go('top'); break;
    case 'tab':    MY.tab = v; MY.msg = ''; MY.ok = ''; MY.errors = {}; if(MY.data) MY.prof = {...MY.data.profile}; render(); break;
    case 'reload': MY.failed = false; render(); break;
    case 'logout': doLogout(false); break;
    case 'newbook': S = fresh(); go('top'); break;
    case 'sendcode': mySend(); break;
    case 'verify':   myVerify(); break;
    case 'cancelbk': myCancel(v); break;
    case 'saveprof': mySaveProf(); break;
    case 'rebook': { const m = MENU.find(x => x.id === v); if(m){ S = fresh(); S.menu = m; S.cat = m.cats[0]; go('detail'); } break; }
    case 'change':   startResched(v); break;
    case 'rs-month': { let y = RS.y, m = RS.m + Number(v); if(m < 0){m = 11; y--} if(m > 11){m = 0; y++} Object.assign(RS, {y, m, date:null, time:null, busy:null, loading:false, failed:false}); render(); break; }
    case 'rs-date':  RS.date = v; RS.time = null; RS.msg = ''; render(); break;
    case 'rs-time':  RS.time = v; render(); break;
    case 'rs-submit': rsSubmit(); break;
    case 'linelink':   myLineLink(); break;
    case 'lineunlink': myLineUnlink(); break;
    case 'reset':  S = fresh(); history.pushState({screen:'top'}, ''); render(); window.scrollTo(0,0); break;
  }
});
app.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.f === 'info'){ S.info[t.dataset.k] = t.value; }
  if(t.dataset.f === 'my'){ MY[t.dataset.k] = t.value; }
  if(t.dataset.f === 'prof'){ MY.prof[t.dataset.k] = t.value; }
});
app.addEventListener('change', e => {
  const t = e.target, f = t.dataset.f; if(!f) return;
  if(f === 'opt'){ S.opts = t.checked ? [...S.opts, t.value] : S.opts.filter(x => x !== t.value); render(); }
  else if(f === 'mins'){ S.omakase.mins = Number(t.value); render(); }
  else if(f === 'concern'){ S.omakase.concerns = t.checked ? [...S.omakase.concerns, t.value] : S.omakase.concerns.filter(x => x !== t.value); }
  else if(f === 'visit'){ S.info.visit = t.value; }
});
window.addEventListener('popstate', e => {
  if(S.result){ S.screen = 'done'; history.pushState({screen:'done'}, ''); render(); return; }
  S.screen = e.state?.screen || 'top';
  if(S.screen === 'date'){ S.busy = null; S.loading = false; }
  render(); window.scrollTo(0,0);
});
history.replaceState({screen:'top'}, '');
render();
bootstrap();
</script>
</body>
