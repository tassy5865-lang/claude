<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4F7FA;
    --cream-soft:#FFFFFF;
    --ink:#1A2332;
    --ink-soft:#5B6B82;
    --gold:#1E3A5F;
    --gold-soft:#4A90D9;
    --green:#1E3A5F;
    --green-light:#2F5C8A;
    --black:#101826;
    --line: rgba(26,35,50,0.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{ background:var(--cream); color:var(--ink); font-family:'Noto Sans JP',sans-serif; }
  ::selection{background:var(--gold-soft); color:var(--black);}
  a{color:inherit; text-decoration:none;}
  h1,h2,h3{font-family:'Shippori Mincho',serif; font-weight:600; letter-spacing:0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  .eyebrow{
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-family:'IBM Plex Mono',monospace; font-size:0.72rem; letter-spacing:0.22em;
    color:var(--gold); text-transform:uppercase; font-weight:500; margin-bottom:1.1rem;
  }
  .eyebrow::after{ content:''; width:30px; height:1px; background:var(--gold); }
  section{ padding:6.5rem 6vw; }
  .wrap{ max-width:1180px; margin:0 auto; }
  .reveal{ opacity:0; transform:translateY(28px); transition:opacity .8s ease, transform .8s ease; }
  .reveal.is-visible{ opacity:1; transform:translateY(0); }
  @media (prefers-reduced-motion: reduce){
    .reveal{ opacity:1; transform:none; transition:none; }
  }
  .center-text{ text-align:center; max-width:720px; margin:0 auto; }
  .section-sub{ color:var(--ink-soft); font-size:0.98rem; line-height:1.85; margin-top:1.2rem; }

  nav{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; justify-content:space-between; align-items:center;
    padding:20px 6vw; transition:background .3s ease, box-shadow .3s ease;
  }
  nav.scrolled{ background:rgba(246,242,234,0.92); backdrop-filter:blur(8px); box-shadow:0 1px 0 var(--line); }
  .nav-name{ font-family:'Shippori Mincho',serif; font-size:1.05rem; font-weight:600; }
  .nav-role{ font-family:'IBM Plex Mono',monospace; font-size:0.7rem; color:var(--gold); margin-left:0.6rem; letter-spacing:0.02em;}
  .role-accent{ color:var(--green-light); font-weight:600; }
  .nav-cta{ background:var(--green); color:#fff; padding:0.65rem 1.35rem; border-radius:6px; font-size:0.82rem; font-weight:500; transition:background .2s ease; }
  .nav-cta:hover{ background:var(--green-light); }

  #hero{ padding-top:11rem; padding-bottom:5rem; text-align:center; background:radial-gradient(circle at 50% 0%, #FDFBF7 0%, var(--cream) 60%); }
  .badge{ display:inline-flex; align-items:center; gap:9px; background:#fff; border:1px solid var(--line); border-radius:100px; padding:0.55rem 1.2rem; font-size:0.82rem; color:var(--ink-soft); margin-bottom:2.4rem; }
  .badge .dot{ width:7px; height:7px; border-radius:50%; background:var(--green-light); position:relative; }
  .badge .dot::before{ content:''; position:absolute; inset:-4px; background:var(--green-light); border-radius:50%; opacity:0.35; animation:ping 2s cubic-bezier(0,0,.2,1) infinite; }
  @keyframes ping{ 75%,100%{ transform:scale(2.4); opacity:0; } }

  @keyframes heroIn{ from{ opacity:0; transform:translateY(30px); } to{ opacity:1; transform:none; } }
  .hero-inner > *{ animation:heroIn .8s cubic-bezier(.16,1,.3,1) both; }
  .hero-inner > *:nth-child(1){ animation-delay:.05s; }
  .hero-inner > *:nth-child(2){ animation-delay:.14s; }
  .hero-inner > *:nth-child(3){ animation-delay:.23s; }
  .hero-inner > *:nth-child(4){ animation-delay:.32s; }
  .hero-inner > *:nth-child(5){ animation-delay:.41s; }
  .hero-inner > *:nth-child(6){ animation-delay:.5s; }
  @media (prefers-reduced-motion: reduce){
    .badge .dot::before{ animation:none; display:none; }
    .hero-inner > *{ animation:none; }
  }
  #hero h1{ font-size:clamp(2.2rem, 5vw, 3.4rem); line-height:1.4; color:var(--ink); max-width:780px; margin:0 auto; }
  #hero h1 .accent{ color:var(--gold); }
  #hero .lead{ max-width:640px; margin:1.8rem auto 0; color:var(--ink-soft); font-size:1rem; line-height:1.9; }
  #hero .lead b{ color:var(--ink); font-weight:600; }
  .hero-ctas{ display:flex; gap:1rem; justify-content:center; margin-top:2.6rem; flex-wrap:wrap; }
  .btn-primary{ background:var(--green); color:#fff; padding:1rem 1.8rem; border-radius:8px; font-size:0.92rem; font-weight:600; transition:background .2s ease; display:inline-block;}
  .btn-primary:hover{ background:var(--green-light); }
  .btn-secondary{ background:#fff; border:1px solid var(--line); color:var(--ink); padding:1rem 1.8rem; border-radius:8px; font-size:0.92rem; font-weight:500; }
  .hero-note{ margin-top:1.1rem; font-size:0.78rem; color:var(--ink-soft); }

  .stat-row{ display:flex; justify-content:center; gap:4rem; margin-top:4.5rem; padding-top:3rem; border-top:1px solid var(--line); max-width:820px; margin-left:auto; margin-right:auto; flex-wrap:wrap; }
  .stat{ text-align:center; }
  .stat .num{ font-family:'Shippori Mincho',serif; font-size:2.2rem; color:var(--gold); font-weight:600;}
  .stat .num span{ font-size:1.1rem; margin-left:2px; }
  .stat .label{ font-size:0.78rem; color:var(--ink-soft); margin-top:0.4rem; }

  .dark{ background:var(--black); color:#EDE8DE; }
  .dark .eyebrow{ color:var(--gold-soft); }
  .dark .eyebrow::after{ background:var(--gold-soft); }
  .dark h2{ color:#F5F1E8; }
  .dark .section-sub{ color:#B9B2A4; }

  .card-grid > div, .approach-grid > div, .process-grid > div, .faq-list > div, .ba-grid{
    opacity:0; transform:translateY(20px);
    transition:opacity .6s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1);
  }
  .reveal.is-visible .card-grid > div,
  .reveal.is-visible .approach-grid > div,
  .reveal.is-visible .process-grid > div,
  .reveal.is-visible .faq-list > div,
  .reveal.is-visible .ba-grid{ opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce){
    .card-grid > div, .approach-grid > div, .process-grid > div, .faq-list > div, .ba-grid{ opacity:1; transform:none; transition:none; }
  }

  .card-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:1.1rem; margin-top:3.2rem; }
  .value-card{ background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:1.6rem; display:flex; gap:0.9rem; align-items:flex-start; }
  .value-card .ico{ width:34px; height:34px; border-radius:8px; background:rgba(74,144,217,0.16); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--gold-soft); font-size:1rem; }
  .value-card p{ font-size:0.9rem; line-height:1.65; color:#D8D2C4; }
  .value-card div h3{ font-size:1rem; margin-bottom:0.4rem; color:#F5F1E8;}

  .quote-box{ margin-top:2.6rem; border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:2.4rem 2.6rem; background:rgba(255,255,255,0.03); }
  .quote-box p{ font-size:1.05rem; line-height:1.85; color:#EDE8DE; }
  .quote-box p b{ color:var(--gold-soft); font-weight:600; }

  #philosophy{ background:var(--cream-soft); }
  .flow-pill{ display:flex; gap:0.6rem; justify-content:center; align-items:center; margin-top:2rem; flex-wrap:wrap; font-size:0.85rem; color:var(--ink-soft); }
  .flow-pill .step{ padding:0.5rem 1rem; border:1px solid var(--line); border-radius:100px; background:#fff;}
  .flow-pill .step.active{ background:var(--gold); color:#fff; border-color:var(--gold); font-weight:600;}
  .light-quote{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:2.6rem; margin-top:2.6rem; text-align:center; }
  .light-quote p{ font-size:1.15rem; line-height:1.8; color:var(--ink);}
  .light-quote p b{ color:var(--gold); }

  .approach-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.3rem; margin-top:2.6rem; }
  .approach-card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:1.8rem; }
  .approach-card .num{ font-family:'IBM Plex Mono',monospace; font-size:0.75rem; color:var(--gold); margin-bottom:0.8rem;}
  .approach-card h3{ font-size:1.05rem; margin-bottom:0.6rem; }
  .approach-card p{ font-size:0.85rem; color:var(--ink-soft); line-height:1.65; }

  #focus .value-card, #usecases .value-card{ background:#fff; border:1px solid var(--line); }
  #focus .value-card .ico, #usecases .value-card .ico{ background:rgba(30,58,95,0.1); color:var(--gold);}
  #focus .value-card p, #usecases .value-card p{ color:var(--ink-soft); }
  #focus .value-card h3, #usecases .value-card h3{ font-size:1rem; margin-bottom:0.4rem; color:var(--ink);}

  #impact .stat .num{ font-size:1.6rem; }
  .impact-note{ text-align:center; font-size:0.78rem; color:var(--ink-soft); margin-top:1.6rem; }
  #usecases .record-note{ color:var(--ink-soft); }

  #problem .value-card{ background:#fff; border:1px solid var(--line); }
  #problem .value-card .ico{ background:rgba(30,58,95,0.1); color:var(--gold);}
  #problem .value-card p{ color:var(--ink-soft); }

  .ba-grid{ display:grid; grid-template-columns:1fr auto 1fr; gap:1.4rem; margin-top:3rem; align-items:stretch; }
  .ba-col{ border-radius:16px; padding:2rem; }
  .ba-before{ background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); }
  .ba-after{ background:rgba(74,144,217,0.1); border:1px solid rgba(74,144,217,0.3); }
  .ba-label{ font-family:'IBM Plex Mono',monospace; font-size:0.7rem; letter-spacing:0.1em; margin-bottom:1rem; }
  .ba-before .ba-label{ color:#8A8375; }
  .ba-after .ba-label{ color:var(--gold-soft); }
  .ba-col ul{ list-style:none; }
  .ba-col li{ font-size:0.88rem; line-height:1.75; margin-bottom:0.7rem; padding-left:1.2rem; position:relative; }
  .ba-before li{ color:#B9B2A4; }
  .ba-before li::before{ content:'−'; position:absolute; left:0; color:#8A8375; font-weight:700;}
  .ba-after li{ color:#EDE8DE; }
  .ba-after li::before{ content:'✓'; position:absolute; left:0; color:var(--gold-soft); font-weight:700;}
  .ba-arrow{ display:flex; align-items:center; justify-content:center; font-size:1.6rem; color:var(--gold-soft); }

  #process{ background:var(--cream-soft); }
  .process-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.3rem; margin-top:3rem;}
  .process-card{ background:#fff; border:1px solid var(--gold-soft); border-radius:14px; padding:1.9rem; }
  .process-card .step-label{ font-family:'IBM Plex Mono',monospace; font-size:0.7rem; color:var(--gold); letter-spacing:0.1em; }
  .process-card h3{ font-size:1.15rem; margin:0.5rem 0 1rem; }
  .process-card ul{ list-style:none; }
  .process-card li{ font-size:0.85rem; color:var(--ink-soft); margin-bottom:0.6rem; padding-left:1.1rem; position:relative; line-height:1.6;}
  .process-card li::before{ content:'✓'; position:absolute; left:0; color:var(--green-light); font-weight:700;}

  #record .stat-row{ border-top:none; padding-top:0; margin-top:2.6rem; gap:2.5rem;}
  #record .stat .num{ color:var(--gold-soft); }
  #record .stat .label{ color:#B9B2A4; }
  .record-note{ text-align:center; font-size:0.75rem; color:#8A8375; margin-top:1rem;}
  .record-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.1rem; margin-top:3rem;}
  .record-card{ background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:1.7rem; transition:opacity .25s ease, transform .25s ease; }
  .record-card.is-hidden{ display:none; }
  .record-card .tag{ font-family:'IBM Plex Mono',monospace; font-size:0.68rem; color:var(--gold-soft); letter-spacing:0.06em; }
  .tag-filter{ display:flex; gap:0.6rem; justify-content:center; flex-wrap:wrap; margin-top:2.6rem; }
  .tag-filter button{
    font-family:'IBM Plex Mono',monospace; font-size:0.72rem; letter-spacing:0.06em;
    padding:0.5rem 1.1rem; border-radius:100px; border:1px solid rgba(255,255,255,0.18);
    background:transparent; color:#B9B2A4; cursor:pointer; transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .tag-filter button:hover{ border-color:var(--gold-soft); color:#F5F1E8; }
  .tag-filter button.active{ background:var(--gold-soft); border-color:var(--gold-soft); color:#fff; font-weight:600; }
  .record-card h3{ font-size:1rem; margin:0.6rem 0 0.6rem; color:#F5F1E8; }
  .record-card p{ font-size:0.83rem; color:#B9B2A4; line-height:1.6; }

  .profile-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:1.6rem; margin-top:3rem; align-items:stretch; }
  .profile-card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:2.4rem; }
  .profile-head{ display:flex; gap:1.2rem; align-items:center; padding-bottom:1.4rem; border-bottom:1px solid var(--line); margin-bottom:1.4rem;}
  .avatar{ width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg, var(--gold-soft), var(--green-light)); flex-shrink:0; background-size:cover; background-position:center;}
  .profile-head h3{ font-size:1.2rem; }
  .profile-head .role{ font-size:0.8rem; color:var(--ink-soft); margin-top:0.3rem; }
  .profile-card ul{ list-style:none; }
  .profile-card li{ font-size:0.9rem; color:var(--ink-soft); line-height:1.7; margin-bottom:0.8rem; padding-left:1.3rem; position:relative;}
  .profile-card li::before{ content:'✓'; position:absolute; left:0; color:var(--gold); font-weight:700;}
  .side-stats{ display:flex; flex-direction:column; gap:1rem; }
  .side-stat{ background:var(--black); color:#fff; border-radius:14px; padding:1.6rem; }
  .side-stat .num{ font-family:'Shippori Mincho',serif; font-size:1.5rem; color:var(--gold-soft); }
  .side-stat .label{ font-size:0.78rem; color:#B9B2A4; margin-top:0.4rem; }

  #linkout{ background:var(--cream-soft); }
  .linkout-card{ margin-top:3rem; background:#fff; border:1px solid var(--line); border-radius:16px; padding:2.4rem; display:flex; justify-content:space-between; align-items:center; gap:1.5rem; flex-wrap:wrap; }
  .linkout-card .txt h3{ font-size:1.1rem; margin-bottom:0.5rem; }
  .linkout-card .txt p{ font-size:0.88rem; color:var(--ink-soft); line-height:1.7; }

  #faq{ background:var(--cream-soft); }
  .faq-list{ margin-top:3rem; max-width:820px; margin-left:auto; margin-right:auto; }
  .faq-item{ border-bottom:1px solid var(--line); padding:1.4rem 0; }
  .faq-item .q{ font-size:0.98rem; font-weight:600; color:var(--ink); display:flex; gap:0.7rem; }
  .faq-item .q .qmark{ color:var(--gold); font-family:'IBM Plex Mono',monospace; flex-shrink:0; }
  .faq-item .a{ font-size:0.88rem; color:var(--ink-soft); line-height:1.75; margin-top:0.6rem; padding-left:1.6rem; }

  #whynow{ padding-bottom:0; }
  .whynow-card{ background:var(--black); border-radius:18px; padding:3rem; text-align:center; max-width:820px; margin:0 auto; }
  .whynow-card h2{ color:#F5F1E8; font-size:1.6rem; margin-top:0.6rem; }
  .whynow-card p{ color:#B9B2A4; font-size:0.9rem; margin-top:1rem; line-height:1.8; }

  #cta{ background:linear-gradient(135deg, var(--green), #0F2038); text-align:center; color:#fff; padding:6rem 6vw; }
  #cta h2{ color:#fff; font-size:clamp(1.7rem,4vw,2.5rem); }
  #cta .btn-primary{ background:#fff; color:var(--green); margin-top:2.2rem; }
  #cta .btn-primary:hover{ background:#F5F1E8; }
  #cta .cta-note{ margin-top:1rem; font-size:0.8rem; color:rgba(255,255,255,0.75); }

  footer{ background:var(--black); color:#8A8375; padding:2.6rem 6vw; text-align:center; font-size:0.8rem; }
  footer .flinks{ margin-top:0.8rem; display:flex; gap:1.4rem; justify-content:center; }
  footer .flinks a{ color:#B9B2A4; }
  footer .flinks a:hover{ color:#fff; }

  @media (max-width:860px){
    .card-grid, .approach-grid, .process-grid, .record-grid{ grid-template-columns:1fr !important; }
    .profile-grid{ grid-template-columns:1fr; }
    .stat-row{ gap:2rem; }
    section{ padding:4.5rem 6vw; }
    .nav-role{ display:none; }
    .linkout-card{ flex-direction:column; align-items:flex-start; }
    .ba-grid{ grid-template-columns:1fr; }
    .ba-arrow{ transform:rotate(90deg); padding:0.5rem 0; }
  }
</style>
</head>
<body>

<nav id="nav">
  <div><span class="nav-name" id="nav-name"></span><span class="nav-role" id="nav-role"></span></div>
  <a class="nav-cta" id="nav-cta" href="#contact"></a>
</nav>

<section id="hero"><div class="wrap hero-inner" id="hero-wrap"></div></section>
<section id="problem"><div class="wrap reveal" id="problem-wrap"></div></section>
<section id="values" class="dark"><div class="wrap reveal" id="values-wrap"></div></section>
<section id="philosophy"><div class="wrap reveal" id="philosophy-wrap"></div></section>
<section id="beforeafter" class="dark"><div class="wrap reveal" id="beforeafter-wrap"></div></section>
<section id="impact"><div class="wrap reveal" id="impact-wrap"></div></section>
<section id="usecases"><div class="wrap reveal" id="usecases-wrap"></div></section>
<section id="focus"><div class="wrap reveal" id="focus-wrap"></div></section>
<section id="process"><div class="wrap reveal" id="process-wrap"></div></section>
<section id="record" class="dark"><div class="wrap reveal" id="record-wrap"></div></section>
<section id="linkout"><div class="wrap reveal" id="linkout-wrap"></div></section>
<section id="profile-sec"><div class="wrap reveal" id="profile-wrap"></div></section>
<section id="whynow"><div class="wrap reveal" id="whynow-wrap"></div></section>
<section id="faq"><div class="wrap reveal" id="faq-wrap"></div></section>
<section id="cta"><div class="wrap reveal" id="cta-wrap"></div></section>
<footer id="footer-wrap"></footer>

<script>
/* ======================================================================
   ▼▼▼ ここから下の SITE オブジェクトだけを書き換えれば、
   職業・目的を問わずこのテンプレートを使い回せます。 ▼▼▼
   (HTML/CSSは変更不要です)
====================================================================== */
const SITE = {
  meta: { title: "田代 裕貴(AI・DXコンサル) | AI活用・業務改善" },

  nav: {
    name: "田代 裕貴<span class=\"role-accent\">(AI・DXコンサル)</span>",   // 空文字 "" にすると非表示(モバイルでは元々非表示)
    role: "AI活用 / 業務改善",
    ctaLabel: "お問い合わせ",
    ctaHref: "#contact"
  },

  hero: {
    badge: "ここまでご覧いただき、ありがとうございます",
    titlePre: "現場の課題を、",
    titleAccent: "AI",
    titlePost: "で形にする。",
    lead: "臨床工学技士として現場に立ちながら、AIツールを活用した<b>業務改善ツールの開発</b>、<b>AI研修</b>、<b>ホームページ・LP制作</b>にも取り組んでいます。現場を知っているからこそ、実際に使われる仕組みをつくれると考えています。",
    ctaPrimary: { label: "お問い合わせ →", href: "#contact" },
    ctaSecondary: { label: "取り組みを見る", href: "#focus" },
    note: "プロフィールは随時更新しています。",
    stats: [
      { num:"開発中", unit:"", label:"業務改善ツール" },
      { num:"対応可", unit:"", label:"AI研修・勉強会" },
      { num:"制作", unit:"", label:"ホームページ・LP" }
    ]
  },

  problem: {
    eyebrow: "problem",
    title: "こんなお困りごと、<br>ありませんか。",
    sub: "臨床の現場でも、日々の業務の中でこうした声をよく耳にします。",
    cards: [
      { icon:"✎", text:"記録や集計を、<b>紙やExcelへの手作業</b>で続けている" },
      { icon:"⟳", text:"毎回ほぼ同じ手順の<b>繰り返し作業</b>に時間を取られている" },
      { icon:"？", text:"AIを業務に取り入れたいが、<b>何から始めればいいか分からない</b>" },
      { icon:"⚠", text:"導入したツールが<b>専門的すぎて現場に定着しない</b>" }
    ]
  },

  values: {
    eyebrow: "focus",
    title: "知っているだけでは、<br>現場は変わらない。",

// タグフィルターの動作
const filterButtons = document.querySelectorAll('.tag-filter button');
const recordCards = document.querySelectorAll('.record-card');
filterButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    filterButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const target = btn.dataset.filter;
    recordCards.forEach(card => {
      const show = (target === 'ALL' || card.dataset.tag === target);
      card.classList.toggle('is-hidden', !show);
    });
  });
});

  <div class="flinks">${SITE.footer.links.map(l => `<a href="${l.href}">${l.label}</a>`).join('')}</div>
  <div style="margin-top:0.8rem;">${SITE.footer.copyright}</div>
`;

const nav = document.getElementById('nav');
window.addEventListener('scroll', () => {
  nav.classList.toggle('scrolled', window.scrollY > 40);
});

// スクロールでのフェードイン
if ('IntersectionObserver' in window) {
  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });
  document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
} else {
  document.querySelectorAll('.reveal').forEach(el => el.classList.add('is-visible'));
}
</script>

</body>
