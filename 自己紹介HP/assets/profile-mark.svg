<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title desc">
  <title id="title">田代裕貴 プロフィールマーク</title>
  <desc id="desc">青いグラデーションを背景にTYの文字を配置したプロフィール画像</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#4a90d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="25%" cy="15%" r="80%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="480" rx="120" fill="url(#bg)"/>
  <rect width="480" height="480" rx="120" fill="url(#glow)"/>
  <circle cx="240" cy="240" r="170" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
  <text x="240" y="278" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="138" font-weight="700" letter-spacing="-10">TY</text>
  <text x="240" y="350" text-anchor="middle" fill="#fff" fill-opacity=".8" font-family="Arial, sans-serif" font-size="20" letter-spacing="5">AI × CLINICAL</text>
</svg>
