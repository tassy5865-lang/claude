<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TateCut — 動画編集スタジオ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">▮</span>TateCut <small>動画編集スタジオ</small></div>
  <div class="top-actions">
    <div class="seg" id="tools">
      <button data-tool="select" class="on" title="選択ツール (V)">➤<span> 選択</span></button>
      <button data-tool="razor" title="レーザーツール (C)">✂<span> レーザー</span></button>
    </div>
    <button id="btnSnap" class="toggle on" title="スナップ (S)">🧲</button>
    <button id="btnUndo" title="元に戻す (Ctrl+Z)">↶</button>
    <button id="btnRedo" title="やり直す (Ctrl+Shift+Z)">↷</button>
    <button id="btnAuto" class="primary">✦<span> おまかせ編集</span></button>
  </div>
</header>

<main class="workspace">
  <section class="side">
    <nav class="tabs" id="tabs">
      <button data-tab="media" class="on">素材</button>
      <button data-tab="clip">クリップ</button>
      <button data-tab="color">カラー</button>
      <button data-tab="auto">自動編集</button>
      <button data-tab="caption">テロップ</button>
      <button data-tab="post">投稿文</button>
      <button data-tab="export">書き出し</button>
    </nav>

    <div class="pane on" data-pane="media">
      <label class="drop" id="drop">
        <input type="file" id="file" multiple accept="video/*,image/*,audio/*" hidden>
        <b>＋ 素材を読み込む</b>
        <span>動画・画像・音楽をタップまたはドロップ<br>（ファイルは端末の中だけで処理されます）</span>
      </label>
      <div class="btnrow" style="margin-top:8px">
        <button id="btnAddText">＋ テキスト</button>
        <button id="btnAddSolid">＋ カラーマット</button>
      </div>
      <div id="mediaList" class="media-list"></div>
    </div>

    <div class="pane" data-pane="clip">
      <div id="inspector" class="inspector"></div>
    </div>

    <div class="pane" data-pane="color">
      <h3>スコープ（RGBヒストグラム）</h3>
      <canvas id="scope" width="340" height="110" class="scope"></canvas>
      <h3>ルック</h3>
      <div class="chips" id="gradePresets"></div>
      <h3>全体の補正</h3>
      <div id="gradeSliders"></div>
      <p class="hint">クリップごとの色調整は「クリップ」タブにあります。</p>
    </div>

    <div class="pane" data-pane="auto">
      <h3>無音カット（V1トラック）</h3>
      <label class="row">しきい値 <output id="oTh"></output><input type="range" id="sTh" min="-60" max="-15" value="-38"></label>
      <label class="row">無音とみなす長さ <output id="oSil"></output><input type="range" id="sSil" min="0.15" max="1.5" step="0.05" value="0.4"></label>
      <label class="row">前後の余白 <output id="oPad"></output><input type="range" id="sPad" min="0" max="0.3" step="0.01" value="0.08"></label>
      <button id="btnCut">無音をカット</button>
      <h3>おまかせ編集の内容</h3>
      <label class="check"><input type="checkbox" id="aCut" checked> 無音カット</label>
      <label class="check"><input type="checkbox" id="aAsr" checked> 音声からテロップを自動生成</label>
      <label class="check"><input type="checkbox" id="aZoom" checked> カットごとにパンチズーム</label>
      <label class="check"><input type="checkbox" id="aGrade" checked> カラー補正（シネマ）</label>
      <label class="check"><input type="checkbox" id="aPost" checked> 投稿文の下書き</label>
      <h3>作業ログ</h3>
      <div id="log" class="log"></div>
    </div>

    <div class="pane" data-pane="caption">
      <h3>音声から自動生成</h3>
      <label class="row">モデル
        <select id="asrModel">
          <option value="Xenova/whisper-tiny">tiny（約40MB・速い）</option>
          <option value="Xenova/whisper-base" selected>base（約80MB・標準）</option>
          <option value="Xenova/whisper-small">small（約250MB・高精度）</option>
        </select>
      </label>
      <label class="row">言語
        <select id="asrLang"><option value="japanese">日本語</option><option value="english">English</option></select>
      </label>
      <button id="btnAsr">文字起こししてテロップ化</button>
      <p class="hint">初回のみモデルをダウンロードします。音声は外部に送信されません。</p>
      <h3>台本から流し込み</h3>
      <textarea id="script" rows="5" placeholder="台本を貼り付けると、V1トラックの長さに合わせて自動で割り振ります"></textarea>
      <button id="btnScript">台本をテロップ化</button>
      <h3>一括設定</h3>
      <label class="row">1枚の最大文字数 <output id="oMax"></output><input type="range" id="sMax" min="6" max="24" value="12"></label>
      <label class="row">スタイル<select id="capPreset"></select></label>
      <button id="btnCapAll">全テロップにスタイルを適用</button>
    </div>

    <div class="pane" data-pane="post">
      <label class="row">投稿先
        <select id="platform">
          <option value="ig">Instagram リール</option>
          <option value="tt">TikTok</option>
          <option value="yt">YouTube ショート</option>
          <option value="x">X</option>
        </select>
      </label>
      <textarea id="postText" rows="11" placeholder="投稿文をここで編集"></textarea>
      <div class="counter" id="postCount"></div>
      <label class="row">キーワード（カンマ区切り）<input type="text" id="postKeys" placeholder="例: AI, 動画編集"></label>
      <div class="btnrow">
        <button id="btnDraft">テロップから下書き</button>
        <button id="btnTags">ハッシュタグ整形</button>
        <button id="btnCopy">コピー</button>
      </div>
    </div>

    <div class="pane" data-pane="export">
      <h3>シーケンス設定</h3>
      <label class="row">画面サイズ
        <select id="seqSize">
          <option value="1080x1920">縦 9:16（1080×1920）</option>
          <option value="1920x1080">横 16:9（1920×1080）</option>
          <option value="1080x1080">正方形 1:1（1080×1080）</option>
          <option value="1080x1350">縦 4:5（1080×1350）</option>
        </select>
      </label>
      <label class="row">フレームレート
        <select id="seqFps"><option>24</option><option selected>30</option><option>60</option></select>
      </label>
      <h3>書き出し</h3>
      <label class="row">範囲
        <select id="expRange"><option value="all">シーケンス全体</option><option value="io">イン点〜アウト点</option></select>
      </label>
      <div class="btnrow">
        <button id="btnIn" title="I">イン点を設定</button>
        <button id="btnOut" title="O">アウト点を設定</button>
        <button id="btnIoClear">解除</button>
      </div>
      <label class="row" style="margin-top:9px">画質
        <select id="expRate"><option value="4">軽い（4Mbps）</option><option value="8" selected>標準（8Mbps）</option><option value="16">高画質（16Mbps）</option></select>
      </label>
      <button id="btnExport" class="primary">動画を書き出す</button>
      <button id="btnFrame">いまのフレームを画像で保存</button>
      <div id="exportStatus" class="hint">再生しながら録画するため、動画の長さと同じ時間がかかります。</div>
      <div id="downloads"></div>
      <h3>プロジェクト</h3>
      <p class="hint" id="saveStatus">編集内容はこのブラウザに自動保存されます。</p>
      <button id="btnNew">新規プロジェクト（すべて消去）</button>
    </div>
  </section>

  <section class="stage">
    <div class="canvas-wrap"><canvas id="cv" width="1080" height="1920"></canvas></div>
    <div class="transport">
      <button id="btnStart" title="先頭へ (Home)">⏮</button>
      <button id="btnPlay" class="play" title="再生/停止 (Space)">▶</button>
      <span id="tc" class="tc">0:00.00 / 0:00.00</span>
      <canvas id="meter" width="60" height="14" class="meter" title="音量メーター"></canvas>
      <button id="btnSplit" title="再生位置で分割 (Ctrl+K)">✂<span> 分割</span></button>
      <button id="btnDel" title="削除 (Delete)">🗑<span> 削除</span></button>
      <button id="btnRipple" title="詰めて削除 (Shift+Delete)">⇤<span> 詰めて削除</span></button>
      <button id="btnMarker" title="マーカー (M)">◆<span> マーカー</span></button>
      <span class="tl-tools">
        <button id="btnAddV" title="映像トラックを追加">＋V</button>
        <button id="btnAddA" title="音声トラックを追加">＋A</button>
        <button id="btnFit" title="全体を表示">全体</button>
        <input type="range" id="sZoom" min="4" max="240" value="60" title="タイムラインの拡大">
      </span>
    </div>
  </section>
</main>

<section class="timeline">
  <div class="tl-head" id="tlHead"></div>
  <div class="tl-scroll" id="tlScroll">
    <div class="tl-inner" id="tlInner">
      <div class="ruler" id="ruler"></div>
      <div id="rows"></div>
      <div class="playhead" id="playhead"></div>
    </div>
  </div>
</section>

<div id="pool" class="pool" aria-hidden="true"></div>
<script src="app.js"></script>
</body>
</html>
