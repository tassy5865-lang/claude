<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-OCR文字起こしツール</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background-color: #05070c; margin: 0; overflow: hidden; }
        .workspace-bg {
            background-color: #05070c;
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.07) 1px, transparent 0);
            background-size: 28px 28px;
        }
        .canvas-container { position: relative; display: inline-block; user-select: none; margin-bottom: 24px; border-radius: 14px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08); }
        .region-box { position: absolute; border: 2px solid #8b5cf6; background-color: rgba(139, 92, 246, 0.18); cursor: move; border-radius: 3px; box-shadow: 0 0 0 1px rgba(139,92,246,0.25); }
        .region-box.selected { border-color: #f43f5e; background-color: rgba(244, 63, 94, 0.18); z-index: 10; box-shadow: 0 0 0 1px rgba(244,63,94,0.4), 0 0 18px rgba(244,63,94,0.35); }
        .resize-handle { position: absolute; width: 11px; height: 11px; background-color: #fff; border: 2px solid #8b5cf6; border-radius: 3px; right: -6px; bottom: -6px; cursor: se-resize; }
        .selected .resize-handle { border-color: #f43f5e; }
        .region-label { position: absolute; top: -24px; left: -2px; background: #8b5cf6; color: white; padding: 2px 7px; font-size: 11px; font-weight: 600; border-radius: 5px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
        .selected .region-label { background: #f43f5e; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f4759; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #565f75; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        /** @jsx React.createElement */
        /** @jsxFrag React.Fragment */

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const { useState, useEffect, useRef, useCallback } = React;

        const GEMINI_MODEL_PRESETS = [
            { value: 'gemini-flash-latest', label: 'Gemini Flash（標準・推奨）' },
            { value: 'gemini-flash-lite-latest', label: 'Gemini Flash-Lite（高速・低コスト）' },
            { value: 'gemini-pro-latest', label: 'Gemini Pro（高精度・複雑な帳票向け）' },
        ];

        const callGeminiAPI = async (apiKey, modelName, prompt, imageBase64s, schema, maxRetries = 5) => {
            if (!apiKey) {
                throw new Error("Gemini APIキーが設定されていません。画面右上の設定アイコンから入力してください。");
            }
            const model = modelName || 'gemini-flash-latest';
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            const delays = [1000, 2000, 4000, 8000, 16000];

            const images = Array.isArray(imageBase64s) ? imageBase64s : [imageBase64s];
            const imageParts = images.map(img => ({ inlineData: { mimeType: "image/png", data: img.split(',')[1] } }));

            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [
                            { text: prompt },
                            ...imageParts
                        ]
                    }
                ],
                generationConfig: {
                    temperature: 0.1,
                    responseMimeType: "application/json",
                    responseSchema: schema
                }
            };

            for (let i = 0; i <= maxRetries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if (response.status === 400 || response.status === 403) {
                            const errBody = await response.text();
                            throw new Error(`APIキーが無効か、権限がありません。設定を確認してください。(${response.status})`);
                        }
                        throw new Error(`API Error: ${response.status}`);
                    }

                    const data = await response.json();
                    if (!data.candidates || data.candidates.length === 0) throw new Error("No candidates returned.");

                    const text = data.candidates[0].content.parts[0].text;
                    return JSON.parse(text);
                } catch (error) {
                    if (i === maxRetries) throw error;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        };

        const callGasAPI = async (gasUrl, action, payload = null) => {
            if (!gasUrl) throw new Error("GAS URL is not defined");

            try {
                if (action === 'getTemplates') {
                    const res = await fetch(gasUrl);
                    if (!res.ok) throw new Error(`GAS GET Error: ${res.status}`);
                    return await res.json();
                } else if (action === 'saveTemplate') {
                    const res = await fetch(gasUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action: 'saveTemplate', ...payload })
                    });
                    if (!res.ok) throw new Error(`GAS POST Error: ${res.status}`);
                    return await res.json();
                }
            } catch (e) {
                console.error("GAS API Error:", e);
                throw e;
            }
        };

        const Icon = ({ name, className }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current) {
                    ref.current.innerHTML = `<i data-lucide="${name}" class="${className || ''}"></i>`;
                    lucide.createIcons({
                        root: ref.current
                    });
                }
            }, [name, className]);
            return <span ref={ref} className="contents"></span>;
        };

        const Modal = ({ isOpen, title, message, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[100]">
                    <div className="bg-slate-900 border border-white/10 rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                        <h3 className="text-lg font-bold mb-2 text-white">{title}</h3>
                        <p className="text-slate-400 mb-6 whitespace-pre-wrap">{message}</p>
                        <div className="flex justify-end">
                            <button onClick={onClose} className="bg-gradient-to-r from-violet-600 to-blue-600 hover:from-violet-500 hover:to-blue-500 text-white px-4 py-2 rounded-lg transition-all duration-200">
                                OK
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [pdfFile, setPdfFile] = useState(null);
            const [pdfDoc, setPdfDoc] = useState(null); // null の場合は画像ファイルとして扱う
            const [numPages, setNumPages] = useState(0);

            const [pagesPerSet, setPagesPerSet] = useState(1);
            const [currentSet, setCurrentSet] = useState(1);
            const [setImages, setSetImages] = useState([]);

            const [regions, setRegions] = useState([]);
            const [selectedRegionId, setSelectedRegionId] = useState(null);
            const [focusedRegionName, setFocusedRegionName] = useState(null);
            const [ocrResults, setOcrResults] = useState(null);

            const [isLoading, setIsLoading] = useState(false);
            const [loadingText, setLoadingText] = useState("");
            const [modal, setModal] = useState({ isOpen: false, title: "", message: "" });
            const [logs, setLogs] = useState([]);
            const [showLabels, setShowLabels] = useState(true);

            const [apiKey, setApiKey] = useState("");
            const [apiKeyInput, setApiKeyInput] = useState("");
            const [showApiKey, setShowApiKey] = useState(false);

            const [modelName, setModelName] = useState("gemini-flash-latest");
            const [modelNameInput, setModelNameInput] = useState("gemini-flash-latest");

            const [gasUrl, setGasUrl] = useState("");
            const [showGasSettings, setShowGasSettings] = useState(false);
            const [gasUrlInput, setGasUrlInput] = useState("");
            const [templates, setTemplates] = useState([]);
            const [selectedTemplateIndex, setSelectedTemplateIndex] = useState("");

            // Template Saving States
            const [showSaveTemplateModal, setShowSaveTemplateModal] = useState(false);
            const [newTemplateName, setNewTemplateName] = useState("");
            const [activeTemplateName, setActiveTemplateName] = useState(null);

            // Interaction & Drag States
            const containerRefs = useRef([]);
            const [interaction, setInteraction] = useState({ type: 'idle', id: null, pageOffset: 0, startX: 0, startY: 0, initialRect: null });
            const dragItemRef = useRef(null);
            const dragOverItemRef = useRef(null);

            // 領域の他ページへの複製メニュー
            const [copyMenuRegionId, setCopyMenuRegionId] = useState(null);

            useEffect(() => {
                if (!copyMenuRegionId) return;
                const closeMenu = () => setCopyMenuRegionId(null);
                window.addEventListener('click', closeMenu);
                return () => window.removeEventListener('click', closeMenu);
            }, [copyMenuRegionId]);

            const showMessage = (title, message) => setModal({ isOpen: true, title, message });

            const addLog = useCallback((msg, type = 'info') => {
                setLogs(prev => [...prev, { time: new Date().toLocaleTimeString('ja-JP', { hour12: false }), msg, type }]);
            }, []);

            useEffect(() => {
                try {
                    const savedApiKey = localStorage.getItem('geminiApiKey');
                    if (savedApiKey) {
                        setApiKey(savedApiKey);
                    }
                    const savedModel = localStorage.getItem('geminiModel');
                    if (savedModel) {
                        setModelName(savedModel);
                        setModelNameInput(savedModel);
                    }
                    const savedUrl = localStorage.getItem('gasWebhookUrl');
                    if (savedUrl) {
                        setGasUrl(savedUrl);
                        fetchTemplates(savedUrl);
                    }
                } catch (e) {
                    console.error("localStorage access error:", e);
                }
            }, []);

            const openSettings = () => {
                setApiKeyInput(apiKey);
                setModelNameInput(modelName);
                setGasUrlInput(gasUrl);
                setShowGasSettings(true);
            };

            const handleSaveSettings = () => {
                const key = apiKeyInput.trim();
                const model = modelNameInput.trim() || 'gemini-flash-latest';
                const url = gasUrlInput.trim();

                if (!key) {
                    showMessage("エラー", "Gemini APIキーを入力してください。");
                    return;
                }

                try {
                    localStorage.setItem('geminiApiKey', key);
                    localStorage.setItem('geminiModel', model);
                } catch (e) {
                    console.error("Failed to save API key to localStorage:", e);
                }
                setApiKey(key);
                setModelName(model);
                addLog(`Gemini APIキーを設定しました。（使用モデル: ${model}）`, 'success');

                if (url) {
                    if (!url.startsWith('http')) {
                        showMessage("エラー", "GAS WebアプリURLの形式が正しくありません。");
                        return;
                    }
                    try {
                        localStorage.setItem('gasWebhookUrl', url);
                    } catch (e) {
                        console.error("Failed to save to localStorage:", e);
                    }
                    setGasUrl(url);
                    addLog(`GAS Webhook URLを設定しました。`, 'success');
                    fetchTemplates(url);
                }

                setShowGasSettings(false);
            };

            const fetchTemplates = async (url) => {
                addLog("GASからテンプレート一覧を取得しています...", "info");
                try {
                    const data = await callGasAPI(url, 'getTemplates');
                    setTemplates(data || []);
                    addLog(`テンプレートを ${data.length} 件取得しました。`, 'success');
                } catch (e) {
                    addLog(`テンプレートの取得に失敗しました。URLが正しいか確認してください。`, 'error');
                }
            };

            const handleApplyTemplate = () => {
                if (selectedTemplateIndex === "") return;
                const template = templates[selectedTemplateIndex];
                if (template && template.regions) {
                    const newRegions = template.regions.map((r, idx) => ({
                        ...r,
                        id: `region_${Date.now()}_${idx}`
                    }));
                    setRegions(newRegions);
                    setActiveTemplateName(template.name);
                    addLog(`テンプレート「${template.name}」を適用しました。`, 'success');
                }
            };

            const handleSaveTemplate = async (isUpdate = false) => {
                const saveName = isUpdate ? activeTemplateName : newTemplateName.trim();
                if (!saveName || regions.length === 0) return;

                setIsLoading(true);
                setLoadingText(isUpdate ? "テンプレートを上書き保存中..." : "新規テンプレートを保存中...");

                try {
                    const regionsToSave = regions.map(r => ({
                        name: r.name,
                        type: r.type,
                        x: r.x,
                        y: r.y,
                        w: r.w,
                        h: r.h,
                        pageOffset: r.pageOffset
                    }));

                    await callGasAPI(gasUrl, 'saveTemplate', {
                        name: saveName,
                        regions: regionsToSave,
                        isUpdate: isUpdate,
                        originalName: isUpdate ? activeTemplateName : null
                    });

                    addLog(`テンプレート「${saveName}」を${isUpdate ? '上書き' : '新規'}保存しました。`, 'success');

                    setShowSaveTemplateModal(false);
                    if (!isUpdate) {
                        setNewTemplateName("");
                    }
                    setActiveTemplateName(saveName);

                    fetchTemplates(gasUrl);
                } catch (e) {
                    addLog(`テンプレートの保存に失敗しました。`, 'error');
                    showMessage("エラー", "テンプレートの保存に失敗しました。");
                } finally {
                    setIsLoading(false);
                }
            };

            const renderPageToBase64 = async (pdf, pageNum) => {
                const page = await pdf.getPage(pageNum);
                const scale = 2.0;
                const viewport = page.getViewport({ scale });
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                await page.render({ canvasContext: ctx, viewport }).promise;
                return canvas.toDataURL('image/png');
            };

            const loadSetImages = async (pdf, setIdx, perSet) => {
                if (!pdf) return; // PDFがない(画像)場合はスキップ

                setIsLoading(true);
                setLoadingText(`プレビュー画像を生成中...`);
                try {
                    const imgs = [];
                    const startPage = (setIdx - 1) * perSet + 1;
                    for (let i = 0; i < perSet; i++) {
                        const pageNum = startPage + i;
                        if (pageNum <= pdf.numPages) {
                            imgs.push(await renderPageToBase64(pdf, pageNum));
                        }
                    }
                    setSetImages(imgs);
                    setCurrentSet(setIdx);
                } catch (error) {
                    console.error(error);
                    showMessage("エラー", "画像の読み込みに失敗しました。");
                } finally {
                    setIsLoading(false);
                }
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const isPDF = file.type === 'application/pdf';
                const isImage = file.type.startsWith('image/');

                if (!isPDF && !isImage) {
                    showMessage("エラー", "有効なPDFまたは画像ファイルを選択してください。");
                    return;
                }

                setIsLoading(true);
                setLoadingText("ファイルを読み込んでいます...");
                setPdfFile(file);
                setRegions([]);
                setOcrResults(null);
                setPagesPerSet(1);
                setCurrentSet(1);
                setLogs([]);
                setActiveTemplateName(null);
                addLog(`ファイル「${file.name}」の読み込みを開始しました。`);

                try {
                    if (isPDF) {
                        const fileReader = new FileReader();
                        fileReader.onload = async function() {
                            const typedarray = new Uint8Array(this.result);
                            const pdf = await pdfjsLib.getDocument(typedarray).promise;
                            setPdfDoc(pdf);
                            setNumPages(pdf.numPages);
                            addLog(`PDFの解析完了: 全 ${pdf.numPages} ページを認識しました。`);

                            let detectedPagesPerSet = 1;

                            if (pdf.numPages > 1 && apiKey) {
                                addLog("AIによるセット構成（ページ数）の自動判定を実行中...", "info");
                                setLoadingText("AIがPDFの構成を自動分析しています...");
                                try {
                                    const testPagesCount = Math.min(4, pdf.numPages);
                                    const testImages = [];
                                    for(let i=1; i<=testPagesCount; i++) {
                                        const page = await pdf.getPage(i);
                                        const viewport = page.getViewport({ scale: 0.5 });
                                        const canvas = document.createElement('canvas');
                                        canvas.width = viewport.width; canvas.height = viewport.height;
                                        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                                        testImages.push(canvas.toDataURL('image/png'));
                                    }

                                    const prompt = `提供された複数の画像は、ある帳票PDFの先頭から順番のページです。
このPDFは、Nページで1つの書類のセット（1レコード）を構成し、それが繰り返される構造になっている可能性があります。
各ページの内容、見出し、フォーマットの連続性を分析し、「1つのセットが何ページで構成されているか」を推測してください。
例えば、1ページ目が基本情報、2ページ目が明細なら「2」です。すべてのページが独立しているなら「1」です。
結果は以下のJSONスキーマに従って出力してください。`;

                                    const schema = {
                                        type: "OBJECT",
                                        properties: {
                                            pages_per_set: { type: "INTEGER", description: "推測される1セットあたりのページ数 (1以上の整数)" }
                                        },
                                        required: ["pages_per_set"]
                                    };

                                    const data = await callGeminiAPI(apiKey, modelName, prompt, testImages, schema);
                                    if (data.pages_per_set >= 1 && data.pages_per_set <= pdf.numPages) {
                                        detectedPagesPerSet = data.pages_per_set;
                                        addLog(`自動判定完了: 1セット ${detectedPagesPerSet} ページと推測しました。`, "success");
                                    }
                                } catch (err) {
                                    console.error(err);
                                    addLog("セット構成の自動判定に失敗しました。デフォルトの1ページ構成で表示します。", "warning");
                                }
                            } else if (pdf.numPages > 1) {
                                addLog("Gemini APIキー未設定のため、セット構成の自動判定をスキップしました。", "warning");
                            }

                            setPagesPerSet(detectedPagesPerSet);
                            await loadSetImages(pdf, 1, detectedPagesPerSet);
                            addLog(`初期表示が完了しました。`, 'success');
                            setIsLoading(false);
                        };
                        fileReader.readAsArrayBuffer(file);
                    } else if (isImage) {
                        const fileReader = new FileReader();
                        fileReader.onload = (event) => {
                            const dataUrl = event.target.result;
                            setPdfDoc(null); // 画像ファイルであることを示す
                            setNumPages(1);
                            setPagesPerSet(1);
                            setSetImages([dataUrl]);
                            setCurrentSet(1);
                            addLog(`画像の解析完了: 1ページとして認識しました。`);
                            addLog(`初期表示が完了しました。`, 'success');
                            setIsLoading(false);
                        };
                        fileReader.onerror = () => {
                            addLog(`エラー: 画像の読み込みに失敗しました。`, 'error');
                            showMessage("エラー", "画像の読み込みに失敗しました。");
                            setIsLoading(false);
                        };
                        fileReader.readAsDataURL(file);
                    }
                } catch (error) {
                    console.error(error);
                    addLog(`エラー: ファイルの読み込みに失敗しました。`, 'error');
                    showMessage("エラー", "ファイルの読み込みに失敗しました。");
                    setIsLoading(false);
                }
            };

            const handlePagesPerSetChange = async (newVal) => {
                const val = parseInt(newVal, 10);
                if (val >= 1 && val <= 10) {
                    setPagesPerSet(val);
                    setRegions([]);
                    setActiveTemplateName(null);
                    if (pdfDoc) {
                        await loadSetImages(pdfDoc, 1, val);
                    }
                }
            };

            const handleAutoDetectRegions = async () => {
                if (setImages.length === 0) return;
                if (!apiKey) {
                    showMessage("APIキー未設定", "Gemini APIキーが設定されていません。画面右上の設定アイコンから入力してください。");
                    return;
                }
                setIsLoading(true);
                setLoadingText("AIがドキュメントを解析し、抽出領域を特定しています...");
                addLog("AIによる抽出領域の自動特定を開始します...", "info");
                setActiveTemplateName(null);

                try {
                    const newRegions = [];
                    for (let offset = 0; offset < setImages.length; offset++) {
                        addLog(`構成ページ ${offset + 1}/${setImages.length} を分析中...`);

                        const prompt = `あなたは高度なAI-OCRアシスタントです。提供された帳票・ドキュメントの画像から、システムで抽出・データ化すべき「入力値が記載される領域」を自動的に特定してください。
【重要: 傾き補正】スキャンされたPDFや画像の場合、傾きや歪みがある可能性があります。その場合は、画像の傾きを補正したと仮定して、実際の文字が書かれている領域を正確に囲んでください。
各領域について、その項目の論理的な名前（例：「請求日」「会社名」など）と、バウンディングボックス（0〜1000正規化座標: [ymin, xmin, ymax, xmax]）、項目の種類（type）をJSON形式で返してください。`;

                        const schema = {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                    name: { type: "STRING", description: "抽出項目の名称" },
                                    type: { type: "STRING", description: "項目の種類 ('text': 通常の文字, 'checkbox': チェックボックス, 'circle': 丸囲み選択)" },
                                    box: {
                                        type: "ARRAY",
                                        items: { type: "INTEGER" },
                                        description: "[ymin, xmin, ymax, xmax] Normalized 0-1000"
                                    }
                                },
                                required: ["name", "type", "box"]
                            }
                        };

                        const data = await callGeminiAPI(apiKey, modelName, prompt, setImages[offset], schema);

                        data.forEach((item, idx) => {
                            const [ymin, xmin, ymax, xmax] = item.box;
                            const validTypes = ['text', 'checkbox', 'circle'];
                            const itemType = validTypes.includes(item.type) ? item.type : 'text';

                            newRegions.push({
                                id: `region_${Date.now()}_${offset}_${idx}`,
                                name: item.name,
                                type: itemType,
                                x: xmin / 1000,
                                y: ymin / 1000,
                                w: (xmax - xmin) / 1000,
                                h: (ymax - ymin) / 1000,
                                pageOffset: offset
                            });
                        });
                    }

                    setRegions(newRegions);
                    addLog(`自動特定完了: 合計 ${newRegions.length} 件の領域を検出しました。`, "success");
                    showMessage("完了", `${newRegions.length}件の抽出領域を自動特定しました。必要に応じて微調整してください。`);
                } catch (error) {
                    console.error(error);
                    addLog(`エラー: 領域の自動特定に失敗しました。(${error.message})`, "error");
                    showMessage("エラー", `領域の自動特定に失敗しました。${error.message || '時間をおいて再試行してください。'}`);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleRunOCR = async () => {
                if ((!pdfDoc && setImages.length === 0) || regions.length === 0) {
                    showMessage("確認", "ドキュメントが読み込まれていないか、抽出領域が設定されていません。");
                    return;
                }
                if (!apiKey) {
                    showMessage("APIキー未設定", "Gemini APIキーが設定されていません。画面右上の設定アイコンから入力してください。");
                    return;
                }

                setIsLoading(true);
                setOcrResults(null);
                const results = [];
                let hasError = false;

                const numSets = Math.ceil(numPages / pagesPerSet);
                addLog(`全 ${numSets} レコード（セット）のOCR解析を開始します...`, "info");

                const schema = {
                    type: "ARRAY",
                    items: {
                        type: "OBJECT",
                        properties: {
                            name: { type: "STRING" },
                            value: { type: "STRING", description: "抽出されたテキスト。見つからない場合は'不明'" },
                            box: {
                                type: "ARRAY",
                                items: { type: "INTEGER" },
                                description: "実際に抽出した領域の[ymin, xmin, ymax, xmax] (0-1000)。見つからない場合は空配列"
                            }
                        },
                        required: ["name", "value"]
                    }
                };

                try {
                    for (let setIdx = 0; setIdx < numSets; setIdx++) {
                        const setRecordData = {};
                        let setHasError = false;

                        addLog(`[レコード ${setIdx + 1}/${numSets}] 処理を開始...`);

                        for (let offset = 0; offset < pagesPerSet; offset++) {
                            const pageNum = setIdx * pagesPerSet + offset + 1;
                            if (pdfDoc && pageNum > numPages) break;

                            const targetRegionsForPage = regions.filter(r => r.pageOffset === offset);
                            if (targetRegionsForPage.length === 0) continue;

                            const targetRegionsData = targetRegionsForPage.map(r => ({
                                name: r.name,
                                type: r.type || 'text',
                                box: [
                                    Math.round(r.y * 1000),
                                    Math.round(r.x * 1000),
                                    Math.round((r.y + r.h) * 1000),
                                    Math.round((r.x + r.w) * 1000)
                                ]
                            }));

                            setLoadingText(`レコード ${setIdx + 1}/${numSets} (構成ページ ${offset + 1}) を処理中...`);

                            // PDFか画像かで画像データの取得元を切り替え
                            let pageImgData;
                            if (pdfDoc) {
                                pageImgData = await renderPageToBase64(pdfDoc, pageNum);
                            } else {
                                pageImgData = setImages[offset]; // 画像の場合はすでにBase64がある
                            }

                            const prompt = `あなたは高度なAI-OCRアシスタントです。提供された画像から、以下のJSONで指定された各項目のテキストや状態を抽出してください。

【重要: レイアウト変更への追従と視覚化】
提供されたバウンディングボックス（0〜1000正規化座標: [ymin, xmin, ymax, xmax]）は「目安位置」です。
ページによってレイアウトが変わっている場合でも、指定された項目名（name）の意味を理解し、画像全体を探索して実際の値を見つけ出してください。

【重要: 入力形式（type）に基づく厳格な読み取り】
各項目には \`type\` （テキスト、チェックボックス、丸囲み）が指定されています。推測せず、必ず指定された \`type\` に従って判定してください。
1. type が "text" の場合: 書かれている内容をそのまま抽出してください。改行は維持してください。
2. type が "checkbox" の場合: 対象がチェック（✓、✔、×、塗りつぶし等）されている場合は "TRUE"、空欄の場合は "FALSE" と出力してください。
3. type が "circle" の場合: 対象が丸（〇）などで囲まれている場合は、囲まれているテキスト（例："1. 有"）を出力してください。

【重要: 出力形式の厳守】
1. 実際に抽出した正確な位置座標を \`box\` に返してください。
2. どうしても該当項目が見つからない場合や判定できない場合は、\`value\` を "不明" とし、\`box\` を空配列 \`[]\` にしてください。

抽出対象の領域情報:
${JSON.stringify(targetRegionsData)}`;

                            try {
                                const pageData = await callGeminiAPI(apiKey, modelName, prompt, pageImgData, schema);

                                pageData.forEach(item => {
                                    setRecordData[item.name] = {
                                        value: item.value,
                                        box: item.box && item.box.length === 4 ? item.box : null
                                    };
                                });
                            } catch (pageError) {
                                console.error(`Set ${setIdx+1} Page ${offset+1} error:`, pageError);
                                addLog(`[レコード ${setIdx + 1}] のページ抽出でエラー発生。`, "error");
                                setHasError = true;
                                hasError = true;
                            }

                            if (setIdx < numSets - 1 || offset < pagesPerSet - 1) {
                                await new Promise(res => setTimeout(res, 3500));
                            }
                        }

                        regions.forEach(r => {
                            if (!setRecordData[r.name]) {
                                setRecordData[r.name] = { value: setHasError ? '解析エラー' : '不明', box: null };
                            }
                        });

                        results.push({ setIndex: setIdx + 1, data: setRecordData });
                        addLog(`[レコード ${setIdx + 1}/${numSets}] 完了`, "success");

                    }

                    if (results.length > 0) {
                        setOcrResults(results);
                        if (pdfDoc) await loadSetImages(pdfDoc, 1, pagesPerSet);

                        if (hasError) {
                            addLog(`処理が完了しましたが、一部でエラーが発生しました。`, "warning");
                            showMessage("完了 (一部エラー)", "解析処理が終了しましたが、一部でエラーが発生しました。\n取得できた部分までの結果を表示します。");
                        } else {
                            addLog(`すべてのレコードのOCR処理が正常に完了しました！`, "success");
                            showMessage("完了", "すべてのレコードのOCR処理が完了しました。右パネルで結果を確認してください。");
                        }
                    } else {
                        throw new Error("すべての解析に失敗しました。");
                    }
                } catch (error) {
                    console.error(error);
                    addLog(`エラー: 処理中に致命的な問題が発生しました。(${error.message})`, "error");
                    showMessage("エラー", "OCR処理中に致命的なエラーが発生しました。");
                } finally {
                    setIsLoading(false);
                }
            };

            const getRelativeCoords = (e, pageOffset) => {
                const container = containerRefs.current[pageOffset];
                if (!container) return { x: 0, y: 0 };
                const rect = container.getBoundingClientRect();
                return {
                    x: Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)),
                    y: Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height))
                };
            };

            const onPointerDownContainer = (e, pageOffset) => {
                if (e.target !== containerRefs.current[pageOffset] && e.target.tagName !== 'IMG') return;
                const { x, y } = getRelativeCoords(e, pageOffset);
                const id = `region_${Date.now()}`;
                const newRegion = { id, name: "新規項目", type: "text", x, y, w: 0, h: 0, pageOffset };

                setRegions([...regions, newRegion]);
                setSelectedRegionId(id);
                setInteraction({ type: 'draw', id, pageOffset, startX: x, startY: y, initialRect: newRegion });
            };

            const onPointerDownRegion = (e, id, pageOffset) => {
                e.stopPropagation();
                setSelectedRegionId(id);
                const { x, y } = getRelativeCoords(e, pageOffset);
                const region = regions.find(r => r.id === id);
                setInteraction({ type: 'move', id, pageOffset, startX: x, startY: y, initialRect: { ...region } });
            };

            const onPointerDownResize = (e, id, pageOffset) => {
                e.stopPropagation();
                setSelectedRegionId(id);
                const { x, y } = getRelativeCoords(e, pageOffset);
                const region = regions.find(r => r.id === id);
                setInteraction({ type: 'resize', id, pageOffset, startX: x, startY: y, initialRect: { ...region } });
            };

            const onPointerMove = (e) => {
                if (interaction.type === 'idle') return;

                const { type, id, pageOffset, startX, startY, initialRect } = interaction;
                const { x, y } = getRelativeCoords(e, pageOffset);

                setRegions(prev => prev.map(r => {
                    if (r.id !== id) return r;

                    let newR = { ...r };
                    if (type === 'draw') {
                        newR.x = Math.min(startX, x);
                        newR.y = Math.min(startY, y);
                        newR.w = Math.abs(x - startX);
                        newR.h = Math.abs(y - startY);
                    } else if (type === 'move') {
                        const dx = x - startX;
                        const dy = y - startY;
                        newR.x = Math.max(0, Math.min(1 - newR.w, initialRect.x + dx));
                        newR.y = Math.max(0, Math.min(1 - newR.h, initialRect.y + dy));
                    } else if (type === 'resize') {
                        const dx = x - startX;
                        const dy = y - startY;
                        newR.w = Math.max(0.01, Math.min(1 - newR.x, initialRect.w + dx));
                        newR.h = Math.max(0.01, Math.min(1 - newR.y, initialRect.h + dy));
                    }
                    return newR;
                }));
            };

            const onPointerUp = () => {
                if (interaction.type === 'draw') {
                    const drawnRegion = regions.find(r => r.id === interaction.id);
                    if (drawnRegion && (drawnRegion.w < 0.02 || drawnRegion.h < 0.02)) {
                        setRegions(prev => prev.filter(r => r.id !== interaction.id));
                    }
                }
                setInteraction({ type: 'idle', id: null, pageOffset: 0 });
            };

            const deleteRegion = (id) => {
                setRegions(regions.filter(r => r.id !== id));
                if (selectedRegionId === id) setSelectedRegionId(null);
            };

            const updateRegionName = (id, newName) => {
                setRegions(regions.map(r => r.id === id ? { ...r, name: newName } : r));
            };

            const updateRegionType = (id, newType) => {
                setRegions(regions.map(r => r.id === id ? { ...r, type: newType } : r));
            };

            const duplicateRegionToPage = (id, targetPageOffset) => {
                const region = regions.find(r => r.id === id);
                if (!region) return;
                const newRegion = { ...region, id: `region_${Date.now()}_copy`, pageOffset: targetPageOffset };
                setRegions(prev => [...prev, newRegion]);
                setSelectedRegionId(newRegion.id);
                setCopyMenuRegionId(null);
                addLog(`「${region.name}」をP.${targetPageOffset + 1}に複製しました。`, 'success');
            };

            const handleSortDragStart = (e, index) => {
                dragItemRef.current = index;
                if (e.dataTransfer) e.dataTransfer.setData('text/plain', '');
                setTimeout(() => {
                    if (e.target && e.target.style) e.target.style.opacity = '0.4';
                }, 0);
            };

            const handleSortDragEnter = (e, index) => {
                e.preventDefault();
                dragOverItemRef.current = index;
                if (dragItemRef.current !== null && dragItemRef.current !== index) {
                    const newRegions = [...regions];
                    const draggedRegion = newRegions[dragItemRef.current];
                    newRegions.splice(dragItemRef.current, 1);
                    newRegions.splice(index, 0, draggedRegion);
                    setRegions(newRegions);
                    dragItemRef.current = index;
                }
            };

            const handleSortDragOver = (e) => {
                e.preventDefault();
            };

            const handleSortDragEnd = (e) => {
                dragItemRef.current = null;
                dragOverItemRef.current = null;
                if (e.target && e.target.style) e.target.style.opacity = '1';
            };

            const handleExportCSV = () => {
                if (!ocrResults) return;

                const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
                const headerRow = ["レコードNo.", ...regions.map(r => `"${r.name.replace(/"/g, '""')}"`)].join(",");

                let csvContent = headerRow + "\n";

                ocrResults.forEach(res => {
                    const row = [res.setIndex];
                    regions.forEach(r => {
                        const data = res.data[r.name];
                        const val = data ? data.value : "";
                        row.push(`"${String(val).replace(/"/g, '""')}"`);
                    });
                    csvContent += row.join(",") + "\n";
                });

                const blob = new Blob([bom, csvContent], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `ocr_records_${Date.now()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const updateOcrResult = (setIdx, key, newValue) => {
                const newResults = [...ocrResults];
                if (newResults[setIdx] && newResults[setIdx].data[key]) {
                    newResults[setIdx].data[key].value = newValue;
                    setOcrResults(newResults);
                }
            };

            const totalSets = Math.ceil(numPages / pagesPerSet);

            return (
                <div className="flex flex-col h-screen bg-[#05070c] text-slate-200 font-sans">
                    {/* Header */}
                    <header className="bg-slate-900/70 backdrop-blur-xl border-b border-white/10 px-6 py-4 flex items-center justify-between z-10">
                        <div className="flex items-center gap-3">
                            <div className="bg-gradient-to-br from-violet-500 to-blue-500 p-2.5 rounded-xl shadow-lg shadow-violet-500/30">
                                <Icon name="scan-line" className="text-white w-6 h-6" />
                            </div>
                            <div>
                                <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-violet-400 via-fuchsia-400 to-blue-400 leading-tight">
                                    AI-OCR文字起こしツール
                                </h1>
                                <p className="text-[10px] font-medium text-slate-500 uppercase tracking-widest">Region-based Extraction Edition</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            <div className="hidden md:flex items-center gap-1.5 bg-white/5 border border-white/10 rounded-full px-3 py-1.5 text-xs font-medium text-slate-400" title="使用中のAIモデル">
                                <Icon name="cpu" className="w-3.5 h-3.5 text-violet-400" />
                                {modelName}
                            </div>
                            <button
                                onClick={() => setShowLabels(!showLabels)}
                                className={`p-2 rounded-full transition-all duration-200 ${showLabels ? 'bg-violet-500/20 text-violet-300 ring-1 ring-violet-400/40' : 'bg-white/5 text-slate-500 hover:bg-white/10'}`}
                                title="ラベル表示ON/OFF"
                            >
                                <Icon name={showLabels ? "eye" : "eye-off"} className="w-5 h-5" />
                            </button>
                            <button
                                onClick={openSettings}
                                className="relative p-2 text-slate-400 hover:bg-white/10 hover:text-white rounded-full transition-all duration-200"
                                title="API設定"
                            >
                                <Icon name="settings" className="w-5 h-5" />
                                {!apiKey && (
                                    <span className="absolute top-1 right-1 w-2 h-2 bg-rose-500 rounded-full border border-slate-900"></span>
                                )}
                            </button>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <div className="flex flex-1 overflow-hidden" onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerLeave={onPointerUp}>

                        {/* Left: Document Viewer */}
                        <div className="flex-1 relative flex flex-col workspace-bg">
                            <div className="flex-1 overflow-auto p-8 flex flex-col items-center justify-start gap-8">
                                {!setImages.length ? (
                                    <div className="m-auto flex flex-col items-center justify-center text-slate-600">
                                        <div className="w-24 h-24 mb-6 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center">
                                            <Icon name="file-text" className="w-10 h-10 opacity-40" />
                                        </div>
                                        <p className="font-medium text-base text-slate-500">PDFや画像ファイルをアップロードするとここに表示されます</p>
                                    </div>
                                ) : (
                                    setImages.map((img, pageOffset) => (
                                        <div key={`page_${pageOffset}`} className="relative">
                                            <div className="absolute -left-12 top-0 bg-gradient-to-r from-violet-600 to-blue-600 text-white text-xs font-bold py-1 px-3 rounded-full shadow-lg shadow-violet-900/40 z-10">
                                                P.{pageOffset + 1}
                                            </div>

                                            <div
                                                ref={el => containerRefs.current[pageOffset] = el}
                                                className="canvas-container bg-white"
                                                onPointerDown={(e) => onPointerDownContainer(e, pageOffset)}
                                            >
                                                <img src={img} alt={`Document Page ${pageOffset + 1}`} className="block max-w-[800px] w-full h-auto pointer-events-none" draggable="false" />

                                                {/* ステップ1: 領域設定モード */}
                                                {!ocrResults && regions.filter(r => r.pageOffset === pageOffset).map(region => (
                                                    <div
                                                        key={region.id}
                                                        className={`region-box ${selectedRegionId === region.id ? 'selected' : ''}`}
                                                        style={{
                                                            left: `${region.x * 100}%`,
                                                            top: `${region.y * 100}%`,
                                                            width: `${region.w * 100}%`,
                                                            height: `${region.h * 100}%`
                                                        }}
                                                        onPointerDown={(e) => onPointerDownRegion(e, region.id, pageOffset)}
                                                    >
                                                        {showLabels && (
                                                            <div className="region-label shadow-sm flex items-center gap-1 transition-opacity">
                                                                {region.type === 'checkbox' && <Icon name="check-square" className="w-3 h-3" />}
                                                                {region.type === 'circle' && <Icon name="circle" className="w-3 h-3" />}
                                                                {region.name}
                                                            </div>
                                                        )}
                                                        {selectedRegionId === region.id && (
                                                            <div
                                                                className="resize-handle"
                                                                onPointerDown={(e) => onPointerDownResize(e, region.id, pageOffset)}
                                                            ></div>
                                                        )}
                                                    </div>
                                                ))}

                                                {/* ステップ3: 結果確認モード */}
                                                {ocrResults && regions.filter(r => r.pageOffset === pageOffset).map(region => {
                                                    const currentSetResult = ocrResults.find(res => res.setIndex === currentSet);
                                                    const data = currentSetResult ? currentSetResult.data[region.name] : null;

                                                    if (!data || !data.box) return null;

                                                    const [ymin, xmin, ymax, xmax] = data.box;
                                                    const isFocused = focusedRegionName === region.name;
                                                    const borderColor = isFocused ? 'border-pink-500' : 'border-green-500';
                                                    const bgColor = isFocused ? 'bg-pink-500' : 'bg-green-500';
                                                    const bgOpacity = isFocused ? 'bg-opacity-30' : 'bg-opacity-10';
                                                    const zIndex = isFocused ? 'z-20 shadow-[0_0_15px_rgba(236,72,153,0.5)]' : 'z-10';

                                                    return (
                                                        <div
                                                            key={`res_${region.id}`}
                                                            className={`absolute border-2 ${borderColor} ${bgColor} ${bgOpacity} pointer-events-none ${zIndex} transition-all duration-300`}
                                                            style={{
                                                                left: `${(xmin / 1000) * 100}%`,
                                                                top: `${(ymin / 1000) * 100}%`,
                                                                width: `${((xmax - xmin) / 1000) * 100}%`,
                                                                height: `${((ymax - ymin) / 1000) * 100}%`
                                                            }}
                                                        >
                                                            {showLabels && (
                                                                <div className={`absolute -top-6 -left-[2px] ${bgColor} text-white px-2 py-0.5 text-[11px] font-medium rounded-sm shadow-sm whitespace-nowrap transition-all duration-300`}>
                                                                    {region.name}
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>

                            {/* Loading Overlay */}
                            {isLoading && (
                                <div className="absolute inset-0 bg-slate-950/70 backdrop-blur-md flex flex-col items-center justify-center z-40">
                                    <Icon name="loader-2" className="w-12 h-12 text-violet-400 animate-spin mb-4" />
                                    <div className="bg-slate-900/90 px-6 py-3 rounded-xl shadow-2xl border border-white/10 flex items-center gap-3">
                                        <div className="w-2 h-2 bg-violet-400 rounded-full animate-pulse"></div>
                                        <p className="text-md font-bold text-white">{loadingText}</p>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Right: Sidebar Panel */}
                        <div className="w-[450px] bg-slate-900/60 backdrop-blur-xl border-l border-white/10 flex flex-col z-10">

                            {/* グローバルコントロールパネル */}
                            <div className="p-4 border-b border-white/10 flex flex-col gap-3 flex-shrink-0 z-20">
                                <label className="cursor-pointer bg-gradient-to-r from-violet-600 to-blue-600 hover:from-violet-500 hover:to-blue-500 text-white px-4 py-3 rounded-xl flex items-center justify-center gap-2 transition-all duration-200 text-sm font-bold shadow-lg shadow-violet-900/30 hover:-translate-y-0.5">
                                    <Icon name="file-plus-2" className="w-5 h-5" />
                                    ファイル (PDF / 画像) を読み込む
                                    <input type="file" accept="application/pdf, image/png, image/jpeg, image/jpg, image/webp" className="hidden" onChange={handleFileUpload} />
                                </label>
                                {setImages.length > 0 && pdfDoc && (
                                    <div className="flex items-center justify-between bg-white/5 rounded-lg p-2 border border-white/10">
                                        <span className="text-xs font-bold text-slate-400 pl-1">1レコード構成:</span>
                                        <div className="flex items-center gap-1">
                                            <input
                                                type="number" min="1" max="10"
                                                value={pagesPerSet}
                                                onChange={(e) => handlePagesPerSetChange(e.target.value)}
                                                disabled={ocrResults !== null}
                                                className="w-12 h-7 pl-2 py-1 border border-white/10 rounded text-sm font-bold text-violet-300 focus:ring-1 focus:ring-violet-400 bg-white/5 outline-none"
                                            />
                                            <span className="text-xs font-medium text-slate-500 pr-1">ページ</span>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {!ocrResults ? (
                                <>
                                    {/* テンプレート読み込みセクション */}
                                    <div className="p-4 border-b border-white/10 bg-violet-500/[0.06] flex flex-col gap-2">
                                        <h2 className="text-xs font-bold text-violet-300 flex items-center gap-1">
                                            <Icon name="database" className="w-4 h-4" /> テンプレート読込
                                        </h2>
                                        <div className="flex gap-2">
                                            <select
                                                value={selectedTemplateIndex}
                                                onChange={(e) => setSelectedTemplateIndex(e.target.value)}
                                                className="flex-1 text-sm border border-white/10 rounded-lg px-2 py-1.5 focus:border-violet-400 focus:ring-1 focus:ring-violet-400 outline-none bg-slate-800 text-slate-200"
                                            >
                                                <option value="">-- 保存済み設定を選択 --</option>
                                                {templates.map((tpl, idx) => (
                                                    <option key={idx} value={idx}>{tpl.name} ({tpl.regions.length}項目)</option>
                                                ))}
                                            </select>
                                            <button
                                                onClick={handleApplyTemplate}
                                                disabled={selectedTemplateIndex === "" || setImages.length === 0}
                                                className="bg-violet-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-violet-500 disabled:opacity-40 transition-all duration-200 shadow-sm"
                                            >
                                                適用
                                            </button>
                                        </div>
                                    </div>

                                    {/* AI自動特定セクション */}
                                    <div className="p-4 border-b border-white/10 flex justify-between items-center">
                                        <h2 className="text-sm font-bold text-slate-400 uppercase tracking-wider">抽出領域の設定</h2>
                                        <button
                                            onClick={handleAutoDetectRegions}
                                            disabled={setImages.length === 0 || isLoading}
                                            className="text-xs bg-white/5 border border-violet-400/30 text-violet-300 px-2.5 py-1.5 rounded-lg hover:bg-violet-500/15 flex items-center gap-1 font-bold transition-all duration-200"
                                        >
                                            <Icon name="sparkles" className="w-3 h-3" />
                                            AI自動特定
                                        </button>
                                    </div>

                                    {/* 領域リスト */}
                                    <div className="flex-1 overflow-y-auto p-4">
                                        {regions.length === 0 ? (
                                            <div className="text-center text-slate-500 py-8 text-sm">
                                                プレビューをドラッグして領域を作成するか、<br/>テンプレート・自動特定を利用してください。
                                            </div>
                                        ) : (
                                            <div className="space-y-2">
                                                {regions.map((region, index) => (
                                                    <div
                                                        key={region.id}
                                                        draggable
                                                        onDragStart={(e) => handleSortDragStart(e, index)}
                                                        onDragEnter={(e) => handleSortDragEnter(e, index)}
                                                        onDragOver={handleSortDragOver}
                                                        onDragEnd={handleSortDragEnd}
                                                        className={`flex items-start p-2.5 border rounded-xl transition-all duration-150 ${selectedRegionId === region.id ? 'bg-violet-500/10 border-violet-400/50 ring-1 ring-violet-400/40 shadow-lg z-10 relative' : 'bg-white/[0.03] border-white/10 hover:border-white/20 hover:bg-white/[0.06]'}`}
                                                        onClick={() => setSelectedRegionId(region.id)}
                                                    >
                                                        {/* ドラッグハンドル */}
                                                        <div className="flex items-center justify-center mr-2 cursor-grab active:cursor-grabbing text-slate-600 hover:text-violet-400 mt-2">
                                                            <Icon name="grip-vertical" className="w-5 h-5" />
                                                        </div>
                                                        {/* 項目名と種類 */}
                                                        <div className="flex flex-col flex-1 gap-1.5 mt-0.5">
                                                            <div className="flex items-center gap-2">
                                                                <span className="text-[9px] font-bold text-slate-500 bg-white/5 px-1 rounded pointer-events-none">P.{region.pageOffset + 1}</span>
                                                                <input
                                                                    type="text" value={region.name} onChange={(e) => updateRegionName(region.id, e.target.value)}
                                                                    onDragStart={(e) => { e.preventDefault(); e.stopPropagation(); }}
                                                                    className="w-full bg-transparent border-none outline-none text-sm font-bold text-white placeholder-slate-600" placeholder="項目名"
                                                                />
                                                            </div>
                                                            <select
                                                                value={region.type || 'text'} onChange={(e) => updateRegionType(region.id, e.target.value)}
                                                                className="text-[11px] font-medium text-slate-300 bg-white/5 border border-white/10 rounded px-1.5 py-1 outline-none focus:border-violet-400 w-fit cursor-pointer"
                                                            >
                                                                <option value="text">📄 テキスト</option>
                                                                <option value="checkbox">☑️ チェックボックス</option>
                                                                <option value="circle">⭕ 丸囲み</option>
                                                            </select>
                                                        </div>
                                                        {setImages.length > 1 && (
                                                            <div className="relative">
                                                                <button
                                                                    onClick={(e) => { e.stopPropagation(); setCopyMenuRegionId(copyMenuRegionId === region.id ? null : region.id); }}
                                                                    className="text-slate-600 hover:text-violet-400 p-1 rounded transition ml-1"
                                                                    title="他ページに複製"
                                                                >
                                                                    <Icon name="copy" className="w-4 h-4" />
                                                                </button>
                                                                {copyMenuRegionId === region.id && (
                                                                    <div
                                                                        onClick={(e) => e.stopPropagation()}
                                                                        className="absolute right-0 top-7 z-30 bg-slate-800 border border-white/10 rounded-lg shadow-xl p-1.5 flex flex-col gap-0.5 min-w-[110px]"
                                                                    >
                                                                        <span className="text-[10px] font-bold text-slate-500 px-1.5 pt-0.5 pb-1">複製先ページ</span>
                                                                        {setImages.map((_, pageIdx) => pageIdx !== region.pageOffset && (
                                                                            <button
                                                                                key={pageIdx}
                                                                                onClick={() => duplicateRegionToPage(region.id, pageIdx)}
                                                                                className="text-xs text-left text-slate-200 hover:bg-violet-500/20 rounded px-2 py-1 transition-colors"
                                                                            >
                                                                                P.{pageIdx + 1}へ
                                                                            </button>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )}
                                                        <button onClick={(e) => { e.stopPropagation(); deleteRegion(region.id); }} className="text-slate-600 hover:text-rose-400 p-1 rounded transition ml-1"><Icon name="x" className="w-4 h-4" /></button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    {/* テンプレート保存ボタン */}
                                    {regions.length > 0 && (
                                        <div className="p-3 border-t border-b border-white/10 flex justify-end">
                                            <button
                                                onClick={() => setShowSaveTemplateModal(true)}
                                                className="text-xs font-bold text-violet-300 bg-violet-500/10 border border-violet-400/30 px-3 py-1.5 rounded-lg hover:bg-violet-500/20 transition-all duration-200 flex items-center gap-1"
                                            >
                                                <Icon name="save" className="w-3 h-3" />
                                                現在の設定を保存
                                            </button>
                                        </div>
                                    )}

                                    {/* 実行ボタン */}
                                    <div className="p-4 flex-shrink-0">
                                        <button
                                            onClick={handleRunOCR} disabled={regions.length === 0 || isLoading}
                                            className="w-full bg-gradient-to-r from-violet-600 to-blue-600 hover:from-violet-500 hover:to-blue-500 text-white px-4 py-3.5 rounded-xl disabled:from-slate-700 disabled:to-slate-700 disabled:text-slate-500 flex items-center justify-center gap-2 transition-all duration-200 font-bold shadow-lg shadow-violet-900/30 text-base hover:-translate-y-0.5"
                                        >
                                            <Icon name="play-circle" className="w-5 h-5" />
                                            解析実行
                                        </button>
                                    </div>
                                </>
                            ) : (
                                <>
                                    {/* 結果確認ヘッダー */}
                                    <div className="p-4 border-b border-white/10 bg-emerald-500/[0.06] flex justify-between items-center flex-shrink-0">
                                        <h2 className="text-sm font-bold text-emerald-300 flex items-center gap-2">
                                            <Icon name="check-square" className="w-4 h-4" />
                                            OCR抽出結果
                                        </h2>
                                        <button
                                            onClick={() => { setOcrResults(null); if(pdfDoc) loadSetImages(pdfDoc, 1, pagesPerSet); }}
                                            className="text-xs text-slate-300 hover:text-white font-bold bg-white/5 px-2.5 py-1.5 rounded-lg border border-white/10 hover:bg-white/10 transition-all duration-200"
                                        >
                                            再設定に戻る
                                        </button>
                                    </div>

                                    {/* セット切り替え */}
                                    {pdfDoc && totalSets > 1 && (
                                        <div className="border-b border-white/10 px-4 py-2 flex items-center justify-between flex-shrink-0">
                                            <button disabled={currentSet === 1 || isLoading} onClick={() => loadSetImages(pdfDoc, currentSet - 1, pagesPerSet)} className="p-1.5 rounded-lg border border-white/10 bg-white/5 hover:bg-white/10 disabled:opacity-30 text-slate-300"><Icon name="chevron-left" className="w-5 h-5" /></button>
                                            <span className="text-sm font-bold text-white">レコード {currentSet} <span className="text-slate-500">/ {totalSets}</span></span>
                                            <button disabled={currentSet === totalSets || isLoading} onClick={() => loadSetImages(pdfDoc, currentSet + 1, pagesPerSet)} className="p-1.5 rounded-lg border border-white/10 bg-white/5 hover:bg-white/10 disabled:opacity-30 text-slate-300"><Icon name="chevron-right" className="w-5 h-5" /></button>
                                        </div>
                                    )}

                                    {/* 抽出値リスト */}
                                    <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                        {regions.map(r => {
                                            const currentSetResult = ocrResults.find(res => res.setIndex === currentSet);
                                            const data = currentSetResult ? currentSetResult.data[r.name] : null;
                                            const value = data ? data.value : '';
                                            const isUnknown = value === '不明' || value === '解析エラー';
                                            const isLargeText = value.includes('\n') || value.length > 40;
                                            const isFocused = focusedRegionName === r.name;

                                            return (
                                                <div key={r.id} className={`bg-white/[0.03] p-3 rounded-xl border relative overflow-hidden transition-colors ${isUnknown ? 'opacity-60 border-white/10' : isFocused ? 'border-pink-400/50 ring-1 ring-pink-400/30' : 'border-white/10'}`}>
                                                    <div className={`absolute left-0 top-0 bottom-0 w-1 ${isUnknown ? 'bg-slate-600' : isFocused ? 'bg-pink-400' : 'bg-violet-400'}`}></div>
                                                    <label className="flex items-center gap-1.5 text-[11px] font-bold text-slate-500 mb-1 ml-2">
                                                        <span className="text-[9px] bg-white/5 px-1 rounded">P.{r.pageOffset + 1}</span>
                                                        {r.name}
                                                    </label>
                                                    {isLargeText ? (
                                                        <textarea
                                                            value={value} onChange={(e) => updateOcrResult(currentSet - 1, r.name, e.target.value)}
                                                            onFocus={() => setFocusedRegionName(r.name)} onBlur={() => setFocusedRegionName(null)}
                                                            className={`w-full p-2 ml-1 text-sm bg-transparent border-b border-white/10 outline-none resize-y ${isUnknown ? 'text-slate-500' : 'text-white focus:border-pink-400 font-medium'}`}
                                                            rows={Math.max(2, value.split('\n').length)}
                                                        />
                                                    ) : (
                                                        <input
                                                            type="text" value={value} onChange={(e) => updateOcrResult(currentSet - 1, r.name, e.target.value)}
                                                            onFocus={() => setFocusedRegionName(r.name)} onBlur={() => setFocusedRegionName(null)}
                                                            className={`w-full p-2 ml-1 text-sm bg-transparent border-b border-white/10 outline-none ${isUnknown ? 'text-slate-500' : 'text-white focus:border-pink-400 font-medium'}`}
                                                        />
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {/* CSV出力ボタン */}
                                    <div className="p-4 flex-shrink-0">
                                        <button onClick={handleExportCSV} className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white px-4 py-3.5 rounded-xl flex items-center justify-center gap-2 font-bold shadow-lg shadow-emerald-900/30 text-base transition-all duration-200 hover:-translate-y-0.5">
                                            <Icon name="download" className="w-5 h-5" /> 全レコードをCSV出力
                                        </button>
                                    </div>
                                </>
                            )}

                            {/* Console Region */}
                            <div className="h-48 bg-black/40 border-t border-white/10 flex flex-col flex-shrink-0">
                                <div className="px-4 py-1.5 bg-white/5 flex justify-between items-center">
                                    <span className="text-[10px] font-bold text-slate-400 flex items-center gap-1.5"><Icon name="terminal" className="w-3 h-3 text-emerald-400" /> System Console</span>
                                    <button onClick={() => setLogs([])} className="text-slate-600 hover:text-slate-300 text-[10px]">Clear</button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-2 font-mono text-[10px] leading-relaxed flex flex-col gap-1" ref={(el) => { if(el) el.scrollTop = el.scrollHeight; }}>
                                    {logs.map((log, idx) => (
                                        <div key={idx} className={`${log.type === 'error' ? 'text-red-400' : log.type === 'warning' ? 'text-yellow-400' : log.type === 'success' ? 'text-emerald-400' : 'text-slate-400'} break-all`}>
                                            <span className="text-slate-600 mr-1.5">[{log.time}]</span>{log.msg}
                                        </div>
                                    ))}
                                    {logs.length === 0 && <div className="text-slate-700 italic">Waiting for execution...</div>}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Modals */}
                    <Modal isOpen={modal.isOpen} title={modal.title} message={modal.message} onClose={() => setModal({ ...modal, isOpen: false })} />

                    {/* Settings Modal */}
                    {showGasSettings && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center z-[100]">
                            <div className="bg-slate-900 border border-white/10 rounded-2xl p-8 max-w-lg w-full shadow-2xl">
                                <div className="flex items-center gap-3 mb-2">
                                    <div className="bg-gradient-to-br from-violet-500 to-blue-500 p-2.5 rounded-xl shadow-lg shadow-violet-900/30"><Icon name="settings" className="text-white w-6 h-6" /></div>
                                    <h3 className="text-xl font-bold text-white">API設定</h3>
                                </div>

                                <p className="text-sm text-slate-400 mt-4 mb-2 leading-relaxed">
                                    OCR解析にはGoogleの <span className="font-bold text-slate-200">Gemini APIキー</span> が必要です。<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer" className="text-violet-400 hover:text-violet-300 underline">Google AI Studio</a> で無料発行できます。このキーはブラウザ内（localStorage）にのみ保存され、外部送信はGoogleへの直接通信のみです。
                                </p>
                                <div className="relative mb-6">
                                    <input
                                        type={showApiKey ? "text" : "password"} value={apiKeyInput} onChange={e => setApiKeyInput(e.target.value)}
                                        placeholder="AIzaSy..."
                                        className="w-full bg-white/5 border border-white/10 text-white placeholder-slate-600 p-3 rounded-xl outline-none focus:border-violet-400 focus:ring-2 focus:ring-violet-400/30 font-mono text-sm pr-10"
                                    />
                                    <button
                                        type="button"
                                        onClick={() => setShowApiKey(!showApiKey)}
                                        className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 p-1"
                                    >
                                        <Icon name={showApiKey ? "eye-off" : "eye"} className="w-4 h-4" />
                                    </button>
                                </div>

                                <p className="text-sm text-slate-400 mb-2 leading-relaxed">
                                    OCR解析に使用する<span className="font-bold text-slate-200">AIモデル</span>を選択してください。帳票が複雑な場合はProモデルへの切り替えを推奨します。
                                </p>
                                <select
                                    value={GEMINI_MODEL_PRESETS.some(m => m.value === modelNameInput) ? modelNameInput : '__custom__'}
                                    onChange={(e) => { if (e.target.value !== '__custom__') setModelNameInput(e.target.value); }}
