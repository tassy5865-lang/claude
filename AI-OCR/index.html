<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-OCR文字起こしツール</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- SheetJS (Excel読み書き) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- PapaParse (CSV解析) -->
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background-color: #05070c; margin: 0; }
        .workspace-bg {
            background-color: #05070c;
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.07) 1px, transparent 0);
            background-size: 28px 28px;
        }
        .canvas-container { position: relative; display: inline-block; user-select: none; margin-bottom: 24px; border-radius: 14px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08); }
        .region-box { position: absolute; border: 2px solid #8b5cf6; background-color: rgba(139, 92, 246, 0.18); cursor: move; border-radius: 3px; box-shadow: 0 0 0 1px rgba(139,92,246,0.25); }
        .region-box.selected { border-color: #f43f5e; background-color: rgba(244, 63, 94, 0.18); z-index: 10; box-shadow: 0 0 0 1px rgba(244,63,94,0.4), 0 0 18px rgba(244,63,94,0.35); }
        .resize-handle { position: absolute; width: 11px; height: 11px; background-color: #fff; border: 2px solid #8b5cf6; border-radius: 3px; right: -6px; bottom: -6px; cursor: se-resize; }
        .selected .resize-handle { border-color: #f43f5e; }
        .region-label { position: absolute; top: -24px; left: -2px; background: #8b5cf6; color: white; padding: 2px 7px; font-size: 11px; font-weight: 600; border-radius: 5px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
        .selected .region-label { background: #f43f5e; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f4759; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #565f75; }

        .cell-input {
            background: transparent; width: 100%; color: #e2e8f0; font-size: 13px;
            padding: 6px 8px; border: 1px solid transparent; border-radius: 6px;
        }
        .cell-input:focus { outline: none; background: rgba(139,92,246,0.12); border-color: rgba(139,92,246,0.5); }
        .cell-input.empty { background: rgba(244,63,94,0.08); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        /** @jsx React.createElement */
        /** @jsxFrag React.Fragment */

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const { useState, useEffect, useRef, useCallback } = React;

        const GEMINI_MODEL_PRESETS = [
            { value: 'gemini-flash-latest', label: 'Gemini Flash（標準・推奨）' },
            { value: 'gemini-flash-lite-latest', label: 'Gemini Flash-Lite（高速・低コスト）' },
            { value: 'gemini-pro-latest', label: 'Gemini Pro（高精度・複雑な帳票向け）' },
        ];

        const callGeminiAPI = async (apiKey, modelName, prompt, imageBase64s, schema, maxRetries = 5) => {
            if (!apiKey) {
                throw new Error("Gemini APIキーが設定されていません。画面右上の設定アイコンから入力してください。");
            }
            const model = modelName || 'gemini-flash-latest';
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            const delays = [1000, 2000, 4000, 8000, 16000];

            const images = Array.isArray(imageBase64s) ? imageBase64s : [imageBase64s];
            const imageParts = images.map(img => ({ inlineData: { mimeType: "image/png", data: img.split(',')[1] } }));

            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [
                            { text: prompt },
                            ...imageParts
                        ]
                    }
                ],
                generationConfig: {
                    temperature: 0.1,
                    responseMimeType: "application/json",
                    responseSchema: schema
                }
            };

            for (let i = 0; i <= maxRetries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if (response.status === 400 || response.status === 403) {
                            const errBody = await response.text();
                            throw new Error(`APIキーが無効か、権限がありません。設定を確認してください。(${response.status})`);
                        }
                        throw new Error(`API Error: ${response.status}`);
                    }

                    const data = await response.json();
                    if (!data.candidates || data.candidates.length === 0) throw new Error("No candidates returned.");

                    const text = data.candidates[0].content.parts[0].text;
                    return JSON.parse(text);
                } catch (error) {
                    if (i === maxRetries) throw error;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        };

        const callGasAPI = async (gasUrl, action, payload = null) => {
            if (!gasUrl) throw new Error("GAS URL is not defined");

            try {
                if (action === 'getTemplates') {
                    const res = await fetch(gasUrl);
                    if (!res.ok) throw new Error(`GAS GET Error: ${res.status}`);
                    return await res.json();
                } else if (action === 'saveTemplate') {
                    const res = await fetch(gasUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action: 'saveTemplate', ...payload })
                    });
                    if (!res.ok) throw new Error(`GAS POST Error: ${res.status}`);
                    return await res.json();
                }
            } catch (e) {
                console.error("GAS API Error:", e);
                throw e;
            }
        };

        // ---- Excel振り分け(旧RPAツール)関連のヘルパー ----

        const callGeminiTextAPI = async (apiKey, modelName, prompt, schema, maxRetries = 5) => {
            if (!apiKey) {
                throw new Error("Gemini APIキーが設定されていません。画面右上の設定アイコンから入力してください。");
            }
            const model = modelName || 'gemini-flash-latest';
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            const delays = [1000, 2000, 4000, 8000, 16000];

            const payload = {
                contents: [{ role: "user", parts: [{ text: prompt }] }],
                generationConfig: {
                    temperature: 0.1,
                    responseMimeType: "application/json",
                    responseSchema: schema
                }
            };

            for (let i = 0; i <= maxRetries; i++) {
                let retryable = true;
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errBody = await response.text();
                        let detail = errBody;
                        try { detail = JSON.parse(errBody).error?.message || errBody; } catch (e) {}

                        if (response.status === 403) {
                            retryable = false;
                            throw new Error(`APIキーに権限がありません。(403) ${detail}`);
                        }
                        if (response.status === 400) {
                            retryable = false;
                            throw new Error(`リクエストが不正です。(400) ${detail}`);
                        }
                        if (response.status === 429 || response.status >= 500) {
                            throw new Error(`API混雑中: ${response.status} ${detail}`);
                        }
                        retryable = false;
                        throw new Error(`API Error: ${response.status} ${detail}`);
                    }

                    const data = await response.json();
                    if (!data.candidates || data.candidates.length === 0) throw new Error("No candidates returned.");
                    const text = data.candidates[0].content.parts[0].text;
                    return JSON.parse(text);
                } catch (error) {
                    if (i === maxRetries || !retryable) throw error;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        };

        const LEDGERS_KEY = 'rpa_ledgers';
        const ACTIVE_LEDGER_KEY = 'rpa_active_ledger';
        const ledgerDataKey = (id) => `rpa_ledger_data_${id}`;

        const loadLedgersList = () => {
            try {
                const raw = localStorage.getItem(LEDGERS_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) { return []; }
        };
        const saveLedgersList = (list) => {
            try { localStorage.setItem(LEDGERS_KEY, JSON.stringify(list)); } catch (e) { console.error(e); }
        };
        const loadLedgerData = (id) => {
            try {
                const raw = localStorage.getItem(ledgerDataKey(id));
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        };

        const MAPPING_TEMPLATES_KEY = 'rpa_mapping_templates';
        const loadMappingTemplates = () => {
            try {
                const raw = localStorage.getItem(MAPPING_TEMPLATES_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) { return []; }
        };
        const saveMappingTemplates = (list) => {
            try { localStorage.setItem(MAPPING_TEMPLATES_KEY, JSON.stringify(list)); } catch (e) { console.error(e); }
        };

        const LedgerRow = ({ ledger, isActive, onSwitch, onRename, onDelete }) => {
            const [editing, setEditing] = useState(false);
            const [nameInput, setNameInput] = useState(ledger.name);

            return (
                <div className={`flex items-center gap-2 p-2 rounded-xl border ${isActive ? 'border-violet-500/50 bg-violet-500/10' : 'border-white/10 bg-white/5'}`}>
                    {editing ? (
                        <React.Fragment>
                            <input
                                className="flex-1 bg-slate-800 border border-white/10 rounded-lg px-2 py-1 text-sm text-white"
                                value={nameInput}
                                onChange={(e) => setNameInput(e.target.value)}
                                autoFocus
                            />
                            <button onClick={() => { onRename(nameInput); setEditing(false); }} className="text-emerald-400 hover:text-emerald-300 p-1" title="保存">
                                <Icon name="check" className="w-4 h-4" />
                            </button>
                            <button onClick={() => { setNameInput(ledger.name); setEditing(false); }} className="text-slate-500 hover:text-white p-1" title="キャンセル">
                                <Icon name="x" className="w-4 h-4" />
                            </button>
                        </React.Fragment>
                    ) : (
                        <React.Fragment>
                            <button onClick={onSwitch} className="flex-1 text-left text-sm text-slate-200 truncate flex items-center gap-2">
                                {isActive && <Icon name="check-circle-2" className="w-4 h-4 text-violet-400 shrink-0" />}
                                <span className="truncate">{ledger.name}</span>
                            </button>
                            <button onClick={() => setEditing(true)} className="text-slate-500 hover:text-white p-1 shrink-0" title="名前変更">
                                <Icon name="pencil" className="w-4 h-4" />
                            </button>
                            <button onClick={() => { if (confirm(`台帳「${ledger.name}」を削除しますか？（保存されているデータも削除されます）`)) onDelete(); }} className="text-slate-500 hover:text-rose-400 p-1 shrink-0" title="削除">
                                <Icon name="trash-2" className="w-4 h-4" />
                            </button>
                        </React.Fragment>
                    )}
                </div>
            );
        };

        const TemplateRow = ({ template, ledgerExists, ledgerHeaders, expanded, onToggleExpand, onDelete, onFieldChange }) => {
            const colKeys = ledgerHeaders.map((_, i) => `col${i + 1}`);
            const savedDate = new Date(template.savedAt).toLocaleString('ja-JP');
            return (
                <div className="border border-white/10 bg-white/5 rounded-xl overflow-hidden">
                    <div className="flex items-center gap-2 p-3">
                        <button onClick={onToggleExpand} className="text-slate-500 hover:text-white p-1 shrink-0" title={expanded ? '閉じる' : '詳細を表示'}>
                            <Icon name={expanded ? 'chevron-down' : 'chevron-right'} className="w-4 h-4" />
                        </button>
                        <div className="flex-1 min-w-0">
                            <p className="text-sm font-bold text-slate-200 truncate">
                                {template.ledgerName || '(不明な台帳)'}
                                {!ledgerExists && <span className="ml-2 text-[11px] font-normal text-rose-400">台帳削除済み</span>}
                            </p>
                            <p className="text-[11px] text-slate-500 truncate">CSV列: {template.csvHeaders.join('、')}</p>
                            <p className="text-[10px] text-slate-600 mt-0.5">保存日時: {savedDate}</p>
                        </div>
                        <button onClick={onDelete} className="text-slate-500 hover:text-rose-400 p-1 shrink-0" title="このマッピングを削除">
                            <Icon name="trash-2" className="w-4 h-4" />
                        </button>
                    </div>
                    {expanded && (
                        <div className="px-3 pb-3 pt-1 border-t border-white/10 bg-black/20">
                            {!ledgerExists ? (
                                <div className="text-xs text-slate-500 space-y-1 pt-2">
                                    <p>対象の台帳が削除されているため、列名を表示・編集できません。以下はCSV列とExcel列キーの対応（生データ）です。</p>
                                    {template.csvHeaders.map((h, i) => (
                                        <p key={i}>{h} → {template.fieldMapping[`field${i + 1}`] || '(対応なし)'}</p>
                                    ))}
                                </div>
                            ) : (
                                <div className="space-y-1.5 pt-2">
                                    {template.csvHeaders.map((h, i) => {
                                        const fieldKey = `field${i + 1}`;
                                        const current = template.fieldMapping[fieldKey] || '';
                                        return (
                                            <div key={i} className="flex items-center gap-2 text-xs">
                                                <span className="w-1/3 truncate text-slate-400" title={h}>{h}</span>
                                                <Icon name="arrow-right" className="w-3 h-3 text-slate-600 shrink-0" />
                                                <select
                                                    value={current}
                                                    onChange={(e) => onFieldChange(fieldKey, e.target.value)}
                                                    className="flex-1 bg-slate-800 border border-white/10 rounded-lg px-2 py-1 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500"
                                                >
                                                    <option value="">(対応なし)</option>
                                                    {ledgerHeaders.map((eh, ci) => (
                                                        <option key={ci} value={colKeys[ci]}>{eh || `(列名なし${ci + 1})`}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const Icon = ({ name, className }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current) {
                    ref.current.innerHTML = `<i data-lucide="${name}" class="${className || ''}"></i>`;
                    lucide.createIcons({
                        root: ref.current
                    });
                }
            }, [name, className]);
            return <span ref={ref} className="contents"></span>;
        };

        const Modal = ({ isOpen, title, message, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[100]">
                    <div className="bg-slate-900 border border-white/10 rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                        <h3 className="text-lg font-bold mb-2 text-white">{title}</h3>
                        <p className="text-slate-400 mb-6 whitespace-pre-wrap">{message}</p>
                        <div className="flex justify-end">
                            <button onClick={onClose} className="bg-gradient-to-r from-violet-600 to-blue-600 hover:from-violet-500 hover:to-blue-500 text-white px-4 py-2 rounded-lg transition-all duration-200">
                                OK
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [pdfFile, setPdfFile] = useState(null);
            const [pdfDoc, setPdfDoc] = useState(null); // null の場合は画像ファイルとして扱う
            const [numPages, setNumPages] = useState(0);

            const [pagesPerSet, setPagesPerSet] = useState(1);
            const [currentSet, setCurrentSet] = useState(1);
            const [setImages, setSetImages] = useState([]);

            const [regions, setRegions] = useState([]);
            const [selectedRegionId, setSelectedRegionId] = useState(null);
            const [focusedRegionName, setFocusedRegionName] = useState(null);
            const [ocrResults, setOcrResults] = useState(null);

            const [isLoading, setIsLoading] = useState(false);
            const [loadingText, setLoadingText] = useState("");
            const [modal, setModal] = useState({ isOpen: false, title: "", message: "" });
            const [logs, setLogs] = useState([]);
            const [showLabels, setShowLabels] = useState(true);

            const [apiKey, setApiKey] = useState("");
            const [apiKeyInput, setApiKeyInput] = useState("");
            const [showApiKey, setShowApiKey] = useState(false);

            const [modelName, setModelName] = useState("gemini-flash-latest");
            const [modelNameInput, setModelNameInput] = useState("gemini-flash-latest");

            const [gasUrl, setGasUrl] = useState("");
            const [showGasSettings, setShowGasSettings] = useState(false);
            const [gasUrlInput, setGasUrlInput] = useState("");
            const [templates, setTemplates] = useState([]);
            const [selectedTemplateIndex, setSelectedTemplateIndex] = useState("");

            // Template Saving States
            const [showSaveTemplateModal, setShowSaveTemplateModal] = useState(false);
            const [newTemplateName, setNewTemplateName] = useState("");
            const [activeTemplateName, setActiveTemplateName] = useState(null);

            // Interaction & Drag States
            const containerRefs = useRef([]);
            const [interaction, setInteraction] = useState({ type: 'idle', id: null, pageOffset: 0, startX: 0, startY: 0, initialRect: null });
            const dragItemRef = useRef(null);
            const dragOverItemRef = useRef(null);

            // 領域の他ページへの複製メニュー
            const [copyMenuRegionId, setCopyMenuRegionId] = useState(null);

            useEffect(() => {
                if (!copyMenuRegionId) return;
                const closeMenu = () => setCopyMenuRegionId(null);
                window.addEventListener('click', closeMenu);
                return () => window.removeEventListener('click', closeMenu);
            }, [copyMenuRegionId]);

            // ---- Excel振り分け(旧RPAツール)関連のstate ----
            const [viewMode, setViewMode] = useState('ocr'); // 'ocr' | 'excel'

            const [ledgers, setLedgers] = useState([]); // [{id, name}]
            const [activeLedgerId, setActiveLedgerId] = useState(null);
            const [showLedgerModal, setShowLedgerModal] = useState(false);
            const skipPersistRef = useRef(false);

            const [mappingTemplates, setMappingTemplates] = useState([]);
            const [showTemplateModal, setShowTemplateModal] = useState(false);
            const [expandedTemplateId, setExpandedTemplateId] = useState(null);

            const [excelFileName, setExcelFileName] = useState('');
            const [excelHeaders, setExcelHeaders] = useState([]);
            const [excelRows, setExcelRows] = useState([]); // array of arrays (既存データ)
            const [sheetName, setSheetName] = useState('');

            const [csvFileName, setCsvFileName] = useState('');
            const [csvHeaders, setCsvHeaders] = useState([]);
            const [csvRows, setCsvRows] = useState([]); // array of objects
            const [csvSourceFiles, setCsvSourceFiles] = useState([]);

            const [mappedRows, setMappedRows] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [reflected, setReflected] = useState(false);

            const excelInputRef = useRef(null);
            const csvInputRef = useRef(null);

            // 列名の空欄・重複に依存しない、位置ベースの安定キー(col1, col2, ...)
            const columnKeys = excelHeaders.map((_, i) => `col${i + 1}`);
            const csvFieldKeys = csvHeaders.map((_, i) => `field${i + 1}`);
            const activeLedgerName = ledgers.find(l => l.id === activeLedgerId)?.name || '';
            const matchedTemplate = (excelHeaders.length > 0 && csvHeaders.length > 0)
                ? mappingTemplates.find(t => t.ledgerId === activeLedgerId && JSON.stringify(t.csvHeaders) === JSON.stringify(csvHeaders))
                : null;

            const showMessage = (title, message) => setModal({ isOpen: true, title, message });

            const addLog = useCallback((msg, type = 'info') => {
                setLogs(prev => [...prev, { time: new Date().toLocaleTimeString('ja-JP', { hour12: false }), msg, type }]);
            }, []);

            useEffect(() => {
                try {
                    const savedApiKey = localStorage.getItem('geminiApiKey');
                    if (savedApiKey) {
                        setApiKey(savedApiKey);
                    }
                    const savedModel = localStorage.getItem('geminiModel');
                    if (savedModel) {
                        setModelName(savedModel);
                        setModelNameInput(savedModel);
                    }
                    const savedUrl = localStorage.getItem('gasWebhookUrl');
                    if (savedUrl) {
                        setGasUrl(savedUrl);
                        fetchTemplates(savedUrl);
                    }
                } catch (e) {
                    console.error("localStorage access error:", e);
                }
            }, []);

            // Excel振り分け機能: 台帳一覧・保存済みマッピングの初期読込
            useEffect(() => {
                setMappingTemplates(loadMappingTemplates());

                const list = loadLedgersList();
                setLedgers(list);
                const activeId = localStorage.getItem(ACTIVE_LEDGER_KEY);
                if (activeId && list.some(l => l.id === activeId)) {
                    const data = loadLedgerData(activeId);
                    if (data) {
                        skipPersistRef.current = true;
                        setActiveLedgerId(activeId);
                        setExcelFileName(data.fileName || '');
                        setExcelHeaders(data.headers || []);
                        setExcelRows(data.rows || []);
                        setSheetName(data.sheetName || '');
                    }
                }
            }, []);

            // アクティブな台帳のExcelデータが変わるたび自動でlocalStorageに保存(台帳切替直後の1回は保存をスキップ)
            useEffect(() => {
                if (!activeLedgerId) return;
                if (skipPersistRef.current) { skipPersistRef.current = false; return; }
                try {
                    localStorage.setItem(ledgerDataKey(activeLedgerId), JSON.stringify({
                        fileName: excelFileName, headers: excelHeaders, rows: excelRows, sheetName
                    }));
                } catch (e) {
                    addLog('台帳データの自動保存に失敗しました(ブラウザの保存容量超過の可能性)。ダウンロードして手動で保存してください。', 'warning');
                }
            }, [excelRows, excelHeaders, sheetName, excelFileName, activeLedgerId]);

            // OCRワークスペース(viewMode==='ocr')は内部パネルでスクロールを制御するためbodyのスクロールを固定し、
            // Excel振り分け画面(viewMode==='excel')はページ全体を通常スクロールさせる
            useEffect(() => {
                document.body.style.overflow = viewMode === 'ocr' ? 'hidden' : 'auto';
            }, [viewMode]);

            const openSettings = () => {
                setApiKeyInput(apiKey);
                setModelNameInput(modelName);
                setGasUrlInput(gasUrl);
                setShowGasSettings(true);
            };

            const handleSaveSettings = () => {
                const key = apiKeyInput.trim();
                const model = modelNameInput.trim() || 'gemini-flash-latest';
                const url = gasUrlInput.trim();

            const fetchTemplates = async (url) => {
                addLog("GASからテンプレート一覧を取得しています...", "info");

                    const data = await callGasAPI(url, 'getTemplates');

                    addLog(`テンプレートを ${data.length} 件取得しました。`, 'success');

                    addLog(`テンプレートの取得に失敗しました。URLが正しいか確認してください。`, 'error');

            const handleApplyTemplate = () => {
                if (selectedTemplateIndex === "") return;
                const template = templates[selectedTemplateIndex];
                if (template && template.regions) {
                    const newRegions = template.regions.map((r, idx) => ({
                        ...r,
                        id: `region_${Date.now()}_${idx}`
                    }));
                    setRegions(newRegions);
                    setActiveTemplateName(template.name);
                    addLog(`テンプレート「${template.name}」を適用しました。`, 'success');
                }
            };

            const handleSaveTemplate = async (isUpdate = false) => {
                const saveName = isUpdate ? activeTemplateName : newTemplateName.trim();
                if (!saveName || regions.length === 0) return;

                setIsLoading(true);
                setLoadingText(isUpdate ? "テンプレートを上書き保存中..." : "新規テンプレートを保存中...");

                try {
                    const regionsToSave = regions.map(r => ({
                        name: r.name,
                        type: r.type,
                        x: r.x,
                        y: r.y,
                        w: r.w,
                        h: r.h,
                        pageOffset: r.pageOffset
                    }));

                    await callGasAPI(gasUrl, 'saveTemplate', {
                        name: saveName,
                        regions: regionsToSave,
                        isUpdate: isUpdate,
                        originalName: isUpdate ? activeTemplateName : null
                    });

                    addLog(`テンプレート「${saveName}」を${isUpdate ? '上書き' : '新規'}保存しました。`, 'success');

                    setShowSaveTemplateModal(false);
                    if (!isUpdate) {
                        setNewTemplateName("");

                    setActiveTemplateName(saveName);

                    fetchTemplates(gasUrl);
                } catch (e) {
                    addLog(`テンプレートの保存に失敗しました。`, 'error');
                    showMessage("エラー", "テンプレートの保存に失敗しました。");
                } finally {
                    setIsLoading(false);
                }
            };

            const renderPageToBase64 = async (pdf, pageNum) => {
                const page = await pdf.getPage(pageNum);
                const scale = 2.0;
                const viewport = page.getViewport({ scale });
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                await page.render({ canvasContext: ctx, viewport }).promise;
                return canvas.toDataURL('image/png');
            };

            const loadSetImages = async (pdf, setIdx, perSet) => {
                if (!pdf) return; // PDFがない(画像)場合はスキップ

                setIsLoading(true);
                setLoadingText(`プレビュー画像を生成中...`);
                try {
                    const imgs = [];
                    const startPage = (setIdx - 1) * perSet + 1;
                    for (let i = 0; i < perSet; i++) {
                        const pageNum = startPage + i;
                        if (pageNum <= pdf.numPages) {
                            imgs.push(await renderPageToBase64(pdf, pageNum));
                        }
                    }
                    setSetImages(imgs);
                    setCurrentSet(setIdx);
                } catch (error) {
                    console.error(error);
                    showMessage("エラー", "画像の読み込みに失敗しました。");
                } finally {
                    setIsLoading(false);
                }
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const isPDF = file.type === 'application/pdf';
                const isImage = file.type.startsWith('image/');

                if (!isPDF && !isImage) {
                    showMessage("エラー", "有効なPDFまたは画像ファイルを選択してください。");
                    return;
                }

                setIsLoading(true);
                setLoadingText("ファイルを読み込んでいます...");
                setPdfFile(file);
                setRegions([]);
                setOcrResults(null);
                setPagesPerSet(1);
                setCurrentSet(1);
                setLogs([]);
                setActiveTemplateName(null);
                addLog(`ファイル「${file.name}」の読み込みを開始しました。`);

                try {
                    if (isPDF) {
                        const fileReader = new FileReader();
                        fileReader.onload = async function() {
                            const typedarray = new Uint8Array(this.result);
                            const pdf = await pdfjsLib.getDocument(typedarray).promise;
                            setPdfDoc(pdf);
                            setNumPages(pdf.numPages);
                            addLog(`PDFの解析完了: 全 ${pdf.numPages} ページを認識しました。`);

                            let detectedPagesPerSet = 1;

                            if (pdf.numPages > 1 && apiKey) {
                                addLog("AIによるセット構成（ページ数）の自動判定を実行中...", "info");
                                setLoadingText("AIがPDFの構成を自動分析しています...");
                                try {
                                    const testPagesCount = Math.min(4, pdf.numPages);
                                    const testImages = [];
                                    for(let i=1; i<=testPagesCount; i++) {
                                        const page = await pdf.getPage(i);
                                        const viewport = page.getViewport({ scale: 0.5 });
                                        const canvas = document.createElement('canvas');
                                        canvas.width = viewport.width; canvas.height = viewport.height;
                                        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                                        testImages.push(canvas.toDataURL('image/png'));
                                    }

                                    const prompt = `提供された複数の画像は、ある帳票PDFの先頭から順番のページです。
このPDFは、Nページで1つの書類のセット（1レコード）を構成し、それが繰り返される構造になっている可能性があります。
各ページの内容、見出し、フォーマットの連続性を分析し、「1つのセットが何ページで構成されているか」を推測してください。
例えば、1ページ目が基本情報、2ページ目が明細なら「2」です。すべてのページが独立しているなら「1」です。
結果は以下のJSONスキーマに従って出力してください。`;

                                    const schema = {
                                        type: "OBJECT",
                                        properties: {
                                            pages_per_set: { type: "INTEGER", description: "推測される1セットあたりのページ数 (1以上の整数)" }
                                        },
                                        required: ["pages_per_set"]
                                    };

                                    const data = await callGeminiAPI(apiKey, modelName, prompt, testImages, schema);
                                    if (data.pages_per_set >= 1 && data.pages_per_set <= pdf.numPages) {
                                        detectedPagesPerSet = data.pages_per_set;
                                        addLog(`自動判定完了: 1セット ${detectedPagesPerSet} ページと推測しました。`, "success");
                                    }
                                } catch (err) {
                                    console.error(err);
                                    addLog("セット構成の自動判定に失敗しました。デフォルトの1ページ構成で表示します。", "warning");
                                }
                            } else if (pdf.numPages > 1) {
                                addLog("Gemini APIキー未設定のため、セット構成の自動判定をスキップしました。", "warning");
                            }

                            setPagesPerSet(detectedPagesPerSet);
                            await loadSetImages(pdf, 1, detectedPagesPerSet);
                            addLog(`初期表示が完了しました。`, 'success');
                            setIsLoading(false);
                        };
                        fileReader.readAsArrayBuffer(file);
                    } else if (isImage) {
                        const fileReader = new FileReader();
                        fileReader.onload = (event) => {
                            const dataUrl = event.target.result;
                            setPdfDoc(null); // 画像ファイルであることを示す
                            setNumPages(1);
                            setPagesPerSet(1);
                            setSetImages([dataUrl]);
                            setCurrentSet(1);
                            addLog(`画像の解析完了: 1ページとして認識しました。`);
                            addLog(`初期表示が完了しました。`, 'success');
                            setIsLoading(false);
                        };
                        fileReader.onerror = () => {
                            addLog(`エラー: 画像の読み込みに失敗しました。`, 'error');
                            showMessage("エラー", "画像の読み込みに失敗しました。");
                            setIsLoading(false);
                        };
                        fileReader.readAsDataURL(file);
                    }
                } catch (error) {
                    console.error(error);
                    addLog(`エラー: ファイルの読み込みに失敗しました。`, 'error');
                    showMessage("エラー", "ファイルの読み込みに失敗しました。");
                    setIsLoading(false);
                }
            };

            const handlePagesPerSetChange = async (newVal) => {
                const val = parseInt(newVal, 10);
                if (val >= 1 && val <= 10) {
                    setPagesPerSet(val);
                    setRegions([]);
                    setActiveTemplateName(null);
                    if (pdfDoc) {
                        await loadSetImages(pdfDoc, 1, val);
                    }
                }
            };

            const handleAutoDetectRegions = async () => {
                if (setImages.length === 0) return;
                if (!apiKey) {
                    showMessage("APIキー未設定", "Gemini APIキーが設定されていません。画面右上の設定アイコンから入力してください。");
                    return;
                }
                setIsLoading(true);
                setLoadingText("AIがドキュメントを解析し、抽出領域を特定しています...");
                addLog("AIによる抽出領域の自動特定を開始します...", "info");
                setActiveTemplateName(null);

                try {
                    const newRegions = [];
                    for (let offset = 0; offset < setImages.length; offset++) {
                        addLog(`構成ページ ${offset + 1}/${setImages.length} を分析中...`);

                        const prompt = `あなたは高度なAI-OCRアシスタントです。提供された帳票・ドキュメントの画像から、システムで抽出・データ化すべき「入力値が記載される領域」を自動的に特定してください。
【重要: 傾き補正】スキャンされたPDFや画像の場合、傾きや歪みがある可能性があります。その場合は、画像の傾きを補正したと仮定して、実際の文字が書かれている領域を正確に囲んでください。
各領域について、その項目の論理的な名前（例：「請求日」「会社名」など）と、バウンディングボックス（0〜1000正規化座標: [ymin, xmin, ymax, xmax]）、項目の種類（type）をJSON形式で返してください。`;

                        const schema = {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                    name: { type: "STRING", description: "抽出項目の名称" },
                                    type: { type: "STRING", description: "項目の種類 ('text': 通常の文字, 'checkbox': チェックボックス, 'circle': 丸囲み選択)" },
                                    box: {
                                        type: "ARRAY",
                                        items: { type: "INTEGER" },
                                        description: "[ymin, xmin, ymax, xmax] Normalized 0-1000"
                                    }
                                },
                                required: ["name", "type", "box"]
                            }
                        };

                        const data = await callGeminiAPI(apiKey, modelName, prompt, setImages[offset], schema);

                        data.forEach((item, idx) => {
                            const [ymin, xmin, ymax, xmax] = item.box;
                            const validTypes = ['text', 'checkbox', 'circle'];
                            const itemType = validTypes.includes(item.type) ? item.type : 'text';

                            newRegions.push({
                                id: `region_${Date.now()}_${offset}_${idx}`,
                                name: item.name,
                                type: itemType,
                                x: xmin / 1000,
                                y: ymin / 1000,
                                w: (xmax - xmin) / 1000,
                                h: (ymax - ymin) / 1000,
                                pageOffset: offset
                            });
                        });
                    }

                    setRegions(newRegions);
                    addLog(`自動特定完了: 合計 ${newRegions.length} 件の領域を検出しました。`, "success");
                    showMessage("完了", `${newRegions.length}件の抽出領域を自動特定しました。必要に応じて微調整してください。`);
                } catch (error) {
                    console.error(error);
                    addLog(`エラー: 領域の自動特定に失敗しました。(${error.message})`, "error");
                    showMessage("エラー", `領域の自動特定に失敗しました。${error.message || '時間をおいて再試行してください。'}`);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleRunOCR = async () => {
                if ((!pdfDoc && setImages.length === 0) || regions.length === 0) {
                    showMessage("確認", "ドキュメントが読み込まれていないか、抽出領域が設定されていません。");
                    return;
                }
                if (!apiKey) {
                    showMessage("APIキー未設定", "Gemini APIキーが設定されていません。画面右上の設定アイコンから入力してください。");
                    return;
                }

                setIsLoading(true);
                setOcrResults(null);
                const results = [];
                let hasError = false;

                const numSets = Math.ceil(numPages / pagesPerSet);
                addLog(`全 ${numSets} レコード（セット）のOCR解析を開始します...`, "info");

                const schema = {
                    type: "ARRAY",
                    items: {
                        type: "OBJECT",
                        properties: {
                            name: { type: "STRING" },
                            value: { type: "STRING", description: "抽出されたテキスト。見つからない場合は'不明'" },
                            box: {
                                type: "ARRAY",
                                items: { type: "INTEGER" },
                                description: "実際に抽出した領域の[ymin, xmin, ymax, xmax] (0-1000)。見つからない場合は空配列"
                            }
                        },
                        required: ["name", "value"]
                    }
                };

                try {
                    for (let setIdx = 0; setIdx < numSets; setIdx++) {
                        const setRecordData = {};
                        let setHasError = false;

                        addLog(`[レコード ${setIdx + 1}/${numSets}] 処理を開始...`);

                        for (let offset = 0; offset < pagesPerSet; offset++) {
                            const pageNum = setIdx * pagesPerSet + offset + 1;
                            if (pdfDoc && pageNum > numPages) break;

                            const targetRegionsForPage = regions.filter(r => r.pageOffset === offset);
                            if (targetRegionsForPage.length === 0) continue;

                            const targetRegionsData = targetRegionsForPage.map(r => ({
                                name: r.name,
                                type: r.type || 'text',
                                box: [
                                    Math.round(r.y * 1000),
                                    Math.round(r.x * 1000),
                                    Math.round((r.y + r.h) * 1000),
                                    Math.round((r.x + r.w) * 1000)
                                ]
                            }));

                            setLoadingText(`レコード ${setIdx + 1}/${numSets} (構成ページ ${offset + 1}) を処理中...`);

                            // PDFか画像かで画像データの取得元を切り替え
                            let pageImgData;
                            if (pdfDoc) {
                                pageImgData = await renderPageToBase64(pdfDoc, pageNum);
                            } else {
                                pageImgData = setImages[offset]; // 画像の場合はすでにBase64がある
                            }

                            const prompt = `あなたは高度なAI-OCRアシスタントです。提供された画像から、以下のJSONで指定された各項目のテキストや状態を抽出してください。

【重要: レイアウト変更への追従と視覚化】
提供されたバウンディングボックス（0〜1000正規化座標: [ymin, xmin, ymax, xmax]）は「目安位置」です。
ページによってレイアウトが変わっている場合でも、指定された項目名（name）の意味を理解し、画像全体を探索して実際の値を見つけ出してください。

【重要: 入力形式（type）に基づく厳格な読み取り】
各項目には \`type\` （テキスト、チェックボックス、丸囲み）が指定されています。推測せず、必ず指定された \`type\` に従って判定してください。
1. type が "text" の場合: 書かれている内容をそのまま抽出してください。改行は維持してください。
2. type が "checkbox" の場合: 対象がチェック（✓、✔、×、塗りつぶし等）されている場合は "TRUE"、空欄の場合は "FALSE" と出力してください。
3. type が "circle" の場合: 対象が丸（〇）などで囲まれている場合は、囲まれているテキスト（例："1. 有"）を出力してください。

【重要: 出力形式の厳守】
1. 実際に抽出した正確な位置座標を \`box\` に返してください。
2. どうしても該当項目が見つからない場合や判定できない場合は、\`value\` を "不明" とし、\`box\` を空配列 \`[]\` にしてください。

抽出対象の領域情報:
${JSON.stringify(targetRegionsData)}`;

                            try {
                                const pageData = await callGeminiAPI(apiKey, modelName, prompt, pageImgData, schema);

                                pageData.forEach(item => {
                                    setRecordData[item.name] = {
                                        value: item.value,
                                        box: item.box && item.box.length === 4 ? item.box : null
                                    };
                                });
                            } catch (pageError) {
                                console.error(`Set ${setIdx+1} Page ${offset+1} error:`, pageError);
                                addLog(`[レコード ${setIdx + 1}] のページ抽出でエラー発生。`, "error");
                                setHasError = true;
                                hasError = true;
                            }

                            if (setIdx < numSets - 1 || offset < pagesPerSet - 1) {
                                await new Promise(res => setTimeout(res, 3500));
                            }
                        }

                        regions.forEach(r => {
                            if (!setRecordData[r.name]) {
                                setRecordData[r.name] = { value: setHasError ? '解析エラー' : '不明', box: null };
                            }
                        });

                        results.push({ setIndex: setIdx + 1, data: setRecordData });
                        addLog(`[レコード ${setIdx + 1}/${numSets}] 完了`, "success");

                    }

                    if (results.length > 0) {
                        setOcrResults(results);
                        if (pdfDoc) await loadSetImages(pdfDoc, 1, pagesPerSet);

                        if (hasError) {
                            addLog(`処理が完了しましたが、一部でエラーが発生しました。`, "warning");
                            showMessage("完了 (一部エラー)", "解析処理が終了しましたが、一部でエラーが発生しました。\n取得できた部分までの結果を表示します。");
                        } else {
                            addLog(`すべてのレコードのOCR処理が正常に完了しました！`, "success");
                            showMessage("完了", "すべてのレコードのOCR処理が完了しました。右パネルで結果を確認してください。");
                        }
                    } else {
                        throw new Error("すべての解析に失敗しました。");
                    }
                } catch (error) {
                    console.error(error);
                    addLog(`エラー: 処理中に致命的な問題が発生しました。(${error.message})`, "error");
                    showMessage("エラー", "OCR処理中に致命的なエラーが発生しました。");
                } finally {
                    setIsLoading(false);
                }
            };

            const getRelativeCoords = (e, pageOffset) => {
                const container = containerRefs.current[pageOffset];
                if (!container) return { x: 0, y: 0 };
                const rect = container.getBoundingClientRect();
                return {
                    x: Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)),
                    y: Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height))
                };
            };

            const onPointerDownContainer = (e, pageOffset) => {
                if (e.target !== containerRefs.current[pageOffset] && e.target.tagName !== 'IMG') return;
                const { x, y } = getRelativeCoords(e, pageOffset);
                const id = `region_${Date.now()}`;
                const newRegion = { id, name: "新規項目", type: "text", x, y, w: 0, h: 0, pageOffset };

                setRegions([...regions, newRegion]);
                setSelectedRegionId(id);
                setInteraction({ type: 'draw', id, pageOffset, startX: x, startY: y, initialRect: newRegion });
            };

            const onPointerDownRegion = (e, id, pageOffset) => {
                e.stopPropagation();
                setSelectedRegionId(id);
                const { x, y } = getRelativeCoords(e, pageOffset);
                const region = regions.find(r => r.id === id);
                setInteraction({ type: 'move', id, pageOffset, startX: x, startY: y, initialRect: { ...region } });
            };

            const onPointerDownResize = (e, id, pageOffset) => {
                e.stopPropagation();
                setSelectedRegionId(id);
                const { x, y } = getRelativeCoords(e, pageOffset);
                const region = regions.find(r => r.id === id);
                setInteraction({ type: 'resize', id, pageOffset, startX: x, startY: y, initialRect: { ...region } });
            };

            const onPointerMove = (e) => {
                if (interaction.type === 'idle') return;

                const { type, id, pageOffset, startX, startY, initialRect } = interaction;
                const { x, y } = getRelativeCoords(e, pageOffset);

                setRegions(prev => prev.map(r => {
                    if (r.id !== id) return r;

                    let newR = { ...r };
                    if (type === 'draw') {
                        newR.x = Math.min(startX, x);
                        newR.y = Math.min(startY, y);
                        newR.w = Math.abs(x - startX);
                        newR.h = Math.abs(y - startY);
                    } else if (type === 'move') {
                        const dx = x - startX;
                        const dy = y - startY;
                        newR.x = Math.max(0, Math.min(1 - newR.w, initialRect.x + dx));
                        newR.y = Math.max(0, Math.min(1 - newR.h, initialRect.y + dy));
                    } else if (type === 'resize') {
                        const dx = x - startX;
                        const dy = y - startY;
                        newR.w = Math.max(0.01, Math.min(1 - newR.x, initialRect.w + dx));
                        newR.h = Math.max(0.01, Math.min(1 - newR.y, initialRect.h + dy));
                    }
                    return newR;
                }));
            };

            const onPointerUp = () => {
                if (interaction.type === 'draw') {
                    const drawnRegion = regions.find(r => r.id === interaction.id);
                    if (drawnRegion && (drawnRegion.w < 0.02 || drawnRegion.h < 0.02)) {
                        setRegions(prev => prev.filter(r => r.id !== interaction.id));
                    }
                }
                setInteraction({ type: 'idle', id: null, pageOffset: 0 });
            };

            const deleteRegion = (id) => {
                setRegions(regions.filter(r => r.id !== id));
                if (selectedRegionId === id) setSelectedRegionId(null);
            };

            const updateRegionName = (id, newName) => {
                setRegions(regions.map(r => r.id === id ? { ...r, name: newName } : r));
            };

            const updateRegionType = (id, newType) => {
                setRegions(regions.map(r => r.id === id ? { ...r, type: newType } : r));
            };

            const duplicateRegionToPage = (id, targetPageOffset) => {
                const region = regions.find(r => r.id === id);
                if (!region) return;
                const newRegion = { ...region, id: `region_${Date.now()}_copy`, pageOffset: targetPageOffset };
                setRegions(prev => [...prev, newRegion]);
                setSelectedRegionId(newRegion.id);
                setCopyMenuRegionId(null);
                addLog(`「${region.name}」をP.${targetPageOffset + 1}に複製しました。`, 'success');
            };

            const handleSortDragStart = (e, index) => {
                dragItemRef.current = index;
                if (e.dataTransfer) e.dataTransfer.setData('text/plain', '');
                setTimeout(() => {
                    if (e.target && e.target.style) e.target.style.opacity = '0.4';
                }, 0);
            };

            const handleSortDragEnter = (e, index) => {
                e.preventDefault();
                dragOverItemRef.current = index;
                if (dragItemRef.current !== null && dragItemRef.current !== index) {
                    const newRegions = [...regions];
                    const draggedRegion = newRegions[dragItemRef.current];
                    newRegions.splice(dragItemRef.current, 1);
                    newRegions.splice(index, 0, draggedRegion);
                    setRegions(newRegions);
                    dragItemRef.current = index;
                }
            };

            const handleSortDragOver = (e) => {
                e.preventDefault();
            };

            const handleSortDragEnd = (e) => {
                dragItemRef.current = null;
                dragOverItemRef.current = null;
                if (e.target && e.target.style) e.target.style.opacity = '1';
            };

            const handleExportCSV = () => {
                if (!ocrResults) return;

                const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
                const headerRow = ["レコードNo.", ...regions.map(r => `"${r.name.replace(/"/g, '""')}"`)].join(",");

                let csvContent = headerRow + "\n";

                ocrResults.forEach(res => {
                    const row = [res.setIndex];
                    regions.forEach(r => {
                        const data = res.data[r.name];
                        const val = data ? data.value : "";
                        row.push(`"${String(val).replace(/"/g, '""')}"`);
                    });
                    csvContent += row.join(",") + "\n";
                });

                const blob = new Blob([bom, csvContent], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `ocr_records_${Date.now()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const updateOcrResult = (setIdx, key, newValue) => {
                const newResults = [...ocrResults];
                if (newResults[setIdx] && newResults[setIdx].data[key]) {
                    newResults[setIdx].data[key].value = newValue;
                    setOcrResults(newResults);
                }
            };

            // ---- Excel振り分け(旧RPAツール)関連の関数 ----

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const sheet = workbook.Sheets[firstSheetName];
                        const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                        if (aoa.length === 0) {
                            addLog('Excelファイルにデータが見つかりません。', 'error');
                            return;
                        }
                        const headers = aoa[0].map(h => String(h));
                        const rows = aoa.slice(1).filter(r => r.some(c => String(c).trim() !== ''));

                        const newId = `ledger_${Date.now()}`;
                        const newLedger = { id: newId, name: file.name.replace(/\.[^/.]+$/, '') };
                        const newList = [...ledgers, newLedger];
                        setLedgers(newList);
                        saveLedgersList(newList);
                        try {
                            localStorage.setItem(ledgerDataKey(newId), JSON.stringify({ fileName: file.name, headers, rows, sheetName: firstSheetName }));
                            localStorage.setItem(ACTIVE_LEDGER_KEY, newId);
                        } catch (err2) {
                            addLog('台帳データの保存に失敗しました(ブラウザの保存容量超過の可能性)。この台帳は今回のセッション内のみ有効です。', 'warning');
                        }

                        skipPersistRef.current = true;
                        setActiveLedgerId(newId);
                        setExcelHeaders(headers);
                        setExcelRows(rows);
                        setSheetName(firstSheetName);
                        setExcelFileName(file.name);
                        setMappedRows([]);
                        setReflected(false);
                        addLog(`Excel「${file.name}」を新規台帳として読み込みました。シート「${firstSheetName}」/ 列${headers.length} / 既存${rows.length}行`, 'success');
                    } catch (err) {
                        addLog(`Excel読み込みエラー: ${err.message}`, 'error');
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = '';
            };

            const parseCsvFile = (file) => new Promise((resolve) => {
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    encoding: 'UTF-8',
                    complete: (result) => {
                        resolve({ name: file.name, headers: result.meta.fields || [], rows: result.data });
                    },
                    error: (err) => {
                        resolve({ name: file.name, headers: [], rows: [], error: err.message });
                    }
                });
            });

            const handleCsvUpload = (e) => {
                const files = Array.from(e.target.files || []);
                if (files.length === 0) return;

                Promise.all(files.map(parseCsvFile)).then(results => {
                    const failed = results.filter(r => r.error || r.headers.length === 0);
                    const parsed = results.filter(r => !r.error && r.headers.length > 0);

                    if (parsed.length === 0) {
                        addLog('CSVの読み込みに失敗しました（列を認識できませんでした）。', 'error');
                        return;
                    }

                    const baseHeaders = parsed[0].headers;
                    const matched = parsed.filter(r => JSON.stringify(r.headers) === JSON.stringify(baseHeaders));
                    const mismatched = parsed.filter(r => JSON.stringify(r.headers) !== JSON.stringify(baseHeaders));

                    const combinedRows = matched.flatMap(r => r.rows);
                    const breakdown = matched.map(r => ({ name: r.name, count: r.rows.length }));

                    setCsvHeaders(baseHeaders);
                    setCsvRows(combinedRows);
                    setCsvSourceFiles(breakdown);
                    setCsvFileName(matched.length > 1 ? `${matched.length}ファイル（合計${combinedRows.length}件）` : matched[0].name);
                    setMappedRows([]);
                    setReflected(false);

                    if (matched.length > 1) {
                        addLog(`CSV ${matched.length}件を結合して読み込みました。列${baseHeaders.length} / 合計${combinedRows.length}件（${matched.map(r => r.name).join('、')}）`, 'success');
                    } else {
                        addLog(`CSV「${matched[0].name}」を読み込みました。列${baseHeaders.length} / ${combinedRows.length}件`, 'success');
                    }

                    const skipped = [...mismatched.map(r => r.name), ...failed.map(r => r.name)];
                    if (skipped.length > 0) {
                        addLog(`列構成が異なる、または読み込みに失敗したため除外されたファイル: ${skipped.join('、')}`, 'warning');
                    }
                });
                e.target.value = '';
            };

            const loadOcrResultsIntoCsv = () => {
                if (!ocrResults || ocrResults.length === 0) {
                    addLog('先にOCR解析を実行してください。', 'warning');
                    return;
                }
                const headers = regions.map(r => r.name);
                const rows = ocrResults.map(res => {
                    const obj = {};
                    regions.forEach(r => {
                        const d = res.data[r.name];
                        obj[r.name] = d ? String(d.value) : '';
                    });
                    return obj;
                });
                setCsvHeaders(headers);
                setCsvRows(rows);
                setCsvSourceFiles([]);
                setCsvFileName(`AI-OCRの解析結果（${rows.length}件）`);
                setMappedRows([]);
                setReflected(false);
                addLog(`AI-OCRの解析結果（${rows.length}件）をExcel振り分け用データとして読み込みました。`, 'success');
            };

            const goToExcelView = () => {
                loadOcrResultsIntoCsv();
                setViewMode('excel');
            };

            const switchLedger = (id) => {
                if (!id || id === activeLedgerId) return;
                const data = loadLedgerData(id);
                if (!data) {
                    addLog('台帳データの読み込みに失敗しました。', 'error');
                    return;
                }
                skipPersistRef.current = true;
                setActiveLedgerId(id);
                setExcelFileName(data.fileName || '');
                setExcelHeaders(data.headers || []);
                setExcelRows(data.rows || []);
                setSheetName(data.sheetName || '');
                setMappedRows([]);
                setReflected(false);
                try { localStorage.setItem(ACTIVE_LEDGER_KEY, id); } catch (e) {}
                const name = ledgers.find(l => l.id === id)?.name || '';
                addLog(`台帳「${name}」に切り替えました。`, 'info');
            };

            const renameLedger = (id, newName) => {
                const trimmed = newName.trim();
                if (!trimmed) return;
                const newList = ledgers.map(l => l.id === id ? { ...l, name: trimmed } : l);
                setLedgers(newList);
                saveLedgersList(newList);
                addLog(`台帳名を「${trimmed}」に変更しました。`, 'success');
            };

            const deleteLedger = (id) => {
                const deletedName = ledgers.find(l => l.id === id)?.name || '';
                const newList = ledgers.filter(l => l.id !== id);
                setLedgers(newList);
                saveLedgersList(newList);
                try { localStorage.removeItem(ledgerDataKey(id)); } catch (e) {}

                if (activeLedgerId === id) {
                    if (newList.length > 0) {
                        switchLedger(newList[0].id);
                    } else {
                        try { localStorage.removeItem(ACTIVE_LEDGER_KEY); } catch (e) {}
                        setActiveLedgerId(null);
                        setExcelFileName('');
                        setExcelHeaders([]);
                        setExcelRows([]);
                        setSheetName('');
                        setMappedRows([]);
                        setReflected(false);
                    }
                }
                addLog(`台帳「${deletedName}」を削除しました。`, 'info');
            };

            const upsertMappingTemplate = (fieldMapping) => {
                const newTemplate = {
                    id: `tmpl_${Date.now()}`,
                    ledgerId: activeLedgerId,
                    ledgerName: activeLedgerName || excelFileName,
                    csvHeaders: csvHeaders,
                    fieldMapping,
                    savedAt: Date.now()
                };
                setMappingTemplates(prev => {
                    const filtered = prev.filter(t => !(t.ledgerId === activeLedgerId && JSON.stringify(t.csvHeaders) === JSON.stringify(csvHeaders)));
                    const next = [...filtered, newTemplate];
                    saveMappingTemplates(next);
                    return next;
                });
                addLog('今回のマッピング内容を保存しました。同じCSV形式・同じ台帳ならAI不要で再利用できます。', 'info');
            };

            const applyTemplateMapping = () => {
                if (!matchedTemplate) return;
                const rows = csvRows.map(csvRow => {
                    const obj = {};
                    columnKeys.forEach(k => { obj[k] = ''; });
                    csvHeaders.forEach((h, i) => {
                        const targetCol = matchedTemplate.fieldMapping[csvFieldKeys[i]];
                        if (targetCol && Object.prototype.hasOwnProperty.call(obj, targetCol)) {
                            const val = csvRow[h];
                            obj[targetCol] = (val !== undefined && val !== null) ? String(val) : '';
                        }
                    });
                    return obj;
                });
                setMappedRows(rows);
                setReflected(false);
                addLog(`保存済みマッピングを適用しました。(${rows.length}件、AI不要。複数値の自動分割・書式整形は行われないため内容を確認してください)`, 'success');
            };

            const deleteMappingTemplate = (id) => {
                setMappingTemplates(prev => {
                    const next = prev.filter(t => t.id !== id);
                    saveMappingTemplates(next);
                    return next;
                });
                addLog('保存済みマッピングを削除しました。', 'info');
            };

            const updateTemplateFieldMapping = (templateId, fieldKey, colKey) => {
                setMappingTemplates(prev => {
                    const next = prev.map(t => t.id === templateId ? { ...t, fieldMapping: { ...t.fieldMapping, [fieldKey]: colKey } } : t);
                    saveMappingTemplates(next);
                    return next;
                });
                addLog('保存済みマッピングの対応を手動で変更しました。', 'info');
            };

            const runAiMapping = async () => {
                if (!apiKey) {
                    addLog('Gemini APIキーが設定されていません。画面右上の設定アイコンから入力してください。', 'error');
                    openSettings();
                    return;
                }
                if (excelHeaders.length === 0) {
                    addLog('先にExcelファイルをアップロードしてください。', 'error');
                    return;
                }
                if (csvRows.length === 0) {
                    addLog('先にCSVファイルをアップロードするか、AI-OCRの解析結果を読み込んでください。', 'error');
                    return;
                }

                setIsProcessing(true);
                addLog(`AIによる項目振り分けを開始します...(${csvRows.length}件)`, 'info');

                try {
                    const sampleExisting = excelRows.slice(-5).map(r => {
                        const obj = {};
                        excelHeaders.forEach((h, i) => { obj[h || `(列名なし${i + 1})`] = r[i] !== undefined ? r[i] : ''; });
                        return obj;
                    });

                    const columnLegend = excelHeaders.map((h, i) => `${columnKeys[i]}: ${h || '(列名なし)'}`).join('\n');
                    const csvFieldLegend = csvHeaders.map((h, i) => `${csvFieldKeys[i]}: ${h}`).join('\n');

                    const prompt = `あなたはExcel台帳へのデータ入力を支援するアシスタントです。
以下の「Excel列一覧」と「Excel既存データのサンプル」を参考にしながら、「CSV新規データ」の各レコードを、Excel側のどの列に入力すべきか意味内容から判断して振り分けてください。

【Excel列一覧（出力時のキーは必ずこのcolN形式を使うこと。列名が同じ/空でも位置(N)で別々の列として区別すること）】
${columnLegend}

【CSV列一覧（出力するfieldMappingのキーは必ずこのfieldN形式を使うこと）】
${csvFieldLegend}

【Excel既存データのサンプル（列名: 値の形。表記ゆれ・日付形式などの参考用）】
${JSON.stringify(sampleExisting, null, 2)}

【CSV新規データ（列名: ${JSON.stringify(csvHeaders)}）】
${JSON.stringify(csvRows, null, 2)}

指示:
- 出力は "rows" と "fieldMapping" の2つのキーを持つオブジェクトとすること。
- "rows": 振り分け結果の配列。各オブジェクトのキーは必ず上記のcol1, col2, ...形式（Excel列一覧のキー）と完全一致させること。
- CSV側の項目名がExcel列名と表記が異なっていても、意味内容が対応していれば値を入れること（例: CSV「会社名」→Excel「取引先名」など）。
- 値は既存データのサンプルの書式（日付形式・全角半角など）にできるだけ合わせて整形すること。
- 対応するCSVデータが存在しない、または該当項目が無いExcel列は空文字列にすること。
- 重要: 1つのCSVレコードの中に、製造番号・専用番号・シリアル番号など「同種の値が複数まとまって1つのセルに入っている」項目がある場合、それは複数件のデータが1レコードにまとめられているとみなし、Excel出力では項目数の分だけ行を分割すること。区切り文字は改行・カンマ・スペース・読点など不定のためOCRの原文から意味的に個々の値を判別すること。複数の項目列（例: 製造番号と専用番号）が両方とも複数値を持つ場合は、各セル内での出現順序で対応付けること（1番目の製造番号と1番目の専用番号が同じ行、2番目同士が次の行、というように）。分割後の各行では、それ以外の共通項目（取引先名・担当者・日付など）は元のCSVレコードの値をそのまま複製すること。
- 分割が不要なレコードはそのまま1レコード=1行として出力すること。CSVレコードの元の順序はできる限り保つこと。
- rowsの件数はCSVレコード数と一致しなくてよい（分割により増える場合がある）。
- "fieldMapping": CSV列一覧の各field1, field2, ...をキーとし、値にはその列が意味的に対応するExcel列のcolN（Excel列一覧のキー）を1つだけ入れること。1つのCSV列が特定の1つのExcel列に実質的に対応する場合は必ずそのcolNを入れること（複数値を含み分割対象になる列も、対応先のcolNがあればそれを入れる）。対応するExcel列がない、または単純な1対1で表せない場合のみ空文字列にすること。この情報は今後同じ形式のCSVが来た際にAIなしで機械的に再利用するためのものであり、rowsの実際の値とは独立して構わない。`;

                    const schema = {
                        type: "OBJECT",
                        properties: {
                            rows: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: Object.fromEntries(columnKeys.map(k => [k, { type: "STRING" }])),
                                    required: columnKeys
                                }
                            },
                            fieldMapping: {
                                type: "OBJECT",
                                properties: Object.fromEntries(csvFieldKeys.map(k => [k, { type: "STRING" }])),
                                required: csvFieldKeys
                            }
                        },
                        required: ["rows", "fieldMapping"]
                    };

                    const result = await callGeminiTextAPI(apiKey, modelName, prompt, schema);
                    if (!result || !Array.isArray(result.rows)) throw new Error('AIの応答の形式が不正です。');
                    setMappedRows(result.rows);
                    setReflected(false);
                    addLog(`AIによる振り分けが完了しました。(${result.rows.length}件) 内容を確認・修正してください。`, 'success');
                    if (result.fieldMapping) {
                        upsertMappingTemplate(result.fieldMapping);
                    }
                } catch (err) {
                    addLog(`AI振り分けエラー: ${err.message}`, 'error');
                } finally {
                    setIsProcessing(false);
                }
            };

            const updateMappedCell = (rowIdx, header, value) => {
                setMappedRows(prev => {
                    const next = [...prev];
                    next[rowIdx] = { ...next[rowIdx], [header]: value };
                    return next;
                });
            };

            const removeMappedRow = (rowIdx) => {
                setMappedRows(prev => prev.filter((_, i) => i !== rowIdx));
            };

            const reflectToExcel = () => {
                if (mappedRows.length === 0) return;
                const newAoaRows = mappedRows.map(row => columnKeys.map(k => row[k] !== undefined ? row[k] : ''));
                setExcelRows(prev => [...prev, ...newAoaRows]);
                setMappedRows([]);
                setReflected(true);
                addLog(`${newAoaRows.length}件をExcelデータに反映しました。ダウンロードして保存してください。`, 'success');
            };

            const downloadExcel = () => {
                if (excelHeaders.length === 0) return;
                const aoa = [excelHeaders, ...excelRows];
                const ws = XLSX.utils.aoa_to_sheet(aoa);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Sheet1');
                const baseName = excelFileName ? excelFileName.replace(/\.[^/.]+$/, '') : 'data';
                XLSX.writeFile(wb, `${baseName}_updated.xlsx`);
                addLog('更新済みExcelファイルをダウンロードしました。', 'success');
            };

            const totalSets = Math.ceil(numPages / pagesPerSet);

            return (
                <div className={viewMode === 'ocr' ? "flex flex-col h-screen bg-[#05070c] text-slate-200 font-sans" : "min-h-screen bg-[#05070c] text-slate-200 font-sans workspace-bg"}>
                    {/* Header */}
                    <header className="bg-slate-900/70 backdrop-blur-xl border-b border-white/10 px-6 py-4 flex items-center justify-between z-20 sticky top-0">
                        <div className="flex items-center gap-3">
                            <div className="bg-gradient-to-br from-violet-500 to-blue-500 p-2.5 rounded-xl shadow-lg shadow-violet-500/30">
                                <Icon name={viewMode === 'ocr' ? 'scan-line' : 'table-properties'} className="text-white w-6 h-6" />
                            </div>
                            <div>
                                <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-violet-400 via-fuchsia-400 to-blue-400 leading-tight">
                                    AI-OCR文字起こしツール
                                </h1>
                                <p className="text-[10px] font-medium text-slate-500 uppercase tracking-widest">{viewMode === 'ocr' ? 'Region-based Extraction Edition' : 'Excel Ledger Integration'}</p>
                            </div>
                            <div className="hidden sm:flex items-center gap-1 bg-white/5 border border-white/10 rounded-full p-1 ml-2">
                                <button
                                    onClick={() => setViewMode('ocr')}
                                    className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all duration-200 flex items-center gap-1.5 ${viewMode === 'ocr' ? 'bg-gradient-to-r from-violet-600 to-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                                >
                                    <Icon name="scan-line" className="w-3.5 h-3.5" /> OCR
                                </button>
                                <button
                                    onClick={() => setViewMode('excel')}
                                    className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all duration-200 flex items-center gap-1.5 ${viewMode === 'excel' ? 'bg-gradient-to-r from-violet-600 to-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                                >
                                    <Icon name="table-properties" className="w-3.5 h-3.5" /> Excel振り分け
                                </button>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            <div className="hidden md:flex items-center gap-1.5 bg-white/5 border border-white/10 rounded-full px-3 py-1.5 text-xs font-medium text-slate-400" title="使用中のAIモデル">
                                <Icon name="cpu" className="w-3.5 h-3.5 text-violet-400" />
                                {modelName}
                            </div>
                            {viewMode === 'ocr' && (
                                <button
                                    onClick={() => setShowLabels(!showLabels)}
                                    className={`p-2 rounded-full transition-all duration-200 ${showLabels ? 'bg-violet-500/20 text-violet-300 ring-1 ring-violet-400/40' : 'bg-white/5 text-slate-500 hover:bg-white/10'}`}
                                    title="ラベル表示ON/OFF"
                                >
                                    <Icon name={showLabels ? "eye" : "eye-off"} className="w-5 h-5" />
                                </button>
                            )}
                            {viewMode === 'excel' && (
                                <button
                                    onClick={() => { setExpandedTemplateId(null); setShowTemplateModal(true); }}
                                    className="relative p-2 text-slate-400 hover:bg-white/10 hover:text-white rounded-full transition-all duration-200"
                                    title="保存済みマッピング管理"
                                >
                                    <Icon name="layout-template" className="w-5 h-5" />
                                    {mappingTemplates.length > 0 && (
                                        <span className="absolute -top-0.5 -right-0.5 min-w-[16px] h-4 px-1 bg-violet-500 rounded-full text-[9px] font-bold text-white flex items-center justify-center">{mappingTemplates.length}</span>
                                    )}
                                </button>
                            )}
                            <button
                                onClick={openSettings}
                                className="relative p-2 text-slate-400 hover:bg-white/10 hover:text-white rounded-full transition-all duration-200"
                                title="API設定"
                            >
                                <Icon name="settings" className="w-5 h-5" />
                                {!apiKey && (

                                ) : (
                                    <div className="space-y-2 overflow-y-auto">
                                        {mappingTemplates.slice().sort((a, b) => b.savedAt - a.savedAt).map(t => {
                                            const ledgerExists = ledgers.some(l => l.id === t.ledgerId);
                                            const ledgerHeaders = ledgerExists ? (loadLedgerData(t.ledgerId)?.headers || []) : [];
                                            return (
                                                <TemplateRow
                                                    key={t.id}
                                                    template={t}
                                                    ledgerExists={ledgerExists}
                                                    ledgerHeaders={ledgerHeaders}
                                                    expanded={expandedTemplateId === t.id}
                                                    onToggleExpand={() => setExpandedTemplateId(prev => prev === t.id ? null : t.id)}
                                                    onDelete={() => { if (confirm(`「${t.ledgerName}」のマッピング(CSV列: ${t.csvHeaders.join('、')})を削除しますか？`)) deleteMappingTemplate(t.id); }}
                                                    onFieldChange={(fieldKey, colKey) => updateTemplateFieldMapping(t.id, fieldKey, colKey)}
                                                />
                                            );
                                        })}
                                    </div>
                                )}
                                <div className="flex justify-end mt-4 shrink-0">
                                    <button onClick={() => setShowTemplateModal(false)} className="px-4 py-2 text-sm text-slate-400 hover:text-white rounded-lg transition-colors">閉じる</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
