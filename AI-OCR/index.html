                                    className="w-full bg-white/5 border border-white/10 text-white p-3 rounded-xl outline-none focus:border-violet-400 focus:ring-2 focus:ring-violet-400/30 text-sm mb-2"
                                >
                                    {GEMINI_MODEL_PRESETS.map(m => <option key={m.value} value={m.value}>{m.label}</option>)}
                                    <option value="__custom__">その他（モデル名を直接入力）</option>
                                </select>
                                <input
                                    type="text" value={modelNameInput} onChange={e => setModelNameInput(e.target.value)}
                                    placeholder="gemini-flash-latest"
                                    className="w-full bg-white/5 border border-white/10 text-white placeholder-slate-600 p-2.5 rounded-xl outline-none focus:border-violet-400 focus:ring-2 focus:ring-violet-400/30 mb-6 font-mono text-sm"
                                />

                                <p className="text-sm text-slate-400 mb-2 leading-relaxed">
                                    テンプレートをクラウドに保存する場合は、Google Apps Script (GAS) の「ウェブアプリURL」を入力してください（任意）。
                                </p>
                                <input
                                    type="text" value={gasUrlInput} onChange={e => setGasUrlInput(e.target.value)}
                                    placeholder="https://script.google.com/macros/s/... （任意）"
                                    className="w-full bg-white/5 border border-white/10 text-white placeholder-slate-600 p-3 rounded-xl outline-none focus:border-violet-400 focus:ring-2 focus:ring-violet-400/30 mb-6 font-mono text-sm"
                                />
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => { setShowGasSettings(false); setGasUrlInput(gasUrl); setApiKeyInput(apiKey); }} className="px-4 py-2 text-slate-400 hover:bg-white/5 rounded-lg font-medium transition-colors">キャンセル</button>
                                    <button onClick={handleSaveSettings} className="bg-gradient-to-r from-violet-600 to-blue-600 hover:from-violet-500 hover:to-blue-500 text-white px-6 py-2 rounded-xl font-bold shadow-lg shadow-violet-900/30 transition-all duration-200">保存</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Save Template Modal */}
                    {showSaveTemplateModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[100]">
                            <div className="bg-slate-900 border border-white/10 rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                                <h3 className="text-lg font-bold mb-4 text-white">テンプレートの保存</h3>

                                {!gasUrl ? (
                                    <p className="text-sm text-slate-400 mb-6">
                                        テンプレートの保存にはGAS WebアプリURLの設定が必要です。設定アイコンから入力してください。
                                    </p>
                                ) : activeTemplateName ? (
                                    <div className="mb-6">
                                        <p className="text-sm text-slate-400 mb-4">現在「<span className="font-bold text-white">{activeTemplateName}</span>」を編集中です。どう保存しますか？</p>

                                        <div className="flex flex-col gap-3">
                                            <button
                                                onClick={() => handleSaveTemplate(true)}
                                                className="w-full bg-gradient-to-r from-violet-600 to-blue-600 hover:from-violet-500 hover:to-blue-500 text-white px-4 py-2.5 rounded-xl text-sm font-bold shadow-lg shadow-violet-900/30 flex items-center justify-center gap-2 transition-all duration-200"
                                            >
                                                <Icon name="save" className="w-4 h-4" /> 現在の設定に上書き保存
                                            </button>

                                            <div className="relative flex py-2 items-center">
                                                <div className="flex-grow border-t border-white/10"></div>
                                                <span className="flex-shrink-0 mx-4 text-slate-600 text-xs">または別名で保存</span>
                                                <div className="flex-grow border-t border-white/10"></div>
                                            </div>

                                            <input
                                                type="text" value={newTemplateName} onChange={e => setNewTemplateName(e.target.value)}
                                                placeholder="新しいテンプレート名"
                                                className="w-full bg-white/5 border border-white/10 text-white placeholder-slate-600 p-2.5 rounded-xl outline-none focus:border-violet-400 text-sm"
                                            />
                                            <button
                                                onClick={() => handleSaveTemplate(false)}
                                                disabled={!newTemplateName.trim()}
                                                className="w-full bg-transparent border border-violet-500/50 text-violet-300 px-4 py-2 rounded-xl hover:bg-violet-500/10 disabled:opacity-40 disabled:border-white/10 disabled:text-slate-600 text-sm font-bold transition-all duration-200"
                                            >
                                                新規として保存
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="mb-6">
                                        <input
                                            type="text" value={newTemplateName} onChange={e => setNewTemplateName(e.target.value)}
                                            placeholder="例: 株式会社A 請求書フォーマット"
                                            className="w-full bg-white/5 border border-white/10 text-white placeholder-slate-600 p-2.5 rounded-xl outline-none focus:border-violet-400 text-sm"
                                        />
                                    </div>
                                )}

                                <div className="flex justify-end gap-2 mt-2">
                                    <button onClick={() => setShowSaveTemplateModal(false)} className="px-4 py-2 text-slate-400 hover:bg-white/5 rounded-lg text-sm font-medium transition-colors">キャンセル</button>
                                    {gasUrl && !activeTemplateName && (
                                        <button onClick={() => handleSaveTemplate(false)} disabled={!newTemplateName.trim()} className="bg-gradient-to-r from-violet-600 to-blue-600 hover:from-violet-500 hover:to-blue-500 text-white px-4 py-2 rounded-xl disabled:from-slate-700 disabled:to-slate-700 disabled:text-slate-500 text-sm font-bold shadow-lg shadow-violet-900/30 transition-all duration-200">保存</button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
