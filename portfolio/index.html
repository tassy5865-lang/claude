const escapeHTML = (value) => String(value ?? '').replace(/[&<>"']/g, char => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
})[char]);

function sanitizeRichHTML(value){
  const template = document.createElement('template');
  template.innerHTML = String(value ?? '');
  const allowedTags = new Set(['B', 'BR', 'SPAN']);
  template.content.querySelectorAll('*').forEach(element => {
    if (!allowedTags.has(element.tagName)) {
      element.replaceWith(document.createTextNode(element.textContent || ''));
      return;
    }
    const keepRoleAccent = element.tagName === 'SPAN' && element.classList.contains('role-accent');
    Array.from(element.attributes).forEach(attribute => element.removeAttribute(attribute.name));
    if (keepRoleAccent) element.className = 'role-accent';
  });
  return template.innerHTML;
}

function safeHref(value){
  const href = String(value ?? '').trim();
  if (href.startsWith('#')) return href;
  try {
    const url = new URL(href, window.location.href);
    return ['https:', 'mailto:'].includes(url.protocol) ? href : '#';
  } catch {
    return '#';
  }
}

function safeImage(value){
  const image = String(value || '');
  return /^(?:assets\/work-|\.\.\/自己紹介HP\/assets\/work-)[a-z-]+\.png$/.test(image) ? image : '';
}

  <div class="work-grid" id="work-list">
    ${SITE.works.cards.map((c,i) => `
      <article class="work-card" data-tag="${escapeHTML(c.tag)}">
        <figure class="work-visual"><button class="work-preview-btn" type="button" data-work-index="${i}" aria-label="${escapeHTML(c.title)}の画面と改善内容を見る"><img src="${escapeHTML(safeImage(c.image))}" alt="${escapeHTML(c.imageAlt)}" loading="lazy" decoding="async" width="960" height="600"><span class="preview-hint" aria-hidden="true">画面・詳細を見る ↗</span></button></figure>
        <div class="head"><div class="tag">${escapeHTML(c.tag)}</div><div class="status">${escapeHTML(c.status)}</div></div>
        <h3>${escapeHTML(c.title)}</h3>
        <p>${escapeHTML(c.text)}</p>
        <dl class="work-summary"><div><dt>困りごと</dt><dd>${escapeHTML(c.challenge)}</dd></div><div><dt>できること</dt><dd>${escapeHTML(c.benefit)}</dd></div></dl>
        <div class="actions">
          <a class="link" href="${escapeHTML(safeHref(c.href))}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHTML(c.title)}を別タブで開く">${c.tag === "Web制作" ? "サイトを開く" : "ツールを開く"} ↗</a>
          <button type="button" class="work-detail-btn" data-index="${i}" aria-label="${escapeHTML(c.title)}の改善内容を見る">改善内容を見る</button>
        </div>
      </article>
    `).join('')}
  </div>
`;

// タグフィルターの動作
const filterButtons = document.querySelectorAll('.tag-filter button');
const workCards = document.querySelectorAll('.work-card');
filterButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    filterButtons.forEach(b => {
      b.classList.remove('active');
      b.setAttribute('aria-pressed', 'false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-pressed', 'true');
    const target = btn.dataset.filter;
    workCards.forEach(card => {
      const show = (target === 'すべて' || card.dataset.tag === target);
      card.classList.toggle('is-hidden', !show);
      card.hidden = !show;
    });
    const count = [...workCards].filter(card => !card.hidden).length;
    document.getElementById("result-count").textContent = target === "すべて" ? `全${count}件を表示` : `${target}：${count}件を表示`;
  });
});

// 実績詳細モーダル(Before/After・活用シーン)
const workModal = document.getElementById('work-modal');
const modalBox = workModal.querySelector('.modal-box');
let lastFocusedElement = null;

function openWorkModal(index){
  const c = SITE.works.cards[index];
  if (!c) return;
  lastFocusedElement = document.activeElement;
  document.getElementById('modal-tag').textContent = c.tag;
  document.getElementById('modal-title').textContent = c.title;
  document.getElementById('modal-desc').textContent = c.text;
  document.getElementById('modal-image').src = safeImage(c.image);
  document.getElementById('modal-image').alt = c.imageAlt;
  document.getElementById('modal-image-caption').textContent = c.imageAlt;
  document.getElementById('modal-tech').textContent = c.tech;
  document.getElementById('modal-open').href = safeHref(c.href);
  document.getElementById('modal-consult').href = consultationHref(c.title);
  document.getElementById('modal-before').textContent = c.before || '';
  document.getElementById('modal-after').textContent = c.after || '';
  const useCaseList = document.getElementById('modal-usecases');
  useCaseList.replaceChildren(...(c.useCases || []).map(useCase => {
    const item = document.createElement('li');
    item.textContent = useCase;
    return item;
  }));
  workModal.classList.add('is-open');
  workModal.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  document.querySelectorAll('nav, main, footer').forEach(el => el.inert = true);
  modalBox.focus();
  modalBox.scrollTop = 0;
}
function closeWorkModal(){
  if (!workModal.classList.contains('is-open')) return;
  workModal.classList.remove('is-open');
  workModal.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  document.querySelectorAll('nav, main, footer').forEach(el => el.inert = false);
  lastFocusedElement?.focus();
}
document.querySelectorAll('.work-detail-btn').forEach(btn => {
  btn.addEventListener('click', () => openWorkModal(Number(btn.dataset.index)));
});
document.querySelectorAll('[data-work-index]').forEach(btn => {
  btn.addEventListener('click', () => openWorkModal(Number(btn.dataset.workIndex)));
});
document.getElementById('modal-close').addEventListener('click', closeWorkModal);
workModal.addEventListener('click', (e) => { if (e.target === workModal) closeWorkModal(); });
document.addEventListener('keydown', (event) => {
  if (!workModal.classList.contains('is-open')) return;
  if (event.key === 'Escape') {
    closeWorkModal();
    return;
  }
  if (event.key !== 'Tab') return;
  const focusable = Array.from(modalBox.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])'));
  if (!focusable.length) {
    event.preventDefault();
    modalBox.focus();
    return;
  }
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (event.shiftKey && (document.activeElement === first || document.activeElement === modalBox)) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
});

document.getElementById('linkout-wrap').innerHTML = `
  <div class="eyebrow center">${escapeHTML(SITE.linkout.eyebrow)}</div>
  <div class="linkout-card">
    <div class="txt"><h2>${escapeHTML(SITE.linkout.cardTitle)}</h2><p>${escapeHTML(SITE.linkout.cardText)}</p></div>
    <a class="btn-primary" href="${escapeHTML(safeHref(SITE.linkout.cardLinkHref))}" target="_blank" rel="noopener noreferrer">${escapeHTML(SITE.linkout.cardLinkLabel)}</a>
  </div>
`;

document.getElementById('cta-wrap').innerHTML = `
  <div class="eyebrow center" style="color:rgba(255,255,255,0.85);">${escapeHTML(SITE.contact.eyebrow)}</div>
  <h2>${escapeHTML(SITE.contact.title)}</h2>
  <div class="hero-ctas">
    ${SITE.contact.ctas.map((c,i) => `
      <a class="${i===0 ? 'btn-primary' : 'btn-line'}"${externalAttributes(c.href)} href="${escapeHTML(safeHref(c.href.startsWith('mailto:') ? consultationHref() : c.href))}">${escapeHTML(c.label)}</a>
      ${c.showQrOnClick ? '<button class="btn-line qr-toggle" type="button" aria-controls="line-cta-qr" aria-expanded="false">QRコードを表示</button>' : ''}
    `).join('')}
  </div>
  <div class="cta-note">${escapeHTML(SITE.contact.note)}</div>
  <div class="cta-qr" id="line-cta-qr" role="region" aria-labelledby="line-qr-caption" hidden>
    <img src="${LINE_QR_IMAGE_PATH}" width="120" height="120" loading="lazy" decoding="async" alt="田代裕貴 公式LINEの友だち追加用QRコード">
    <span id="line-qr-caption">${escapeHTML(SITE.contact.qr.caption)}</span>
  </div>
`;
document.querySelector('.qr-toggle')?.addEventListener('click', event => {
  const qr = document.getElementById('line-cta-qr');
  const willShow = qr.hidden;
  qr.hidden = !willShow;
  qr.classList.toggle('is-visible', willShow);
  event.currentTarget.setAttribute('aria-expanded', String(willShow));
  event.currentTarget.textContent = willShow ? 'QRコードを閉じる' : 'QRコードを表示';
});

document.getElementById('footer-wrap').innerHTML = `
  <div>${sanitizeRichHTML(SITE.footer.left)}</div>
  <div class="flinks">${SITE.footer.links.map(l => `<a href="${escapeHTML(safeHref(l.href))}"${externalAttributes(l.href)}>${escapeHTML(l.label)}</a>`).join('')}</div>
  <div style="margin-top:0.8rem;">${sanitizeRichHTML(SITE.footer.copyright)}</div>
`;

const nav = document.getElementById('nav');
let scrollTicking = false;
const updateNav = () => {
  nav.classList.toggle('scrolled', window.scrollY > 40);
  scrollTicking = false;
};
window.addEventListener('scroll', () => {
  if (scrollTicking) return;
  scrollTicking = true;
  window.requestAnimationFrame(updateNav);
}, { passive:true });
updateNav();
</script>
