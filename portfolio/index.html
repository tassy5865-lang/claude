<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4F7FA;
    --cream-soft:#FFFFFF;
    --ink:#1A2332;
    --ink-soft:#5B6B82;
    --gold:#1E3A5F;
    --gold-soft:#4A90D9;
    --green:#1E3A5F;
    --green-light:#2F5C8A;
    --black:#101826;
    --line: rgba(26,35,50,0.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{ background:var(--cream); color:var(--ink); font-family:'Noto Sans JP',sans-serif; }
  ::selection{background:var(--gold-soft); color:#fff;}
  a{color:inherit; text-decoration:none;}
  h1,h2,h3{font-family:'Shippori Mincho',serif; font-weight:600; letter-spacing:0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  .eyebrow{
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-family:'IBM Plex Mono',monospace; font-size:0.72rem; letter-spacing:0.22em;
    color:var(--gold); text-transform:uppercase; font-weight:500; margin-bottom:1.1rem;
  }
  .eyebrow::after{ content:''; width:30px; height:1px; background:var(--gold); }
  section{ padding:6.5rem 6vw; }
  .wrap{ max-width:1180px; margin:0 auto; }
  .center-text{ text-align:center; max-width:720px; margin:0 auto; }
  .section-sub{ color:var(--ink-soft); font-size:0.98rem; line-height:1.85; margin-top:1.2rem; }

  nav{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; justify-content:space-between; align-items:center;
    padding:20px 6vw; transition:background .3s ease, box-shadow .3s ease;
  }
  nav.scrolled{ background:rgba(244,247,250,0.92); backdrop-filter:blur(8px); box-shadow:0 1px 0 var(--line); }
  .nav-name{ font-family:'Shippori Mincho',serif; font-size:1.05rem; font-weight:600; }
  .nav-role{ font-family:'IBM Plex Mono',monospace; font-size:0.7rem; color:var(--gold); margin-left:0.6rem; letter-spacing:0.02em;}
  .role-accent{ color:var(--gold-soft); font-weight:600; }
  .nav-cta{ background:var(--green); color:#fff; padding:0.65rem 1.35rem; border-radius:6px; font-size:0.82rem; font-weight:500; transition:background .2s ease; }
  .nav-cta:hover{ background:var(--green-light); }

  #hero{ padding-top:11rem; padding-bottom:5rem; text-align:center; background:radial-gradient(circle at 50% 0%, #FDFDFC 0%, var(--cream) 60%); }
  .badge{ display:inline-flex; align-items:center; gap:9px; background:#fff; border:1px solid var(--line); border-radius:100px; padding:0.55rem 1.2rem; font-size:0.82rem; color:var(--ink-soft); margin-bottom:2.4rem; }
  .badge .dot{ width:7px; height:7px; border-radius:50%; background:var(--green-light); }
  #hero h1{ font-size:clamp(2.2rem, 5vw, 3.4rem); line-height:1.4; color:var(--ink); max-width:780px; margin:0 auto; }
  #hero h1 .accent{ color:var(--gold-soft); }
  #hero .lead{ max-width:640px; margin:1.8rem auto 0; color:var(--ink-soft); font-size:1rem; line-height:1.9; }
  #hero .lead b{ color:var(--ink); font-weight:600; }
  .hero-ctas{ display:flex; gap:1rem; justify-content:center; margin-top:2.6rem; flex-wrap:wrap; }
  .btn-primary{ background:var(--green); color:#fff; padding:1rem 1.8rem; border-radius:8px; font-size:0.92rem; font-weight:600; transition:background .2s ease; display:inline-block;}
  .btn-primary:hover{ background:var(--green-light); }
  .btn-secondary{ background:#fff; border:1px solid var(--line); color:var(--ink); padding:1rem 1.8rem; border-radius:8px; font-size:0.92rem; font-weight:500; }
  .hero-note{ margin-top:1.1rem; font-size:0.78rem; color:var(--ink-soft); }

  .stat-row{ display:flex; justify-content:center; gap:4rem; margin-top:4.5rem; padding-top:3rem; border-top:1px solid var(--line); max-width:820px; margin-left:auto; margin-right:auto; flex-wrap:wrap; }
  .stat{ text-align:center; }
  .stat .num{ font-family:'Shippori Mincho',serif; font-size:2.2rem; color:var(--gold); font-weight:600;}
  .stat .num span{ font-size:1.1rem; margin-left:2px; }
  .stat .label{ font-size:0.78rem; color:var(--ink-soft); margin-top:0.4rem; }

  .dark{ background:var(--black); color:#EDE8DE; }
  .dark .eyebrow{ color:var(--gold-soft); }
  .dark .eyebrow::after{ background:var(--gold-soft); }
  .dark h2{ color:#F5F1E8; }
  .dark .section-sub{ color:#A9B3C4; }

  .card-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:1.1rem; margin-top:3.2rem; }
  .pain-card{ background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:1.6rem; display:flex; gap:0.9rem; align-items:flex-start; }
  .pain-card .ico{ width:34px; height:34px; border-radius:8px; background:rgba(74,144,217,0.16); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--gold-soft); font-size:1rem; }
  .pain-card p{ font-size:0.9rem; line-height:1.65; color:#D2D8E2; }

  .quote-box{ margin-top:2.6rem; border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:2.4rem 2.6rem; background:rgba(255,255,255,0.03); }
  .quote-box p{ font-size:1.05rem; line-height:1.85; color:#EDE8DE; }
  .quote-box p b{ color:var(--gold-soft); font-weight:600; }

  #works .stat-row{ border-top:none; padding-top:0; margin-top:2.6rem; gap:2.5rem;}
  #works .stat .num{ color:var(--gold-soft); }
  #works .stat .label{ color:#A9B3C4; }
  .tag-filter{ display:flex; gap:0.6rem; justify-content:center; flex-wrap:wrap; margin-top:2.6rem; }
  .tag-filter button{
    font-family:'IBM Plex Mono',monospace; font-size:0.72rem; letter-spacing:0.06em;
    padding:0.5rem 1.1rem; border-radius:100px; border:1px solid rgba(255,255,255,0.18);
    background:transparent; color:#A9B3C4; cursor:pointer; transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .tag-filter button:hover{ border-color:var(--gold-soft); color:#F5F1E8; }
  .tag-filter button.active{ background:var(--gold-soft); border-color:var(--gold-soft); color:#fff; font-weight:600; }

  .work-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.1rem; margin-top:3rem;}
  .work-card{ background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:1.7rem; display:flex; flex-direction:column; transition:opacity .25s ease, transform .25s ease, border-color .2s ease; }
  .work-card:hover{ border-color:rgba(74,144,217,0.4); }
  .work-card.is-hidden{ display:none; }
  .work-card .head{ display:flex; justify-content:space-between; align-items:flex-start; gap:0.6rem; }
  .work-card .tag{ font-family:'IBM Plex Mono',monospace; font-size:0.68rem; color:var(--gold-soft); letter-spacing:0.06em; }
  .work-card .status{ font-family:'IBM Plex Mono',monospace; font-size:0.65rem; letter-spacing:0.04em; background:rgba(47,92,138,0.35); color:#9FC4EE; padding:0.25rem 0.6rem; border-radius:100px; white-space:nowrap; }
  .work-card h3{ font-size:1.08rem; margin:0.8rem 0 0.7rem; color:#F5F1E8; }
  .work-card p{ font-size:0.85rem; color:#B9C2D1; line-height:1.7; flex-grow:1; }
  .work-card .tech{ font-family:'IBM Plex Mono',monospace; font-size:0.7rem; color:#7E8AA0; margin-top:1rem; }
  .work-card .link{ margin-top:1.2rem; font-size:0.82rem; color:var(--gold-soft); font-weight:600; display:inline-flex; align-items:center; gap:0.3rem; }
  .work-card .link:hover{ color:#fff; }

  #linkout{ background:var(--cream-soft); }
  .linkout-card{ margin-top:3rem; background:#fff; border:1px solid var(--line); border-radius:16px; padding:2.4rem; display:flex; justify-content:space-between; align-items:center; gap:1.5rem; flex-wrap:wrap; }
  .linkout-card .txt h3{ font-size:1.1rem; margin-bottom:0.5rem; }
  .linkout-card .txt p{ font-size:0.88rem; color:var(--ink-soft); line-height:1.7; }

  #cta{ background:linear-gradient(135deg, var(--green), #0F2038); text-align:center; color:#fff; padding:6rem 6vw; }
  #cta h2{ color:#fff; font-size:clamp(1.7rem,4vw,2.5rem); }
  #cta .btn-primary{ background:#fff; color:var(--green); margin-top:2.2rem; }
  #cta .btn-primary:hover{ background:#F5F1E8; }
  #cta .cta-note{ margin-top:1rem; font-size:0.8rem; color:rgba(255,255,255,0.75); }

  footer{ background:var(--black); color:#8A8375; padding:2.6rem 6vw; text-align:center; font-size:0.8rem; }
  footer .flinks{ margin-top:0.8rem; display:flex; gap:1.4rem; justify-content:center; }
  footer .flinks a{ color:#A9B3C4; }
  footer .flinks a:hover{ color:#fff; }

  @media (max-width:860px){
    .card-grid, .work-grid{ grid-template-columns:1fr !important; }
    .stat-row{ gap:2rem; }
    section{ padding:4.5rem 6vw; }
    .nav-role{ display:none; }
    .linkout-card{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>

<nav id="nav">

document.getElementById('nav-name').innerHTML = SITE.nav.name;

  <div class="eyebrow center">${SITE.works.eyebrow}</div>
  <div class="center-text"><h2>${SITE.works.title}</h2><p class="section-sub">${SITE.works.sub}</p></div>

`;

// タグフィルターの動作
const filterButtons = document.querySelectorAll('.tag-filter button');
const workCards = document.querySelectorAll('.work-card');
filterButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    filterButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const target = btn.dataset.filter;
    workCards.forEach(card => {
      const show = (target === 'ALL' || card.dataset.tag === target);
      card.classList.toggle('is-hidden', !show);
    });
  });
});

  <div class="center-text"><h2>${SITE.linkout.title}</h2><p class="section-sub">${SITE.linkout.sub}</p></div>
  <div class="linkout-card">
    <div class="txt"><h3>${SITE.linkout.cardTitle}</h3><p>${SITE.linkout.cardText}</p></div>
    <a class="btn-primary" href="${SITE.linkout.cardLinkHref}" target="_blank" rel="noopener">${SITE.linkout.cardLinkLabel}</a>
  </div>
`;

document.getElementById('cta-wrap').innerHTML = `
  <div class="eyebrow center" style="color:rgba(255,255,255,0.85);">${SITE.contact.eyebrow}</div>
  <h2 id="contact">${SITE.contact.title}</h2>
  <a class="btn-primary" href="${SITE.contact.linkHref}">${SITE.contact.linkLabel}</a>
  <div class="cta-note">${SITE.contact.note}</div>
`;

document.getElementById('footer-wrap').innerHTML = `
  <div>${SITE.footer.left}</div>
  <div class="flinks">${SITE.footer.links.map(l => `<a href="${l.href}" target="_blank" rel="noopener">${l.label}</a>`).join('')}</div>
  <div style="margin-top:0.8rem;">${SITE.footer.copyright}</div>
`;

const nav = document.getElementById('nav');
window.addEventListener('scroll', () => {
  nav.classList.toggle('scrolled', window.scrollY > 40);
});
</script>

</body>
